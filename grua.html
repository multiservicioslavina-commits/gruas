<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- SEO tags filled by JS -->
  <title id="pageTitle">Grúa para motos — Ridera</title>
  <meta name="description" id="pageDesc" content="Servicio de grúa para motos en Colombia. Solicita tu grúa ahora.">
  <meta property="og:type" content="business.business">
  <meta property="og:title" id="ogTitle" content="Grúa para motos — Ridera">
  <meta property="og:description" id="ogDesc" content="Servicio de grúa para motos en Colombia.">
  <meta property="og:image" id="ogImage" content="">
  <meta property="og:url" id="ogUrl" content="">
  <link rel="canonical" id="canonicalUrl" href="">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0e0e0e; --surface: #1a1a1a; --surface2: #222;
      --border: #2a2a2a; --accent: #E85D20; --text: #f0f0f0; --muted: #888;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }

    /* NAV */
    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 1.5rem;
      display: flex; align-items: center; height: 56px;
    }
    .nav-brand { font-weight: 700; color: var(--accent); text-decoration: none; font-size: 1.1rem; }

    /* LOADING / NOT FOUND */
    #loading, #notFound {
      min-height: 60vh;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 1rem; color: var(--muted);
    }
    .spinner { width: 32px; height: 32px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #notFound { display: none; }
    #profile { display: none; }

    /* PROFILE */
    .container { max-width: 760px; margin: 0 auto; padding: 2rem 1rem 4rem; }

    .hero {
      display: flex; align-items: flex-start; gap: 1.5rem;
      flex-wrap: wrap; margin-bottom: 2rem;
    }
    .hero-avatar {
      width: 96px; height: 96px; border-radius: 50%;
      object-fit: cover; border: 3px solid var(--border);
      flex-shrink: 0;
    }
    .hero-avatar-placeholder {
      width: 96px; height: 96px; border-radius: 50%;
      background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.5rem; font-weight: 700; color: #fff;
      flex-shrink: 0;
    }
    .hero-info { flex: 1; min-width: 200px; }
    .hero-info h1 { font-size: 1.75rem; font-weight: 800; line-height: 1.2; }
    .hero-info .subtitle { color: var(--muted); margin-top: 0.35rem; font-size: 0.95rem; }
    .badge-disp {
      display: inline-flex; align-items: center; gap: 0.4rem;
      font-size: 0.8rem; padding: 0.3rem 0.75rem;
      border-radius: 20px; font-weight: 600; margin-top: 0.6rem;
    }
    .badge-on  { background: #0e2a1a; color: #4ade80; border: 1px solid #1a5c36; }
    .badge-off { background: #2a1212; color: #f87171; border: 1px solid #6b1e1e; }
    .dot { width: 8px; height: 8px; border-radius: 50%; }
    .dot-on  { background: #4ade80; }
    .dot-off { background: #f87171; }

    /* CTA */
    .cta-card {
      background: var(--accent);
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      margin-bottom: 2rem;
    }
    .cta-card p { margin-bottom: 1rem; font-size: 1rem; }
    .btn-wa {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: #25D366; color: #fff;
      font-size: 1rem; font-weight: 700;
      padding: 0.85rem 2rem;
      border-radius: 8px; text-decoration: none;
      transition: background 0.2s;
    }
    .btn-wa:hover { background: #1aad52; }

    /* INFO SECTION */
    .section {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 1.5rem; margin-bottom: 1.25rem;
    }
    .section h2 { font-size: 0.9rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 1rem; }
    .info-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 0.75rem; }
    .info-item .lbl { font-size: 0.75rem; color: var(--muted); margin-bottom: 0.2rem; }
    .info-item .val { font-size: 0.95rem; }
    .desc-text { color: #ccc; line-height: 1.6; font-size: 0.95rem; }
    .chip-row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }
    .chip {
      display: inline-flex; align-items: center;
      font-size: 0.8rem; padding: 0.3rem 0.75rem;
      border-radius: 20px; border: 1px solid var(--border);
      background: #1a1a2a; color: #c4c4e0;
    }
    .chip.chip-srv { background: rgba(232,93,32,0.08); border-color: rgba(232,93,32,0.3); color: #f0a070; }
    .chip.chip-acepta { background: rgba(74,222,128,0.06); border-color: rgba(74,222,128,0.25); color: #86efac; }
    .badge-cal {
      display: inline-flex; align-items: center; gap: 0.4rem;
      font-size: 0.8rem; font-weight: 600;
      padding: 0.3rem 0.75rem; border-radius: 20px;
      background: #1a1400; color: #facc15; border: 1px solid #4a3800;
      margin-top: 0.5rem; margin-left: 0.5rem;
    }

    /* SCHEMA added by JS */
  </style>
</head>
<body>
  <nav>
    <a class="nav-brand" href="https://gruas.ridera.com.co/">Ridera Grúas</a>
  </nav>

  <div id="loading">
    <div class="spinner"></div>
    <span>Cargando perfil…</span>
  </div>

  <div id="notFound">
    <h2>Perfil no encontrado</h2>
    <p>Este gruero no existe o aún no ha sido aprobado.</p>
    <a href="https://gruas.ridera.com.co/" style="color:var(--accent);margin-top:1rem;display:inline-block">Ver todos los grueros →</a>
  </div>

  <div id="profile">
    <div class="container">
      <!-- HERO -->
      <div class="hero">
        <div id="avatarEl"></div>
        <div class="hero-info">
          <h1 id="hNombre"></h1>
          <p class="subtitle" id="hSubtitle"></p>
          <div id="hDisp"></div>
        </div>
      </div>

      <!-- CTA -->
      <div class="cta-card" id="ctaCard">
        <p>¿Necesitas una grúa para tu moto ahora mismo?</p>
        <a class="btn-wa" id="ctaWa" href="#">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.123.554 4.117 1.528 5.847L.057 23.571l5.869-1.519A11.938 11.938 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.956 0-3.792-.5-5.394-1.378l-.387-.229-3.484.904.93-3.395-.249-.401A9.938 9.938 0 012 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/></svg>
          Solicitar grúa por WhatsApp
        </a>
      </div>

      <!-- SERVICIOS CHIPS -->
      <div class="section" id="srvSection" style="display:none">
        <h2>Servicios</h2>
        <div class="chip-row" id="srvChips"></div>
        <div id="aceptaWrap" style="display:none;margin-top:1rem">
          <h2 style="margin-bottom:0.5rem">Acepta</h2>
          <div class="chip-row" id="aceptaChips"></div>
        </div>
      </div>

      <!-- INFO -->
      <div class="section">
        <h2>Información del servicio</h2>
        <div class="info-grid" id="infoGrid"></div>
      </div>

      <div class="section" id="descSection" style="display:none">
        <h2>Descripción</h2>
        <p class="desc-text" id="hDesc"></p>
      </div>
    </div>
  </div>

  <script>
    const FN_BASE = 'https://vzzxsdtsaahhzyctvmhx.supabase.co/functions/v1';

    function getSlug() {
      const params = new URLSearchParams(location.search);
      return params.get('slug') || location.pathname.split('/').filter(Boolean).pop();
    }

    function fmt(val) { return val && String(val).trim() ? String(val).trim() : null; }

    async function load() {
      const slug = getSlug();
      if (!slug) { show('notFound'); return; }

      let data;
      try {
        const res = await fetch(`${FN_BASE}/mi-perfil?slug=${encodeURIComponent(slug)}`);
        data = await res.json();
      } catch {
        show('notFound'); return;
      }

      if (data.error || !data.gruero) { show('notFound'); return; }
      render(data.gruero, data.stats || {});
    }

    function show(id) {
      document.getElementById('loading').style.display  = 'none';
      document.getElementById('notFound').style.display = id === 'notFound' ? 'flex' : 'none';
      document.getElementById('profile').style.display  = id === 'profile'  ? 'block' : 'none';
    }

    function render(g, stats) {
      const nombre   = fmt(g.nombre) || 'Gruero Ridera';
      const ciudad   = fmt(g.ciudad) || 'Colombia';
      const d        = g.datos || {};
      const desc     = fmt(d.descripcion) || '';
      const tel      = fmt(g.telefono) || fmt(d.whatsapp) || '';
      const disp     = g.disponible;
      const foto     = fmt(d.foto_url) || fmt(g.foto_url) || '';
      const municipios = Array.isArray(g.municipios) ? g.municipios.join(', ') : fmt(g.municipios) || '';

      // Page meta
      const pageTitle  = `${nombre} — Grúa para motos en ${ciudad} | Ridera`;
      const pageDesc   = desc || `Servicio de grúa para motos en ${ciudad}. Disponible ${disp ? 'ahora' : 'bajo pedido'}.`;
      document.title                                              = pageTitle;
      document.getElementById('pageDesc').content                = pageDesc;
      document.getElementById('ogTitle').content                 = pageTitle;
      document.getElementById('ogDesc').content                  = pageDesc;
      document.getElementById('ogUrl').content                   = location.href;
      document.getElementById('canonicalUrl').href               = location.href;
      if (foto) document.getElementById('ogImage').content       = foto;

      // Schema.org LocalBusiness
      const schema = {
        '@context': 'https://schema.org',
        '@type': 'AutoRepair',
        name: nombre,
        description: pageDesc,
        address: { '@type': 'PostalAddress', addressLocality: ciudad, addressCountry: 'CO' },
        telephone: tel || undefined,
        image: foto || undefined,
        url: location.href,
        areaServed: municipios || ciudad,
        openingHours: disp ? 'Mo-Su 00:00-24:00' : undefined,
      };
      const sd = document.createElement('script');
      sd.type = 'application/ld+json';
      sd.text = JSON.stringify(schema);
      document.head.appendChild(sd);

      // Avatar
      const avatarEl = document.getElementById('avatarEl');
      if (foto) {
        avatarEl.innerHTML = `<img class="hero-avatar" src="${foto}" alt="${nombre}">`;
      } else {
        avatarEl.innerHTML = `<div class="hero-avatar-placeholder">${nombre[0].toUpperCase()}</div>`;
      }

      // Info
      document.getElementById('hNombre').textContent  = nombre;
      document.getElementById('hSubtitle').textContent = ciudad + (municipios ? ` · ${municipios}` : '');

      const dispEl = document.getElementById('hDisp');
      let dispHtml = disp
        ? `<span class="badge-disp badge-on"><span class="dot dot-on"></span>Disponible ahora</span>`
        : `<span class="badge-disp badge-off"><span class="dot dot-off"></span>No disponible en este momento</span>`;
      if (stats.calificacion_promedio) {
        const n = stats.total_calificaciones || '';
        dispHtml += `<span class="badge-cal">⭐ ${stats.calificacion_promedio}${n ? ` · ${n} reseñ${n === 1 ? 'a' : 'as'}` : ''}</span>`;
      }
      dispEl.innerHTML = dispHtml;

      // CTA WhatsApp
      if (tel) {
        const waNum = tel.replace(/\D/g, '');
        const waMsg = encodeURIComponent(`Hola ${nombre}, los encontré en Ridera y quiero solicitar una grúa para mi moto.`);
        document.getElementById('ctaWa').href = `https://wa.me/57${waNum}?text=${waMsg}`;
      } else {
        document.getElementById('ctaCard').style.display = 'none';
      }

      // Servicios chips
      const srvRaw = d.servicios ?? g.servicios;
      const srvArr = Array.isArray(srvRaw) ? srvRaw : (srvRaw ? String(srvRaw).split(',').map(s => s.trim()).filter(Boolean) : []);
      const aceptaRaw = d.acepta ?? g.acepta;
      const aceptaArr = Array.isArray(aceptaRaw) ? aceptaRaw : (aceptaRaw ? String(aceptaRaw).split(',').map(s => s.trim()).filter(Boolean) : []);
      if (srvArr.length) {
        document.getElementById('srvChips').innerHTML = srvArr.map(s => `<span class="chip chip-srv">${s}</span>`).join('');
        document.getElementById('srvSection').style.display = 'block';
      }
      if (aceptaArr.length) {
        document.getElementById('aceptaChips').innerHTML = aceptaArr.map(a => `<span class="chip chip-acepta">${a}</span>`).join('');
        document.getElementById('aceptaWrap').style.display = 'block';
      }

      // Info grid (facts only)
      const fields = [
        ['Ciudad',       ciudad],
        ['Municipios',   municipios],
        ['Teléfono',     tel],
        ['Precio desde', d.precio_desde ? `$${Number(d.precio_desde).toLocaleString('es-CO')}` : null],
        ['Precio hasta', d.precio_hasta ? `$${Number(d.precio_hasta).toLocaleString('es-CO')}` : null],
        ['Tiempo de llegada', fmt(d.tiempo_llegada)],
        ['Flota',        fmt(d.flota ?? g.flota)],
        ['Experiencia',  fmt(d.experiencia ?? g.experiencia)],
        ['Horario',      fmt(d.disponibilidad)],
        ['Total servicios', stats.total_servicios > 0 ? String(stats.total_servicios) : null],
      ].filter(([, v]) => v);

      document.getElementById('infoGrid').innerHTML = fields.map(([l, v]) =>
        `<div class="info-item"><div class="lbl">${l}</div><div class="val">${v}</div></div>`
      ).join('');

      // Descripción
      if (desc) {
        document.getElementById('hDesc').textContent = desc;
        document.getElementById('descSection').style.display = 'block';
      }

      show('profile');
    }

    load();
  </script>
</body>
</html>
