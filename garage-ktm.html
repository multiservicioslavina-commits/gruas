<style>
#ridera-garage{
  --bg:#09090b;--acc:#FF6600;--acc-soft:#ff8a33;

    var(--bg);

}

    linear-gradient(90deg,rgba(255,102,0,.03) 1px,transparent 1px);

  mask-image:linear-gradient(180deg,rgba(0,0,0,.8) 0,transparent 480px);
}

.rg-back-link:hover{color:var(--acc);border-color:rgba(255,102,0,.35)}
.rg-hero{padding:40px 0 40px;max-width:780px}

.rg-panel{padding-top:40px;animation:rgFade .35s cubic-bezier(.2,.8,.3,1)}

.rg-panel-head{margin:0 0 28px}
.rg-panel-title{font-family:var(--font-display);font-weight:400;font-size:clamp(2.2rem,5.5vw,3.4rem);margin:10px 0 0;line-height:.92;color:var(--tx)}

.rg-back:hover{color:var(--acc);border-color:rgba(255,102,0,.35)}
.rg-topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.rg-topic{display:flex;flex-direction:column;gap:0;background:linear-gradient(170deg,rgba(255,255,255,.05),rgba(255,255,255,.01));border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:22px 20px 20px;cursor:pointer;color:var(--tx);font:inherit;text-align:left;position:relative;overflow:hidden;transition:transform .18s cubic-bezier(.2,.8,.3,1),border-color .2s,box-shadow .25s}
.rg-topic::before{content:'';position:absolute;left:0;top:0;right:0;bottom:0;background:radial-gradient(ellipse 120% 80% at 50% 120%,rgba(255,102,0,.12),transparent);opacity:0;transition:opacity .3s}
.rg-topic:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.13);box-shadow:0 16px 40px -18px rgba(0,0,0,.9)}
.rg-topic:hover::before{opacity:1}
.rg-topic .rg-ic{font-size:2rem;margin-bottom:16px;display:block;line-height:1}
.rg-topic .rg-tn{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1.16rem;letter-spacing:.03em;text-transform:uppercase;color:var(--tx);line-height:1.1}
.rg-topic .rg-tmeta{font-family:var(--font-mono);font-size:.75rem;letter-spacing:.1em;color:var(--tx-4);margin-top:10px;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px}
.rg-topic .rg-tmeta::before{content:'';width:14px;height:1px;background:var(--acc);opacity:.7}
.rg-detail-head{margin-bottom:32px;max-width:780px;padding-bottom:28px;border-bottom:1px solid #222228}
.rg-detail-head .rg-panel-title{margin-top:14px}
.rg-detail-lede{color:var(--tx-2);font-size:var(--fs-lead);line-height:1.5;margin:20px 0 0;font-style:italic;border-left:2px solid var(--acc);padding-left:20px}
.rg-detail-grid{display:grid;grid-template-columns:1fr 310px;gap:22px;align-items:start}
.rg-info{background:linear-gradient(170deg,rgba(255,255,255,.04),rgba(255,255,255,.01));border:1px solid rgba(255,255,255,.07);border-radius:18px;padding:36px 40px;color:var(--tx-2);font-size:var(--fs-body);line-height:1.6}
.rg-info p{margin:0 0 20px}.rg-info p:last-child{margin-bottom:0}
.rg-info strong{color:var(--tx);font-weight:600}
.rg-info .rg-h{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1.26rem;color:#fff;letter-spacing:.03em;text-transform:uppercase;margin:36px 0 16px;display:flex;align-items:center;gap:12px}
.rg-info .rg-h::before{content:'';width:20px;height:2px;background:var(--acc);flex:none}
.rg-info .rg-h:first-child{margin-top:0}
.rg-info ul{margin:0 0 20px;padding:0;list-style:none}
.rg-info li{position:relative;padding-left:22px;margin-bottom:11px;color:var(--tx-2)}
.rg-info li::before{content:'';position:absolute;left:2px;top:.65em;width:6px;height:6px;border:1.5px solid var(--acc);border-radius:2px;transform:rotate(45deg)}
.rg-box{border-radius:14px;padding:20px 24px;margin:22px 0;font-size:var(--fs-small);line-height:1.6}
.rg-box b{display:flex;align-items:center;gap:9px;font-family:var(--font-mono);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;margin-bottom:10px;font-weight:600}
.rg-box--tip{background:rgba(255,102,0,.09);border:1px solid rgba(255,102,0,.3);color:var(--tx)}
.rg-box--tip b{color:var(--acc-soft)}

.rg-box--warn b{color:#d9a441}

.rg-box--secret b{color:var(--acc-soft)}
.rg-aside{display:flex;flex-direction:column;gap:12px;position:sticky;top:96px}
.rg-spec{background:linear-gradient(170deg,rgba(255,255,255,.05),rgba(255,255,255,.01));border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:22px 22px 14px}
.rg-spec h4{font-family:var(--font-mono);font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--acc-soft);margin:0 0 18px;display:flex;align-items:center;gap:8px}
.rg-spec h4::before{content:'▸';color:var(--acc)}
.rg-spec dl{margin:0}
.rg-spec .rg-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.rg-spec .rg-row:last-child{border-bottom:0}
.rg-spec dt{color:var(--tx-3);font-size:var(--fs-small);line-height:1.4;flex:none;max-width:50%}
.rg-spec dd{margin:0;color:var(--tx);font-size:var(--fs-small);line-height:1.4;font-weight:600;text-align:right;font-family:var(--font-mono)}
.rg-difficulty{display:flex;align-items:center;gap:10px;padding:14px 18px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:13px}
.rg-difficulty span{font-family:var(--font-mono);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--tx-4)}
.rg-dots{display:flex;gap:5px;margin-left:auto}
.rg-dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.1)}
.rg-dots i.on{background:var(--acc);box-shadow:0 0 8px rgba(255,102,0,.5)}
.rg-seo{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
@media(max-width:900px){.rg-detail-grid{grid-template-columns:1fr}.rg-aside{position:static;flex-direction:row;flex-wrap:wrap}.rg-aside>*{flex:1;min-width:240px}}
@media(max-width:640px){#ridera-garage{padding:0 16px 60px}.rg-hero{padding:24px 0 24px}.rg-info{padding:22px 20px}.rg-grid--bikes{grid-template-columns:1fr}.rg-topics{grid-template-columns:1fr 1fr}.rg-brand-header{flex-direction:column;align-items:flex-start;gap:16px}.rg-brand-logo{width:60px;height:60px}.rg-aside{flex-direction:column}.rg-aside>*{min-width:0;width:100%}}
@media(max-width:400px){.rg-topics{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){#ridera-garage *{animation:none!important;transition:none!important}}
</style>

<script>
(function(){
  const TOPIC_INFO={
    aceite:{titulo:'Cambio de Aceite',icon:'🛢️',dif:1,interval:'6.000 km / 1 año',tiempo:'30 min',
      lede:'KTM exige aceites sinéticos. Un aceite mineral en un motor KTM es una receta para la ruina.',
      specs:[['Intervalo','6K km'],['Especificación','JASO MA2 + 4T'],['Sintético','Obligatorio'],['SAE','Según manual']],
      html:'<p>Los motores KTM son agresivos. Aceite sintético, punto. No hay negociación aquí.</p>'
    },
    filtroaire:{titulo:'Filtro de Aire',icon:'🌬️',dif:1,interval:'10.000 km',tiempo:'20 min',
      lede:'En aventura, revisa el filtro después de cada travesía. El polvo es enemigo mortal de KTM.',
      specs:[['Intervalo','10K km','20K si ruta limpia'],['Limpiable','Sí, algodón específico'],['Protector','Altamente recomendado']],
      html:'<p>Los filtros de algodón de KTM se limpian y reutilizan. Ahorra dinero pero requiere disciplina.</p>'
    },
    frenos:{titulo:'Sistema de Frenos',icon:'🛑',dif:2,interval:'Inspección frecuente',tiempo:'45 min',
      lede:'KTM monta frenos potentes. Una pastilla gastada sigue frenando pero la próxima vez no.',
      specs:[['Pastillas','Revisar cada 5K km','Cambiar a 2 mm'],['Discos','ABS standard','Revisar espesor']],
      html:'<p>Los frenos de KTM son progresivos pero necesitan atención constante en aventura.</p>'
    },
    suspension:{titulo:'Suspensión',icon:'🪛',dif:3,interval:'Service especializado',tiempo:'En taller KTM',
      lede:'La suspensión de KTM es excelente pero compleja. Requiere mecánico que entienda KTM.',
      specs:[['Delantero','Horquilla WP (algunos)','Inverted en modelos nuevos'],['Trasero','Amortiguador WP central'],['Ajustes','Precarga, compresión, rebote']],
      html:'<p>WP Suspension (propiedad de KTM) es de alto rendimiento. Necesita saber qué ajusta.</p>'
    },
    cadena:{titulo:'Cadena y Transmisión',icon:'⛓️',dif:2,interval:'500–1000 km lubricación',tiempo:'15 min',
      lede:'Lubrica MÁS seguido que otros. KTM trabaja duro y la cadena paga el precio.',
      specs:[['Lubricación','Cada 500-800 km','Después de lluvia siempre'],['Tensión','Per manual','Crítica en KTM']],
      html:'<p>KTM es claro: lubrica frecuentemente. Ignóralo y compra cadena cada 15.000 km.</p>'
    },
    bateria:{titulo:'Batería',icon:'🔋',dif:1,interval:'4–5 años',tiempo:'20 min',
      lede:'KTM tiene sistemas eléctricos complejos. Una batería débil genera caídas de potencia inexplicables.',
      specs:[['Voltaje','12.6 V reposo'],['Carga','14–14.5 V acelerando'],['Mantenedor','Muy recomendado']],
      html:'<p>En motos que pasas fuera de ruta, un mantenedor inteligente en garaje es inversión necesaria.</p>'
    },
    diagnostico:{titulo:'Diagnóstico y ECU',icon:'💻',dif:2,interval:'Ante testigo o fallo',tiempo:'30 min',
      lede:'La ECU de KTM es sofisticada. Necesitas herramienta KTM específica para diagnóstico correcto.',
      specs:[['Sistema','Propietario KTM','No OBD simple'],['Testigo','Motor, ABS, tracción']],
      html:'<p>Un "check engine" en KTM puede significar 100 cosas. Llévalo a taller KTM certificado.</p>'
    },
    llantas:{titulo:'Llantas y Neumáticos',icon:'🛞',dif:1,interval:'Presión cada semana',tiempo:'15 min',
      lede:'Las presiones en off-road son distintas que en asfalto. Conocer ambas rangos es crítico.',
      specs:[['Presión asfalto','Según manual','En frío'],['Presión ripio','Más baja','30-40% menos'],['Edad máxima','5–6 años']],
      html:'<p>KTM Adventure pertenece a dos mundos. Domina ambas presiones y obtén lo mejor de la moto.</p>'
    }
  };

  const BIKES=[
    {model:'390 Duke',topics:['aceite','filtroaire','frenos','suspension','cadena','bateria','diagnostico','llantas']},
    {model:'250 Duke',topics:['aceite','filtroaire','frenos','suspension','cadena','bateria','diagnostico','llantas']},
    {model:'390 Adventure',topics:['aceite','filtroaire','frenos','suspension','cadena','bateria','diagnostico','llantas']},
    {model:'250 Adventure',topics:['aceite','filtroaire','frenos','suspension','cadena','bateria','diagnostico','llantas']},
    {model:'890 Adventure',topics:['aceite','filtroaire','frenos','suspension','cadena','bateria','diagnostico','llantas']},
  ];

  let curBike=null;
  const modelsEl=document.getElementById('rgModels');
  const topicsEl=document.getElementById('rgTopics');
  const detailEl=document.getElementById('rgDetail');
  const topicsGrid=document.getElementById('rgTopicsGrid');

  function renderModels(){
    modelsEl.innerHTML=BIKES.map((b,i)=>`<button class="rg-card--bike" data-bike="${i}"><div class="rg-bike-inner"><span class="rg-bk-idx">Modelo ${String(i+1).padStart(2,'0')}</span><span class="rg-name">${b.model}</span><span class="rg-bike-count"><b>${b.topics.length}</b>&nbsp;sistemas técnicos →</span></div><span class="rg-chev">ABRIR →</span></button>`).join('');
  }

  function openTopics(i){
    curBike=BIKES[i];
    document.getElementById('rgTopicsTitle').textContent=curBike.model;
    topicsGrid.innerHTML=curBike.topics.map((key)=>{const t=TOPIC_INFO[key];return t?`<button class="rg-topic" data-topic="${key}"><span class="rg-ic">${t.icon}</span><span class="rg-tn">${t.titulo}</span><span class="rg-tmeta">Ficha técnica</span></button>`:'';}).join('');
    show('topics');
  }

  function dots(n){let h='<div class="rg-dots">';for(let i=1;i<=4;i++)h+='<i class="'+(i<=n?'on':'')+'"></i>';return h+'</div>';}

  function openDetail(key){
    const t=TOPIC_INFO[key];if(!t)return;
    document.getElementById('rgDetailCrumb').textContent='KTM · '+curBike.model;
    document.getElementById('rgDetailTitle').textContent=t.titulo;
    document.getElementById('rgDetailLede').textContent=t.lede;
    let body=t.html;
    if(t.tip)body+='<div class="rg-box rg-box--tip"><b>◆ Truco de mecánico</b>'+t.tip+'</div>';
    if(t.warn)body+='<div class="rg-box rg-box--warn"><b>▲ Cuidado con esto</b>'+t.warn+'</div>';
    if(t.secret)body+='<div class="rg-box rg-box--secret"><b>★ Lo que no te dicen en el taller</b>'+t.secret+'</div>';
    document.getElementById('rgDetailInfo').innerHTML=body;
    const rows=(t.specs||[]).map(s=>'<div class="rg-row"><dt>'+s[0]+'</dt><dd>'+s[1]+'</dd></div>').join('');
    document.getElementById('rgDetailAside').innerHTML=`<div class="rg-spec"><h4>Datos rápidos</h4><dl>${rows}</dl></div><div class="rg-difficulty"><span>Dificultad DIY</span>${dots(t.dif||1)}</div><div class="rg-spec"><h4>Logística</h4><dl><div class="rg-row"><dt>Intervalo</dt><dd>${t.interval||'—'}</dd></div><div class="rg-row"><dt>Tiempo aprox.</dt><dd>${t.tiempo||'—'}</dd></div></dl></div>`;
    show('detail');
  }

  function show(level){
    modelsEl.hidden=level!=='models';
    document.querySelector('.rg-hero').style.display=level==='models'?'':'none';
    topicsEl.hidden=level!=='topics';
    detailEl.hidden=level!=='detail';
    const t=level==='topics'?topicsEl:level==='detail'?detailEl:document.getElementById('ridera-garage');
    window.scrollTo({top:t.getBoundingClientRect().top+window.pageYOffset-90,behavior:'smooth'});
  }

  modelsEl.addEventListener('click',e=>{const b=e.target.closest('[data-bike]');if(b)openTopics(+b.dataset.bike)});
  topicsGrid.addEventListener('click',e=>{const t=e.target.closest('[data-topic]');if(t)openDetail(t.dataset.topic)});
  document.getElementById('btnBackModels').addEventListener('click',()=>show('models'));
  document.getElementById('btnBackTopics').addEventListener('click',()=>show('topics'));
  renderModels();
})();
</script>
