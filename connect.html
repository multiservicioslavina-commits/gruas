<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest-connect.json">
<title>Ridera Club</title>
<style>
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface2: #242836; --border: #2e3345;
    --text: #e8e9ed; --text2: #8b8fa3; --accent: #f97316; --accent2: #fb923c;
    --green: #22c55e; --blue: #3b82f6; --red: #ef4444;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }

  /* ── Login ── */
  .login-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; padding: 24px; text-align: center;
  }
  .login-screen.hidden { display: none; }
  .login-logo { font-size: 48px; margin-bottom: 8px; }
  .login-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .login-title span { color: var(--accent); }
  .login-sub { color: var(--text2); font-size: 14px; margin-bottom: 32px; }
  .login-club { color: var(--accent); font-size: 15px; font-weight: 600; margin-bottom: 24px; }
  .login-input {
    width: 100%; max-width: 320px; padding: 14px 16px; border-radius: 12px;
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    font-size: 18px; text-align: center; letter-spacing: 1px;
  }
  .login-input:focus { outline: none; border-color: var(--accent); }
  .login-input::placeholder { color: var(--text2); letter-spacing: 0; font-size: 14px; }
  .login-btn {
    width: 100%; max-width: 320px; padding: 14px; border-radius: 12px; border: none;
    background: var(--accent); color: #fff; font-size: 16px; font-weight: 600;
    cursor: pointer; margin-top: 12px; transition: background .2s;
  }
  .login-btn:hover { background: var(--accent2); }
  .login-btn:disabled { opacity: .5; cursor: not-allowed; }
  .login-error { color: var(--red); font-size: 13px; margin-top: 12px; min-height: 20px; }

  /* ── App shell ── */
  .app { display: none; flex-direction: column; height: 100%; }
  .app.active { display: flex; }

  /* Header */
  .app-header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 12px 16px; display: flex; align-items: center; gap: 12px;
    flex-shrink: 0;
  }
  .menu-btn {
    background: none; border: none; color: var(--text); font-size: 22px; cursor: pointer;
    padding: 4px; line-height: 1;
  }
  .header-info { flex: 1; }
  .header-club { font-size: 13px; color: var(--text2); }
  .header-room { font-size: 16px; font-weight: 600; }
  .header-room .room-icon { margin-right: 6px; }
  .header-members { font-size: 11px; color: var(--text2); }

  /* Rooms drawer */
  .drawer-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 50;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .drawer-overlay.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; left: -280px; width: 280px; height: 100%;
    background: var(--surface); z-index: 51; transition: left .25s ease;
    display: flex; flex-direction: column;
  }
  .drawer.open { left: 0; }
  .drawer-header {
    padding: 20px 16px 12px; border-bottom: 1px solid var(--border);
  }
  .drawer-title { font-size: 18px; font-weight: 700; }
  .drawer-title span { color: var(--accent); }
  .drawer-club { font-size: 13px; color: var(--text2); margin-top: 2px; }
  .drawer-rooms { flex: 1; overflow-y: auto; padding: 8px; }
  .drawer-room {
    display: flex; align-items: center; gap: 12px; padding: 12px;
    border-radius: 10px; cursor: pointer; transition: background .15s;
  }
  .drawer-room:hover { background: var(--surface2); }
  .drawer-room.active { background: var(--accent); }
  .drawer-room .r-icon { font-size: 22px; width: 36px; text-align: center; }
  .drawer-room .r-name { font-size: 14px; font-weight: 500; }
  .drawer-room .r-desc { font-size: 11px; color: var(--text2); }
  .drawer-room.active .r-desc { color: rgba(255,255,255,.7); }
  .unread-badge { background: var(--red); color: #fff; border-radius: 12px; padding: 2px 8px; font-size: 11px; font-weight: 600; margin-left: auto; }
  .drawer-footer {
    padding: 12px 16px; border-top: 1px solid var(--border);
    font-size: 12px; color: var(--text2);
  }
  .drawer-logout {
    background: none; border: none; color: var(--red); font-size: 13px;
    cursor: pointer; padding: 8px 0;
  }
  .drawer-app-link {
    display: flex; align-items: center; gap: 10px; padding: 10px 0;
    color: var(--text); font-size: 13px; font-weight: 500;
    text-decoration: none; border-radius: 8px; transition: opacity .15s;
  }
  .drawer-app-link:hover { opacity: .8; }
  .drawer-app-link .app-icon {
    width: 32px; height: 32px; border-radius: 8px; background: var(--accent);
    display: flex; align-items: center; justify-content: center; font-size: 16px;
  }

  /* Messages area */
  .messages {
    flex: 1; overflow-y: auto; padding: 12px 16px; display: flex;
    flex-direction: column; gap: 6px;
    -webkit-overflow-scrolling: touch;
  }
  .msg {
    max-width: 85%; padding: 10px 14px; border-radius: 16px;
    font-size: 14px; line-height: 1.45; word-wrap: break-word;
    position: relative;
  }
  .msg-mine {
    align-self: flex-end; background: var(--accent); color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg-other {
    align-self: flex-start; background: var(--surface2);
    border-bottom-left-radius: 4px;
  }
  .msg-rita {
    align-self: flex-start; background: linear-gradient(135deg, #1e3a5f, #1a2d47);
    border: 1px solid #2a4a6f; border-bottom-left-radius: 4px;
  }
  .msg-system {
    align-self: center; background: transparent; color: var(--text2);
    font-size: 12px; text-align: center; padding: 8px 0;
  }
  .msg-sender {
    font-size: 11px; font-weight: 600; margin-bottom: 3px;
    color: var(--accent2);
  }
  .msg-rita .msg-sender { color: #60a5fa; }
  .msg-time {
    font-size: 10px; opacity: .6; margin-top: 4px; text-align: right;
  }
  .msg-date-divider {
    text-align: center; color: var(--text2); font-size: 11px;
    padding: 12px 0 6px; font-weight: 500;
  }

  /* Aviso para instalar la app (PWA) */
  .install-bar {
    display: none; align-items: center; gap: 10px; flex-shrink: 0;
    padding: 10px 12px; background: var(--surface2);
    border-bottom: 1px solid var(--border);
  }
  .install-bar.show { display: flex; }
  .install-text { flex: 1; min-width: 0; font-size: 12px; line-height: 1.35; }
  .install-text strong { display: block; font-size: 13px; }
  .install-text span { color: var(--text2); }
  .install-yes {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
    flex-shrink: 0;
  }
  .install-no {
    background: none; border: none; color: var(--text2); font-size: 16px;
    cursor: pointer; padding: 4px 6px; flex-shrink: 0;
  }

  .empty-room {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; color: var(--text2); text-align: center; padding: 24px;
  }
  .empty-room .icon { font-size: 48px; margin-bottom: 12px; }
  .empty-room p { font-size: 14px; }

  /* Input bar */
  .input-bar {
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 10px 12px; display: flex; gap: 8px; align-items: flex-end;
    flex-shrink: 0;
  }
  .input-bar textarea {
    flex: 1; padding: 10px 14px; border-radius: 20px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text); font-size: 14px;
    font-family: inherit; resize: none; max-height: 120px; line-height: 1.4;
    outline: none;
  }
  .input-bar textarea:focus { border-color: var(--accent); }
  .input-bar textarea::placeholder { color: var(--text2); }
  .send-btn {
    width: 42px; height: 42px; border-radius: 50%; border: none;
    background: var(--accent); color: #fff; font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: background .2s;
  }
  .send-btn:hover { background: var(--accent2); }
  .send-btn:disabled { opacity: .4; cursor: not-allowed; }

  /* Cards tab */
  .cards-btn {
    background: none; border: none; color: var(--text2); font-size: 20px;
    cursor: pointer; padding: 4px;
  }
  .cards-panel {
    display: none; flex: 1; overflow-y: auto; padding: 16px;
  }
  .cards-panel.active { display: block; }
  .card-item {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px; margin-bottom: 10px;
  }
  .card-type {
    font-size: 10px; text-transform: uppercase; letter-spacing: .5px;
    color: var(--accent); font-weight: 600; margin-bottom: 4px;
  }
  .card-name { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .card-detail { font-size: 13px; color: var(--text2); }

  .typing-indicator {
    align-self: flex-start; padding: 8px 14px; background: var(--surface2);
    border-radius: 16px; font-size: 13px; color: var(--text2);
    display: none;
  }
  .typing-indicator.show { display: block; }

  /* ── Club directory ── */
  .directory { display: none; flex-direction: column; align-items: center; min-height: 100%; padding: 32px 16px; overflow-y: auto; }
  .directory.active { display: flex; }
  .dir-logo { font-size: 48px; margin-bottom: 8px; }
  .dir-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .dir-title span { color: var(--accent); }
  .dir-sub { color: var(--text2); font-size: 14px; margin-bottom: 32px; }
  .dir-list { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 12px; }
  .dir-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 18px 20px; cursor: pointer; transition: border-color .2s, transform .1s;
    text-decoration: none; color: var(--text); display: flex; align-items: center; gap: 16px;
  }
  .dir-card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .dir-card-icon { font-size: 36px; flex-shrink: 0; }
  .dir-card-info { flex: 1; }
  .dir-card-name { font-size: 16px; font-weight: 600; margin-bottom: 3px; }
  .dir-card-members { font-size: 13px; color: var(--text2); }
  .dir-card-arrow { color: var(--text2); font-size: 20px; }
  .dir-empty { color: var(--text2); font-size: 14px; text-align: center; margin-top: 24px; }

  /* ── Upload Modal ── */
  .upload-modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 100;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .upload-modal-overlay.open { opacity: 1; pointer-events: auto; }
  .upload-modal {
    position: fixed; bottom: -100%; left: 0; right: 0; width: 100%; max-width: 100%;
    background: var(--surface); z-index: 101;
    display: flex; flex-direction: column; border-radius: 16px 16px 0 0;
    transition: bottom .3s ease; padding: 16px 16px 12px;
  }
  .upload-modal.open { bottom: 0; }
  .upload-modal-header { font-size: 15px; font-weight: 600; margin-bottom: 16px; color: var(--text2); }
  .upload-options {
    display: flex; justify-content: space-around; margin-bottom: 16px;
  }
  .upload-option {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    background: none; border: none; cursor: pointer; padding: 4px;
  }
  .upload-option-icon {
    width: 48px; height: 48px; border-radius: 50%; background: var(--surface2);
    display: flex; align-items: center; justify-content: center; font-size: 22px;
  }
  .upload-option-label { font-size: 12px; color: var(--text2); }
  .upload-modal-close {
    width: 100%; padding: 10px; border-radius: 8px; border: none;
    background: transparent; color: var(--text2); font-size: 13px;
    cursor: pointer;
  }
</style>
</head>
<body>

<!-- CLUB DIRECTORY -->
<div class="directory" id="directory">
  <div class="dir-logo">🏍️</div>
  <div class="dir-title"><span>Ridera</span> Club</div>
  <div class="dir-sub">Elige tu club</div>
  <div class="dir-list" id="dir-list"></div>
</div>

<!-- LOGIN -->
<div class="login-screen" id="login-screen">
  <div class="login-logo">🏍️</div>
  <div class="login-title"><span>Ridera</span> Club</div>
  <div class="login-sub">El espacio de tu club</div>
  <div class="login-club" id="login-club-name"></div>
  <input class="login-input" id="login-phone" type="tel" placeholder="Tu número de celular" maxlength="15" inputmode="numeric">
  <button class="login-btn" id="login-btn" onclick="login()">Entrar</button>
  <div class="login-error" id="login-error"></div>
</div>

<!-- APP -->
<div class="app" id="app">
  <div class="app-header">
    <button class="menu-btn" onclick="toggleDrawer()">☰</button>
    <div class="header-info">
      <div class="header-club" id="h-club"></div>
      <div class="header-room" id="h-room"></div>
    </div>
    <button class="cards-btn" onclick="toggleCards()" title="Tarjetas guardadas">🗂️</button>
  </div>

  <div class="install-bar" id="install-bar">
    <div class="install-text">
      <strong>Ten el club a un toque</strong>
      <span id="install-hint">Instálalo en tu pantalla de inicio y entra sin buscar el link.</span>
    </div>
    <button class="install-yes" id="install-yes" onclick="instalarApp(event)">Instalar</button>
    <button class="install-no" onclick="ocultarInstalar()" aria-label="Ahora no">✕</button>
  </div>

  <div class="messages" id="messages"></div>
  <div class="cards-panel" id="cards-panel"></div>

  <div class="input-bar">
    <button class="send-btn" id="file-btn" onclick="openUploadModal()" title="Agregar contenido" style="background: transparent; color: var(--text2); width: 36px; height: 36px;">📎</button>
    <button class="send-btn" id="voice-btn" onclick="toggleVoiceRecording()" title="Voz" style="background: transparent; color: var(--text2); width: 36px; height: 36px;">🎤</button>
    <textarea id="msg-input" rows="1" placeholder="Escribe un mensaje..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button class="send-btn" id="send-btn" onclick="sendMessage()">➤</button>
  </div>
</div>

<!-- DRAWER -->
<div class="drawer-overlay" id="drawer-overlay" onclick="toggleDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <div class="drawer-title"><span>Ridera</span> Club</div>
    <div class="drawer-club" id="d-club"></div>
  </div>
  <div class="drawer-rooms" id="d-rooms"></div>
  <div class="drawer-footer">
    <a class="drawer-app-link" id="install-link" href="#" onclick="instalarApp(event)" style="display:none">
      <div class="app-icon">📲</div>
      Instalar en mi celular
    </a>
    <a class="drawer-app-link" href="/lyrapp" download="RideraMusic.apk">
      <div class="app-icon" style="background: var(--blue);">🎧</div>
      Ridera Music - Descargar
    </a>
    <button class="drawer-logout" onclick="logout()">Cerrar sesión</button>
  </div>
</div>

<!-- UPLOAD MODAL -->
<div class="upload-modal-overlay" id="upload-modal-overlay" onclick="closeUploadModal()"></div>
<div class="upload-modal" id="upload-modal">
  <div class="upload-modal-header">Agregar contenido</div>
  <div class="upload-options">
    <div class="upload-option" onclick="openCamera()">
      <div class="upload-option-icon">📷</div>
      <div class="upload-option-label">Cámara</div>
    </div>
    <div class="upload-option" onclick="openPhotos()">
      <div class="upload-option-icon">🖼️</div>
      <div class="upload-option-label">Fotos</div>
    </div>
    <div class="upload-option" onclick="openFiles()">
      <div class="upload-option-icon">📁</div>
      <div class="upload-option-label">Archivo</div>
    </div>
  </div>
  <button class="upload-modal-close" onclick="closeUploadModal()">Cancelar</button>
</div>

<input id="camera-input" type="file" style="display: none;" accept="video/*" onchange="sendFile(event)">
<input id="photo-input" type="file" style="display: none;" accept="image/*" onchange="sendFile(event)">
<input id="file-input" type="file" style="display: none;" onchange="sendFile(event)">


<script>
const SB_URL = 'https://vzzxsdtsaahhzyctvmhx.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ6enhzZHRzYWFoaHp5Y3R2bWh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzNzU3NzIsImV4cCI6MjA5Njk1MTc3Mn0.5GZRCUuMx7fwmvoo48nXVCq9QJs0ysCzz0TPr9mmcNI';

let state = {
  member: null,
  club: null,
  rooms: [],
  currentRoom: null,
  messages: [],
  realtimeChannel: null,
  showingCards: false
};

let isRecording = false;
let mediaRecorder = null;
let audioChunks = [];

async function sb(path, opts = {}) {
  const res = await fetch(`${SB_URL}/rest/v1/${path}`, {
    headers: {
      'apikey': SB_KEY,
      'Authorization': `Bearer ${SB_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': opts.prefer || 'return=representation',
      ...opts.headers
    },
    method: opts.method || 'GET',
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  if (opts.method === 'DELETE') return [];
  return res.json();
}

function normalizePhone(raw) {
  let d = raw.replace(/\D/g, '');
  if (d.startsWith('57') && d.length === 12) return d;
  if (d.length === 10 && d.startsWith('3')) return '57' + d;
  return d;
}

// ── Init: check URL for club slug ──
async function init() {
  const pathParts = location.pathname.split('/').filter(Boolean);
  const slug = pathParts.length > 0 ? pathParts[pathParts.length - 1] : null;
  const isHome = !slug || slug === 'connect';
  const saved = localStorage.getItem('connect_session');

  // No slug → show club directory
  if (isHome && !saved) {
    return showDirectory();
  }

  // Load club from slug
  let clubs;
  if (slug && slug !== 'connect') {
    clubs = await sb(`clubs?codigo=eq.${slug}&select=id,nombre,codigo&limit=1`);
  }

  // If saved session, try to restore that club
  if ((!clubs || !clubs.length) && saved) {
    try {
      const s = JSON.parse(saved);
      if (s.clubId) {
        clubs = await sb(`clubs?id=eq.${s.clubId}&select=id,nombre,codigo&limit=1`);
      }
    } catch {}
  }

  // Still nothing → show directory
  if (!clubs || !clubs.length) {
    return showDirectory();
  }

  state.club = clubs[0];
  document.getElementById('login-club-name').textContent = state.club.nombre;

  // Check saved session
  if (saved) {
    try {
      const s = JSON.parse(saved);
      if (s.clubId === state.club.id) {
        const members = await sb(`connect_members?id=eq.${s.memberId}&select=*`);
        if (members.length && members[0].estado !== 'solicitado') {
          state.member = members[0];
          await enterApp();
          return;
        }
      }
    } catch {}
    localStorage.removeItem('connect_session');
  }
}

async function login() {
  const phone = normalizePhone(document.getElementById('login-phone').value);
  const errEl = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');

  if (phone.length < 10) { errEl.textContent = 'Ingresa un número válido'; return; }
  btn.disabled = true; btn.textContent = 'Verificando...';
  errEl.textContent = '';

  const members = await sb(`connect_members?club_id=eq.${state.club.id}&telefono=eq.${phone}&select=*`);
  if (!members.length) {
    errEl.textContent = 'Tu número no está registrado en este club. Pide al admin que te agregue.';
    btn.disabled = false; btn.textContent = 'Entrar';
    return;
  }

  if (members[0].estado === 'solicitado') {
    errEl.textContent = 'Tu solicitud todavía está esperando aprobación del club. Te avisamos por WhatsApp cuando te aprueben.';
    btn.disabled = false; btn.textContent = 'Entrar';
    return;
  }

  state.member = members[0];
  localStorage.setItem('connect_session', JSON.stringify({
    memberId: state.member.id, clubId: state.club.id
  }));

  // Marcar el primer ingreso. Va por Edge Function porque la tabla no expone
  // UPDATE a la llave publica (si lo hiciera, cualquiera podria auto-aprobarse).
  if (state.member.estado === 'pendiente') {
    fetch(`${SB_URL}/functions/v1/club-members`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'ingreso', clubId: state.club.id, telefono: phone })
    }).catch(() => {});
  }

  btn.disabled = false; btn.textContent = 'Entrar';
  await enterApp();
}

async function enterApp() {
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app').classList.add('active');

  // Load rooms
  state.rooms = await sb(`connect_rooms?club_id=eq.${state.club.id}&select=*&order=orden`);

  document.getElementById('h-club').textContent = state.club.nombre;
  document.getElementById('d-club').textContent = state.club.nombre;
  renderDrawerRooms();

  if (state.rooms.length) {
    switchRoom(state.rooms[0].id);
  }
}

function renderDrawerRooms() {
  const unread = JSON.parse(localStorage.getItem('connect_unread') || '{}');
  document.getElementById('d-rooms').innerHTML = state.rooms.map(r => {
    const count = unread[r.id] || 0;
    return `
    <div class="drawer-room ${state.currentRoom?.id === r.id ? 'active' : ''}"
         onclick="switchRoom('${r.id}'); toggleDrawer();">
      <div class="r-icon">${r.icono}</div>
      <div>
        <div class="r-name">${r.nombre}</div>
        <div class="r-desc">${r.descripcion || ''}</div>
      </div>
      ${count > 0 ? `<div class="unread-badge">${count}</div>` : ''}
    </div>
  `;
  }).join('');
}

async function switchRoom(roomId) {
  if (state.realtimeChannel) {
    state.realtimeChannel.unsubscribe();
  }

  state.currentRoom = state.rooms.find(r => r.id === roomId);
  state.showingCards = false;
  document.getElementById('cards-panel').classList.remove('active');
  document.getElementById('messages').style.display = '';

  // Ocultar botón de tarjetas en sala Rita
  const cardsBtn = document.querySelector('.cards-btn');
  if (cardsBtn) cardsBtn.style.display = state.currentRoom.slug === 'rita' ? 'none' : '';

  document.getElementById('h-room').innerHTML = `<span class="room-icon">${state.currentRoom.icono}</span>${state.currentRoom.nombre}`;

  // Clear unread badge for this room
  const unread = JSON.parse(localStorage.getItem('connect_unread') || '{}');
  delete unread[roomId];
  localStorage.setItem('connect_unread', JSON.stringify(unread));
  renderDrawerRooms();

  // Load messages
  const msgs = await sb(`connect_messages?room_id=eq.${roomId}&select=*,connect_members(nombre)&order=created_at.asc&limit=100`);
  state.messages = msgs || [];
  renderMessages();

  // Subscribe to realtime
  subscribeToRoom(roomId);
}

function subscribeToRoom(roomId) {
  if (state.pollInterval) clearInterval(state.pollInterval);
  if (state.globalPollInterval) clearInterval(state.globalPollInterval);

  // Poll current room (500ms for faster updates)
  state.pollInterval = setInterval(async () => {
    const msgs = await sb(
      `connect_messages?room_id=eq.${roomId}&select=*,connect_members(nombre)&order=created_at.asc`
    );
    if (msgs && msgs.length) {
      state.messages = msgs;
      renderMessages();
      scrollToBottom();
    }
  }, 500);

  // Poll other rooms for unread indicators
  state.globalPollInterval = setInterval(async () => {
    const unread = JSON.parse(localStorage.getItem('connect_unread') || '{}');
    const roomMsgCounts = JSON.parse(localStorage.getItem('connect_msg_counts') || '{}');
    let changed = false;

    for (const room of state.rooms) {
      if (room.id === roomId) continue;
      const msgs = await sb(`connect_messages?room_id=eq.${room.id}&select=id`);
      const count = msgs?.length || 0;
      const lastKnown = roomMsgCounts[room.id] || 0;

      if (count > lastKnown) {
        unread[room.id] = (unread[room.id] || 0) + (count - lastKnown);
        roomMsgCounts[room.id] = count;
        changed = true;
      }
    }

    if (changed) {
      localStorage.setItem('connect_unread', JSON.stringify(unread));
      localStorage.setItem('connect_msg_counts', JSON.stringify(roomMsgCounts));
      renderDrawerRooms();
    }
  }, 3000);
}

function renderMessages() {
  const container = document.getElementById('messages');
  if (!state.messages.length) {
    container.innerHTML = `
      <div class="empty-room">
        <div class="icon">${state.currentRoom?.icono || '💬'}</div>
        <p>No hay mensajes en esta sala.<br>Sé el primero en escribir.</p>
      </div>`;
    return;
  }

  let html = '';
  let lastDate = '';

  for (const m of state.messages) {
    const date = new Date(m.created_at);
    const dateStr = date.toLocaleDateString('es-CO', { day: 'numeric', month: 'long' });
    if (dateStr !== lastDate) {
      html += `<div class="msg-date-divider">${dateStr}</div>`;
      lastDate = dateStr;
    }

    const time = date.toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
    const isMine = m.member_id === state.member.id;

    if (m.tipo === 'system') {
      html += `<div class="msg msg-system">${escapeHtml(m.contenido)}</div>`;
    } else if (m.es_rita) {
      html += `<div class="msg msg-rita">
        <div class="msg-sender">🤖 Rita</div>
        ${cuerpoMensaje(m)}
        <div class="msg-time">${time}</div>
      </div>`;
    } else if (isMine) {
      html += `<div class="msg msg-mine">
        ${cuerpoMensaje(m)}
        <div class="msg-time">${time}</div>
      </div>`;
    } else {
      const sender = m.connect_members?.nombre || 'Anónimo';
      html += `<div class="msg msg-other">
        <div class="msg-sender">${escapeHtml(sender)}</div>
        ${cuerpoMensaje(m)}
        <div class="msg-time">${time}</div>
      </div>`;
    }
  }

  if (state.ritaEscribiendo) {
    html += `<div class="msg msg-rita"><div class="msg-sender">🤖 Rita</div>escribiendo…</div>`;
  }

  container.innerHTML = html;
  scrollToBottom();
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

function formatMessage(text) {
  // Escapar SIEMPRE antes de enlazar: el texto lo escribe cualquier miembro
  // del club, y sin esto un mensaje con HTML se ejecutaba en el navegador
  // de todos los demas.
  return escapeHtml(text).replace(
    /(https?:\/\/[^\s]+)/g,
    '<a href="$1" target="_blank" rel="noopener noreferrer" style="color: var(--blue); text-decoration: underline;">$1</a>'
  );
}

function pesoLegible(bytes) {
  const kb = Number(bytes) / 1024;
  return kb >= 1024 ? `${(kb / 1024).toFixed(1)} MB` : `${Math.round(kb)} KB`;
}

// Los adjuntos guardan "url|nombre|tamano" en contenido.
function renderAdjunto(m) {
  const [url, nombre, size] = String(m.contenido).split('|');
  const href = escapeHtml(url);
  if (m.tipo === 'imagen') {
    return `<a href="${href}" target="_blank" rel="noopener noreferrer">
      <img src="${href}" alt="${escapeHtml(nombre)}" style="max-width:100%;border-radius:10px;display:block">
    </a>`;
  }
  if (m.tipo === 'voz') {
    return `<audio controls preload="none" src="${href}" style="max-width:100%"></audio>`;
  }
  if (m.tipo === 'video') {
    return `<video controls preload="metadata" src="${href}" style="max-width:100%;border-radius:10px"></video>`;
  }
  return `<a href="${href}" target="_blank" rel="noopener noreferrer" style="color:var(--blue);text-decoration:underline">
    📎 ${escapeHtml(nombre) || 'Archivo'} <span style="opacity:.7">(${pesoLegible(size)})</span>
  </a>`;
}

const TIPOS_ADJUNTO = ['imagen', 'voz', 'video', 'archivo'];
function cuerpoMensaje(m) {
  return TIPOS_ADJUNTO.includes(m.tipo) ? renderAdjunto(m) : formatMessage(m.contenido);
}

function scrollToBottom() {
  const c = document.getElementById('messages');
  setTimeout(() => c.scrollTop = c.scrollHeight, 50);
}

async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text || !state.currentRoom) return;

  input.value = '';
  autoResize(input);

  const msg = {
    room_id: state.currentRoom.id,
    member_id: state.member.id,
    contenido: text,
    tipo: 'text',
    es_rita: false
  };

  // Optimistic add
  const tempMsg = {
    ...msg,
    id: 'temp-' + Date.now(),
    created_at: new Date().toISOString(),
    connect_members: { nombre: state.member.nombre }
  };
  state.messages.push(tempMsg);
  renderMessages();

  await sb('connect_messages', { method: 'POST', body: msg });

  // En la sala de Rita responde la MISMA Rita de WhatsApp (clima, vías,
  // talleres, garaje, trámites, sellos...), no una versión aparte. Ella
  // guarda su respuesta en la sala; aquí solo refrescamos.
  if (state.currentRoom.slug === 'rita') {
    mostrarRitaEscribiendo(true);
    try {
      const res = await fetch(`${SB_URL}/functions/v1/rita-whatsapp`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          mode: 'club-chat',
          message: text,
          memberId: state.member.id,
          roomId: state.currentRoom.id
        })
      });
      const data = await res.json();
      if (!data.ok) console.error('Rita:', data.error);
    } catch (e) {
      console.error('Rita error:', e);
    }
    mostrarRitaEscribiendo(false);
  }
}

// El indicador va por bandera y no por un nodo suelto: el poll de la sala
// reescribe la lista cada 500 ms y se llevaria por delante cualquier
// elemento añadido a mano.
function mostrarRitaEscribiendo(activo) {
  state.ritaEscribiendo = activo;
  renderMessages();
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function toggleDrawer() {
  document.getElementById('drawer').classList.toggle('open');
  document.getElementById('drawer-overlay').classList.toggle('open');
}

async function toggleCards() {
  state.showingCards = !state.showingCards;
  const panel = document.getElementById('cards-panel');
  const msgs = document.getElementById('messages');

  if (state.showingCards) {
    msgs.style.display = 'none';
    panel.classList.add('active');
    const cards = await sb(`connect_cards?room_id=eq.${state.currentRoom.id}&select=*&order=created_at.desc`);
    if (!cards.length) {
      panel.innerHTML = '<div class="empty-room"><div class="icon">🗂️</div><p>Rita aún no ha guardado tarjetas en esta sala.</p></div>';
    } else {
      panel.innerHTML = cards.map(c => {
        const datos = c.datos || {};
        const details = Object.entries(datos).map(([k,v]) => `${k}: ${v}`).join(' · ');
        return `<div class="card-item">
          <div class="card-type">${escapeHtml(c.tipo)}</div>
          <div class="card-name">${escapeHtml(c.nombre)}</div>
          ${details ? `<div class="card-detail">${escapeHtml(details)}</div>` : ''}
        </div>`;
      }).join('');
    }
  } else {
    panel.classList.remove('active');
    msgs.style.display = '';
  }
}

async function sendFile(event) {
  const file = event.target.files[0];
  if (!file) return;

  const maxSize = 10 * 1024 * 1024; // 10MB
  if (file.size > maxSize) {
    alert('Archivo muy grande. Máximo 10MB');
    return;
  }

  try {
    const filename = `${Date.now()}-${file.name.replace(/[^a-z0-9.-]/gi, '_')}`;
    const path = `${state.club.id}/${state.currentRoom.id}/${filename}`;

    const res = await fetch(
      `${SB_URL}/storage/v1/object/connect-files/${path}`,
      {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${SB_KEY}`,
          'apikey': SB_KEY,
          'Content-Type': file.type || 'application/octet-stream'
        },
        body: file
      }
    );

    if (!res.ok) throw new Error(`el servidor rechazó la subida (${res.status})`);

    const fileUrl = `${SB_URL}/storage/v1/object/public/connect-files/${path}`;
    const esImagen = (file.type || '').startsWith('image/');
    const esVideo = (file.type || '').startsWith('video/');

    // El archivo se manda solo: antes solo dejaba el texto en la caja y habia
    // que darle enviar a mano, cosa que no era evidente.
    await enviarAdjunto(
      esImagen ? 'imagen' : esVideo ? 'video' : 'archivo',
      fileUrl,
      file.name,
      file.size
    );
  } catch (e) {
    alert('Error al subir archivo: ' + e.message);
  }

  event.target.value = '';
}

// Guarda un adjunto como mensaje. El contenido lleva la URL y, separado por
// '|', el nombre y el tamano, para poder pintarlo sin columnas nuevas.
async function enviarAdjunto(tipo, url, nombre, size) {
  const contenido = `${url}|${nombre || ''}|${size || 0}`;
  const msg = {
    room_id: state.currentRoom.id,
    member_id: state.member.id,
    contenido,
    tipo,
    es_rita: false
  };
  state.messages.push({
    ...msg,
    id: 'temp-' + Date.now(),
    created_at: new Date().toISOString(),
    connect_members: { nombre: state.member.nombre }
  });
  renderMessages();
  await sb('connect_messages', { method: 'POST', body: msg });
}

async function toggleVoiceRecording() {
  if (!isRecording) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      // El formato lo decide el navegador: Chrome graba webm y Safari mp4.
      // Antes se forzaba 'audio/mp4' al armar el Blob, con lo que en Chrome
      // el archivo quedaba con una extension que no correspondia al contenido.
      const mime = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm'
                 : MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : '';
      mediaRecorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
      audioChunks = [];

      mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
      mediaRecorder.onstop = async () => {
        const real = mediaRecorder.mimeType || mime || 'audio/webm';
        const blob = new Blob(audioChunks, { type: real });
        const voiceBtn = document.getElementById('voice-btn');
        voiceBtn.disabled = true;

        try {
          const ext = real.includes('webm') ? 'webm' : 'mp4';
          const path = `${state.club.id}/voces/${state.member.id}-${Date.now()}.${ext}`;

          const uploadRes = await fetch(`${SB_URL}/storage/v1/object/connect-files/${path}`, {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${SB_KEY}`,
              'apikey': SB_KEY,
              'Content-Type': real
            },
            body: blob
          });

          if (!uploadRes.ok) throw new Error(`subida rechazada (${uploadRes.status})`);

          const voiceUrl = `${SB_URL}/storage/v1/object/public/connect-files/${path}`;
          await enviarAdjunto('voz', voiceUrl, 'Nota de voz', blob.size);
          scrollToBottom();
        } catch (e) {
          alert('No se pudo enviar la nota de voz: ' + e.message);
        }

        voiceBtn.disabled = false;
        stream.getTracks().forEach(t => t.stop());
      };

      mediaRecorder.start();
      isRecording = true;
      document.getElementById('voice-btn').style.color = 'var(--red)';
      document.getElementById('voice-btn').textContent = '⏹️';
    } catch (e) {
      alert('No se pudo acceder al micrófono');
    }
  } else {
    mediaRecorder.stop();
    isRecording = false;
    document.getElementById('voice-btn').style.color = 'var(--text2)';
    document.getElementById('voice-btn').textContent = '🎤';
  }
}

function logout() {
  localStorage.removeItem('connect_session');
  if (state.pollInterval) clearInterval(state.pollInterval);
  location.reload();
}

async function showDirectory() {
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('directory').classList.add('active');
  const clubs = await sb('clubs?select=id,nombre,codigo&order=nombre');
  const list = document.getElementById('dir-list');
  if (!clubs.length) {
    list.innerHTML = '<div class="dir-empty">No hay clubs disponibles aún</div>';
    return;
  }
  const counts = {};
  const members = await sb('connect_members?select=club_id');
  members.forEach(m => { counts[m.club_id] = (counts[m.club_id] || 0) + 1; });
  list.innerHTML = clubs.map(c => `
    <a class="dir-card" href="/${c.codigo || c.id}">
      <div class="dir-card-icon">🏍️</div>
      <div class="dir-card-info">
        <div class="dir-card-name">${c.nombre}</div>
        <div class="dir-card-members">${counts[c.id] || 0} miembros</div>
      </div>
      <div class="dir-card-arrow">›</div>
    </a>
  `).join('');
}

// ── Instalar en el celular (PWA) ───────────────────────────────────────
// Sin service worker el navegador no ofrece instalar, por eso se registra
// aqui. Es propio del club (sw-connect.js): el de gruas, sin conexion,
// cae a la home de gruas.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw-connect.js').catch(() => {});
  });
}

let promptInstalar = null;

function yaInstalada() {
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
function esIOS() {
  return /iphone|ipad|ipod/i.test(navigator.userAgent);
}

// Chrome/Android avisan cuando la app se puede instalar y dejan lanzar el
// dialogo. Safari en iPhone no: alli solo se puede explicar el gesto.
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  promptInstalar = e;
  mostrarOpcionInstalar();
});

window.addEventListener('appinstalled', () => {
  promptInstalar = null;
  document.getElementById('install-bar').classList.remove('show');
  document.getElementById('install-link').style.display = 'none';
});

function mostrarOpcionInstalar() {
  if (yaInstalada()) return;
  document.getElementById('install-link').style.display = '';
  if (localStorage.getItem('connect_install_off') === '1') return;
  document.getElementById('install-bar').classList.add('show');
}

function ocultarInstalar() {
  localStorage.setItem('connect_install_off', '1');
  document.getElementById('install-bar').classList.remove('show');
}

async function instalarApp(ev) {
  if (ev) ev.preventDefault();
  if (promptInstalar) {
    promptInstalar.prompt();
    const { outcome } = await promptInstalar.userChoice;
    promptInstalar = null;
    if (outcome === 'accepted') ocultarInstalar();
    return;
  }
  if (esIOS()) {
    alert('Para instalarlo en tu iPhone:\n\n1. Toca el botón Compartir (el cuadrito con la flecha ↑)\n2. Desliza y elige "Agregar a inicio"\n3. Toca "Agregar"');
    return;
  }
  alert('Abre el menú de tu navegador (⋮) y elige "Instalar aplicación" o "Agregar a pantalla de inicio".');
}

// En iPhone no llega beforeinstallprompt, asi que la opcion se ofrece igual
// y al tocarla se explican los pasos.
if (esIOS() && !yaInstalada()) mostrarOpcionInstalar();

init();
</script>
