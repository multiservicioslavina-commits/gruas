<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi cuenta — Ridera Grúas</title>
  <meta name="robots" content="noindex">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ridera Grúas">
  <meta name="theme-color" content="#E85D20">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0e0e0e;
      --surface: #1a1a1a;
      --surface2: #222;
      --border: #2a2a2a;
      --accent: #E85D20;
      --accent-hover: #cf4f18;
      --text: #f0f0f0;
      --muted: #888;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    #loading {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 1rem; color: var(--muted);
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #app { display: none; }

    /* NAV */
    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 1.5rem;
      display: flex; align-items: center; justify-content: space-between;
      height: 60px;
      position: sticky; top: 0; z-index: 10;
    }
    .nav-brand { font-weight: 700; font-size: 1.1rem; color: var(--accent); }
    .nav-right { display: flex; align-items: center; gap: 1rem; }
    .nav-name { font-size: 0.9rem; color: var(--muted); }
    .btn-logout {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn-logout:hover { border-color: #e05555; color: #e05555; }

    /* LAYOUT */
    .container { max-width: 900px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }

    /* HEADER CARD */
    .header-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex; align-items: center; gap: 1.25rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }
    .avatar {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: var(--surface2);
      border: 2px solid var(--border);
      object-fit: cover;
      flex-shrink: 0;
    }
    .avatar-placeholder {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.75rem; font-weight: 700; color: #fff;
      flex-shrink: 0;
    }
    .header-info { flex: 1; min-width: 180px; }
    .header-info h2 { font-size: 1.3rem; font-weight: 700; }
    .header-info p { color: var(--muted); font-size: 0.9rem; margin-top: 0.2rem; }
    .badge-disponible {
      display: inline-flex; align-items: center; gap: 0.4rem;
      font-size: 0.8rem; padding: 0.3rem 0.75rem;
      border-radius: 20px; font-weight: 600;
      cursor: pointer; border: none;
      transition: opacity 0.2s;
    }
    .badge-disponible:disabled { opacity: 0.5; }
    .badge-disponible.on  { background: #0e2a1a; color: #4ade80; border: 1px solid #1a5c36; }
    .badge-disponible.off { background: #2a1212; color: #f87171; border: 1px solid #6b1e1e; }
    .dot { width: 8px; height: 8px; border-radius: 50%; }
    .dot.on  { background: #4ade80; }
    .dot.off { background: #f87171; }
    .public-link { font-size: 0.8rem; color: var(--accent); text-decoration: none; }
    .public-link:hover { text-decoration: underline; }

    /* STATS */
    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem; margin-bottom: 1.5rem;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem;
      text-align: center;
    }
    .stat-card .num { font-size: 2rem; font-weight: 700; color: var(--accent); }
    .stat-card .lbl { font-size: 0.8rem; color: var(--muted); margin-top: 0.25rem; }

    /* SECTIONS */
    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .section h3 {
      font-size: 1rem; font-weight: 600;
      margin-bottom: 1.25rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }

    /* FORM */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media(max-width: 520px) { .form-grid { grid-template-columns: 1fr; } }
    .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
    .form-group.full { grid-column: 1 / -1; }
    label { font-size: 0.8rem; color: var(--muted); }
    input[type="text"], input[type="email"], input[type="tel"], textarea, select {
      background: #111;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      padding: 0.65rem 0.85rem;
      font-family: inherit;
      transition: border-color 0.2s;
      outline: none;
      width: 100%;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 80px; }
    .btn-save {
      margin-top: 1.25rem;
      padding: 0.75rem 2rem;
      background: var(--accent);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      border: none; border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }
    .btn-save:hover { background: var(--accent-hover); }
    .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }
    .save-msg { font-size: 0.85rem; margin-top: 0.75rem; }
    .save-msg.ok  { color: #4ade80; }
    .save-msg.err { color: #f87171; }

    /* SOLICITUDES TABLE */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    thead th {
      text-align: left;
      padding: 0.6rem 0.75rem;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border-bottom: 1px solid var(--border);
    }
    tbody tr { border-bottom: 1px solid var(--border); }
    tbody tr:last-child { border-bottom: none; }
    tbody td { padding: 0.75rem; vertical-align: middle; }
    .estado-badge {
      display: inline-block;
      font-size: 0.72rem; font-weight: 600;
      padding: 0.2rem 0.55rem;
      border-radius: 20px;
    }
    .estado-finalizada  { background: #0e2a1a; color: #4ade80; }
    .estado-cancelada   { background: #2a1212; color: #f87171; }
    .estado-asignada    { background: #1a1a0a; color: #facc15; }
    .estado-en_camino   { background: #0a1a2a; color: #60a5fa; }
    .estado-pendiente   { background: #1a1a2a; color: #a78bfa; }
    .empty-row td { color: var(--muted); text-align: center; padding: 2rem; }
    .pag-btns { margin-top: 1rem; display: flex; gap: 0.5rem; justify-content: center; }
    .pag-btn {
      padding: 0.4rem 1rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .pag-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <span>Cargando tu cuenta…</span>
  </div>

  <div id="app">
    <nav>
      <span class="nav-brand">Ridera Grúas</span>
      <div class="nav-right">
        <span class="nav-name" id="navName"></span>
        <button class="btn-logout" id="logoutBtn">Cerrar sesión</button>
      </div>
    </nav>

    <div class="container">
      <!-- HEADER -->
      <div class="header-card">
        <div id="avatarEl"></div>
        <div class="header-info">
          <h2 id="hdrNombre">—</h2>
          <p id="hdrCiudad">—</p>
          <div style="margin-top:0.5rem;display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap;">
            <button class="badge-disponible off" id="toggleDisp">
              <span class="dot off" id="dotDisp"></span>
              <span id="lblDisp">No disponible</span>
            </button>
            <a class="public-link" id="publicLink" href="#" target="_blank" style="display:none">Ver perfil público →</a>
          </div>
        </div>
      </div>

      <!-- STATS -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="num" id="statTotal">—</div>
          <div class="lbl">Servicios totales</div>
        </div>
        <div class="stat-card">
          <div class="num" id="statMes">—</div>
          <div class="lbl">Este mes</div>
        </div>
        <div class="stat-card">
          <div class="num" id="statCal">—</div>
          <div class="lbl">Calificación ⭐</div>
        </div>
      </div>

      <!-- PERFIL EDITABLE -->
      <div class="section">
        <h3>Mi perfil</h3>
        <div class="form-grid">
          <div class="form-group">
            <label>Nombre / razón social</label>
            <input type="text" id="fNombre" placeholder="Ej. Grúas Rápidas Medellín">
          </div>
          <div class="form-group">
            <label>Ciudad principal</label>
            <input type="text" id="fCiudad" placeholder="Ej. Medellín">
          </div>
          <div class="form-group">
            <label>Teléfono / WhatsApp</label>
            <input type="tel" id="fTelefono" placeholder="Ej. 3001234567">
          </div>
          <div class="form-group">
            <label>Correo electrónico</label>
            <input type="email" id="fEmail" placeholder="tu@correo.com">
          </div>
          <div class="form-group full">
            <label>Municipios que cubre (separados por coma)</label>
            <input type="text" id="fMunicipios" placeholder="Ej. Medellín, Bello, Envigado">
          </div>
          <div class="form-group full">
            <label>Descripción del servicio</label>
            <textarea id="fDescripcion" placeholder="Cuéntale al cliente qué te hace diferente…"></textarea>
          </div>
          <div class="form-group full">
            <label>URL de foto de perfil</label>
            <input type="text" id="fFoto" placeholder="https://...">
          </div>
        </div>
        <button class="btn-save" id="saveBtn">Guardar cambios</button>
        <div class="save-msg" id="saveMsg"></div>
      </div>

      <!-- HISTORIAL -->
      <div class="section">
        <h3>Mis servicios</h3>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Fecha</th>
                <th>Cliente</th>
                <th>Origen → Destino</th>
                <th>Estado</th>
                <th>Cal.</th>
              </tr>
            </thead>
            <tbody id="tbodyServicios">
              <tr class="empty-row"><td colspan="5">Cargando…</td></tr>
            </tbody>
          </table>
        </div>
        <div class="pag-btns">
          <button class="pag-btn" id="prevBtn" disabled>← Anterior</button>
          <button class="pag-btn" id="nextBtn" disabled>Siguiente →</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
  <script>
    const SUPABASE_URL = 'https://vzzxsdtsaahhzyctvmhx.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ6enhzZHRzYWFoaHp5Y3R2bWh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzNzU3NzIsImV4cCI6MjA5Njk1MTc3Mn0.5GZRCUuMx7fwmvoo48nXVCq9QJs0ysCzz0TPr9mmcNI';
    const FN_BASE = 'https://vzzxsdtsaahhzyctvmhx.supabase.co/functions/v1';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let perfil = null;
    let page   = 0;
    const PER_PAGE = 10;
    let totalRows  = 0;

    async function apiFetch(path, opts = {}) {
      const { data: { session } } = await sb.auth.getSession();
      const token = session?.access_token;
      const res = await fetch(FN_BASE + path, {
        ...opts,
        headers: {
          'Content-Type': 'application/json',
          ...(token ? { 'Authorization': `Bearer ${token}` } : {}),
          ...(opts.headers || {}),
        },
      });
      return res.json();
    }

    async function loadPerfil() {
      const data = await apiFetch('/mi-perfil');
      if (!data || data.error) return;
      perfil = data.gruero;
      const stats = data.stats || {};

      // Header
      document.getElementById('hdrNombre').textContent  = perfil.nombre || '—';
      document.getElementById('hdrCiudad').textContent  = perfil.ciudad || '—';
      document.getElementById('navName').textContent    = perfil.nombre || '';

      // Avatar
      const avatarEl = document.getElementById('avatarEl');
      if (perfil.foto_url) {
        avatarEl.innerHTML = `<img class="avatar" src="${perfil.foto_url}" alt="">`;
      } else {
        const initial = (perfil.nombre || '?')[0].toUpperCase();
        avatarEl.innerHTML = `<div class="avatar-placeholder">${initial}</div>`;
      }

      // Disponible
      updateDispBadge(perfil.disponible);

      // Enlace público
      if (perfil.slug) {
        const link = document.getElementById('publicLink');
        link.href = `https://ridera.com.co/gruas/${perfil.slug}/`;
        link.style.display = 'inline';
      }

      // Stats
      document.getElementById('statTotal').textContent = stats.total_servicios ?? '0';
      document.getElementById('statMes').textContent   = stats.este_mes ?? '0';
      const cal = stats.calificacion_promedio;
      document.getElementById('statCal').textContent   = cal ? Number(cal).toFixed(1) : '—';

      // Form
      document.getElementById('fNombre').value     = perfil.nombre || '';
      document.getElementById('fCiudad').value     = perfil.ciudad || '';
      document.getElementById('fTelefono').value   = perfil.telefono || '';
      document.getElementById('fEmail').value      = perfil.email || '';
      document.getElementById('fMunicipios').value = Array.isArray(perfil.municipios)
        ? perfil.municipios.join(', ') : (perfil.municipios || '');
      document.getElementById('fDescripcion').value = (perfil.datos && perfil.datos.descripcion) || '';
      document.getElementById('fFoto').value        = perfil.foto_url || '';
    }

    function updateDispBadge(disponible) {
      const btn = document.getElementById('toggleDisp');
      const dot = document.getElementById('dotDisp');
      const lbl = document.getElementById('lblDisp');
      if (disponible) {
        btn.className = 'badge-disponible on';
        dot.className = 'dot on';
        lbl.textContent = 'Disponible';
      } else {
        btn.className = 'badge-disponible off';
        dot.className = 'dot off';
        lbl.textContent = 'No disponible';
      }
    }

    async function loadServicios() {
      const tbody = document.getElementById('tbodyServicios');
      tbody.innerHTML = '<tr class="empty-row"><td colspan="5">Cargando…</td></tr>';
      const data = await apiFetch(`/mis-servicios?limit=${PER_PAGE}&offset=${page * PER_PAGE}`);

      if (!data || data.error || !data.solicitudes) {
        tbody.innerHTML = `<tr class="empty-row"><td colspan="5">${data?.error || 'Error cargando servicios'}</td></tr>`;
        return;
      }

      totalRows = data.total || 0;
      const rows = data.solicitudes;

      document.getElementById('prevBtn').disabled = page === 0;
      document.getElementById('nextBtn').disabled = (page + 1) * PER_PAGE >= totalRows;

      if (!rows.length) {
        tbody.innerHTML = '<tr class="empty-row"><td colspan="5">Aún no tienes servicios registrados.</td></tr>';
        return;
      }

      tbody.innerHTML = rows.map(s => {
        const fecha = s.created_at ? new Date(s.created_at).toLocaleDateString('es-CO') : '—';
        const cliente = s.nombre_cliente || '—';
        const ruta = [s.direccion_origen, s.direccion_destino].filter(Boolean).join(' → ') || '—';
        const estado = s.estado || '—';
        const cal = s.calificacion_gruero ? '⭐ ' + s.calificacion_gruero : '—';
        return `<tr>
          <td>${fecha}</td>
          <td>${cliente}</td>
          <td style="max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${ruta}</td>
          <td><span class="estado-badge estado-${estado}">${estado.replace('_', ' ')}</span></td>
          <td>${cal}</td>
        </tr>`;
      }).join('');
    }

    document.getElementById('toggleDisp').addEventListener('click', async function() {
      if (!perfil) return;
      this.disabled = true;
      const nuevoVal = !perfil.disponible;
      const res = await apiFetch('/mi-perfil', {
        method: 'PATCH',
        body: JSON.stringify({ action: 'toggle_disponible' }),
      });
      if (!res.error) {
        perfil.disponible = nuevoVal;
        updateDispBadge(nuevoVal);
      }
      this.disabled = false;
    });

    document.getElementById('saveBtn').addEventListener('click', async function() {
      const msg = document.getElementById('saveMsg');
      msg.textContent = '';
      this.disabled = true;
      this.textContent = 'Guardando…';

      const municipiosRaw = document.getElementById('fMunicipios').value;
      const municipios = municipiosRaw.split(',').map(s => s.trim()).filter(Boolean);

      const res = await apiFetch('/mi-perfil', {
        method: 'PATCH',
        body: JSON.stringify({
          nombre:    document.getElementById('fNombre').value.trim(),
          ciudad:    document.getElementById('fCiudad').value.trim(),
          telefono:  document.getElementById('fTelefono').value.trim(),
          email:     document.getElementById('fEmail').value.trim(),
          municipios,
          foto_url:  document.getElementById('fFoto').value.trim(),
          datos: { descripcion: document.getElementById('fDescripcion').value.trim() },
        }),
      });

      if (res.error) {
        msg.className = 'save-msg err';
        msg.textContent = 'Error: ' + res.error;
      } else {
        msg.className = 'save-msg ok';
        msg.textContent = '✓ Cambios guardados correctamente.';
        perfil = res.gruero || perfil;
        if (perfil.nombre) document.getElementById('hdrNombre').textContent = perfil.nombre;
        if (perfil.ciudad) document.getElementById('hdrCiudad').textContent = perfil.ciudad;
        if (perfil.slug) {
          const link = document.getElementById('publicLink');
          link.href = `https://ridera.com.co/gruas/${perfil.slug}/`;
          link.style.display = 'inline';
        }
      }

      this.disabled = false;
      this.textContent = 'Guardar cambios';
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await sb.auth.signOut();
      location.replace('/login-gruero.html');
    });

    document.getElementById('prevBtn').addEventListener('click', () => { page--; loadServicios(); });
    document.getElementById('nextBtn').addEventListener('click', () => { page++; loadServicios(); });

    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) {
        location.replace('/login-gruero.html');
        return;
      }
      document.getElementById('loading').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      await Promise.all([loadPerfil(), loadServicios()]);
    }

    init();
  </script>
</body>
</html>
