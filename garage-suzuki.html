<style>

.rg-detail-head{margin-bottom:32px;max-width:780px;padding-bottom:28px;border-bottom:1px solid #222228}.rg-detail-head .rg-panel-title{margin-top:14px}.rg-detail-lede{color:var(--tx-2);font-size:var(--fs-lead);line-height:1.5;margin:20px 0 0;font-style:italic;border-left:2px solid var(--acc);padding-left:20px}.rg-detail-grid{display:grid;grid-template-columns:1fr 310px;gap:22px;align-items:start}.rg-info{background:linear-gradient(170deg,rgba(255,255,255,.04),rgba(255,255,255,.01));border:1px solid rgba(255,255,255,.07);border-radius:18px;padding:36px 40px;color:var(--tx-2);font-size:var(--fs-body);line-height:1.6}.rg-info p{margin:0 0 20px}.rg-info p:last-child{margin-bottom:0}.rg-info strong{color:var(--tx);font-weight:600}.rg-info .rg-h{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1.26rem;color:#fff;letter-spacing:.03em;text-transform:uppercase;margin:36px 0 16px;display:flex;align-items:center;gap:12px}.rg-info .rg-h::before{content:'';width:20px;height:2px;background:var(--acc);flex:none}.rg-info .rg-h:first-child{margin-top:0}.rg-info ul{margin:0 0 20px;padding:0;list-style:none}.rg-info li{position:relative;padding-left:22px;margin-bottom:11px;color:var(--tx-2)}.rg-info li::before{content:'';position:absolute;left:2px;top:.65em;width:6px;height:6px;border:1.5px solid var(--acc);border-radius:2px;transform:rotate(45deg)}
.rg-box{border-radius:14px;padding:20px 24px;margin:22px 0;font-size:var(--fs-small);line-height:1.6}.rg-box b{display:flex;align-items:center;gap:9px;font-family:var(--font-mono);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;margin-bottom:10px;font-weight:600}.rg-box--tip{background:rgba(42,111,212,.09);border:1px solid rgba(42,111,212,.3);color:var(--tx)}.rg-box--tip b{color:var(--acc-soft)}.rg-box--warn{background:rgba(217,164,65,.08);border:1px solid rgba(217,164,65,.3);color:var(--tx)}.rg-box--warn b{color:#d9a441}.rg-box--secret{background:linear-gradient(135deg,rgba(42,111,212,.1),rgba(217,164,65,.05));border:1px solid rgba(42,111,212,.32);color:var(--tx)}.rg-box--secret b{color:var(--acc-soft)}
.rg-aside{display:flex;flex-direction:column;gap:12px;position:sticky;top:96px}.rg-spec{background:linear-gradient(170deg,rgba(255,255,255,.05),rgba(255,255,255,.01));border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:22px}.rg-spec h4{font-family:var(--font-mono);font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--acc-soft);margin:0 0 18px;display:flex;align-items:center;gap:8px}.rg-spec h4::before{content:'▸';color:var(--acc)}.rg-spec dl{margin:0}.rg-spec .rg-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05)}.rg-spec .rg-row:last-child{border-bottom:0}.rg-spec dt{color:var(--tx-3);font-size:var(--fs-small);line-height:1.4;flex:none;max-width:50%}.rg-spec dd{margin:0;color:var(--tx);font-size:var(--fs-small);line-height:1.4;font-weight:600;text-align:right;font-family:var(--font-mono)}.rg-difficulty{display:flex;align-items:center;gap:10px;padding:14px 18px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:13px}.rg-difficulty span{font-family:var(--font-mono);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--tx-4)}.rg-dots{display:flex;gap:5px;margin-left:auto}.rg-dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.1)}.rg-dots i.on{background:var(--acc);box-shadow:0 0 8px rgba(42,111,212,.5)}
.rg-seo{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
@media(max-width:900px){.rg-detail-grid{grid-template-columns:1fr}.rg-aside{position:static;flex-direction:row;flex-wrap:wrap}.rg-aside>*{flex:1;min-width:240px}}@media(max-width:640px){#ridera-garage{padding:0 16px 60px}.rg-hero{padding:24px 0 24px}.rg-info{padding:22px 20px}.rg-grid--bikes{grid-template-columns:1fr}.rg-topics{grid-template-columns:1fr 1fr}.rg-brand-header{flex-direction:column;align-items:flex-start;gap:16px}.rg-brand-logo{width:60px;height:60px}.rg-aside{flex-direction:column}.rg-aside>*{min-width:0;width:100%}}@media(max-width:400px){.rg-topics{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){#ridera-garage *{animation:none!important;transition:none!important}}
</style>

<script>
(function(){
  const TOPIC_INFO={
    aceite:{titulo:'Cambio de Aceite',icon:'🛢️',dif:1,interval:'12.000 km',tiempo:'30 min',lede:'Suzuki es modesto pero confiable. El aceite correcto mantiene esa reputación.',specs:[['Intervalo','12K km'],['Especificación','SAE 15W/50'],['Filtro','Cartucho reemplazable']],html:'<p>Los motores Suzuki no son espectaculares pero duran infinito. Aceite de buena marca, intervalo religioso.</p>'},
    filtroaire:{titulo:'Filtro de Aire',icon:'🌬️',dif:1,interval:'15.000 km',tiempo:'20 min',lede:'Simple de cambiar, simple de cuidar.',specs:[['Intervalo','15K km'],['Tipo','Panel']],html:'<p>Uno de los servicios más fáciles. Acceso directo sin herramientas.</p>'},
    frenos:{titulo:'Sistema de Frenos',icon:'🛑',dif:2,interval:'20.000 km',tiempo:'45 min',lede:'Frenos confiables. Nada espectacular, solo funcionalidad probada.',specs:[['Sistema','Dual disc','ABS en modelos nuevos'],['Pastillas','Cambiar a 2-3 mm']],html:'<p>Suzuki ofrece frenos que funcionan siempre. Mantenimiento básico mantiene esa promesa.</p>'},
    suspension:{titulo:'Suspensión',icon:'🪛',dif:3,interval:'40.000 km',tiempo:'Taller especializado',lede:'Showa en casi todos. Buena relación confort/rendimiento.',specs:[['Delantero','Horquilla'],['Trasero','Monoshock central']],html:'<p>La suspensión Suzuki es correcta pero no sofisticada. Ajustes simples, respuesta predecible.</p>'},
    cadena:{titulo:'Cadena y Transmisión',icon:'⛓️',dif:2,interval:'1000 km lubricación',tiempo:'20 min',lede:'V-Strom y otros usan cadena. Lubrica frecuentemente.',specs:[['Lubricación','Cada 1000 km','Después de lluvia'],['Tensión','Per manual']],html:'<p>Suzuki es clara: lubrica la cadena. Hazlo y vivirá 30K+ km.</p>'},
    bateria:{titulo:'Batería',icon:'🔋',dif:1,interval:'5 años',tiempo:'20 min',lede:'Batería Suzuki de calidad. Mantenla en ese estado con voltaje regular.',specs:[['Voltaje','12.6 V reposo'],['Carga','14 V acelerando']],html:'<p>Verifica voltaje regularmente. Una batería Suzuki bien cuidada dura 5+ años.</p>'},
    diagnostico:{titulo:'Diagnóstico y ECU',icon:'💻',dif:2,interval:'Ante testigo',tiempo:'20 min',lede:'Sistemas OBD estándar en Suzuki modernas. Genéricos funcionan.',specs:[['Sistema','OBD-II estándar']],html:'<p>Los diagnósticos Suzuki son simples. Herramientas genéricas leer mayoría de códigos.</p>'},
    llantas:{titulo:'Llantas y Neumáticos',icon:'🛞',dif:1,interval:'Presión cada 2 semanas',tiempo:'10 min',lede:'Presión correcta es lo más importante en una Suzuki. Respétala.',specs:[['Presión','Manual específico','En frío'],['Edad máxima','5-6 años']],html:'<p>Las presiones Suzuki son generosas. Cambios significativos arruinan el manejo.</p>'}
  };

  const BIKES=[{model:'GSX-S750',topics:['aceite','filtroaire','frenos','suspension','cadena','bateria','diagnostico','llantas']},{model:'GSX-S1000',topics:['aceite','filtroaire','frenos','suspension','cadena','bateria','diagnostico','llantas']},{model:'V-Strom 800',topics:['aceite','filtroaire','frenos','suspension','cadena','bateria','diagnostico','llantas']},{model:'V-Strom 1050',topics:['aceite','filtroaire','frenos','suspension','cadena','bateria','diagnostico','llantas']},{model:'Katana',topics:['aceite','filtroaire','frenos','suspension','cadena','bateria','diagnostico','llantas']},{model:'SV650',topics:['aceite','filtroaire','frenos','suspension','cadena','bateria','diagnostico','llantas']}];

  let curBike=null,modelsEl=document.getElementById('rgModels'),topicsEl=document.getElementById('rgTopics'),detailEl=document.getElementById('rgDetail'),topicsGrid=document.getElementById('rgTopicsGrid');

  function renderModels(){modelsEl.innerHTML=BIKES.map((b,i)=>`<button class="rg-card--bike" data-bike="${i}"><div class="rg-bike-inner"><span class="rg-bk-idx">Modelo ${String(i+1).padStart(2,'0')}</span><span class="rg-name">${b.model}</span><span class="rg-bike-count"><b>${b.topics.length}</b>&nbsp;sistemas técnicos →</span></div><span class="rg-chev">ABRIR →</span></button>`).join('');}
  function openTopics(i){curBike=BIKES[i];document.getElementById('rgTopicsTitle').textContent=curBike.model;topicsGrid.innerHTML=curBike.topics.map(k=>{const t=TOPIC_INFO[k];return t?`<button class="rg-topic" data-topic="${k}"><span class="rg-ic">${t.icon}</span><span class="rg-tn">${t.titulo}</span><span class="rg-tmeta">Ficha técnica</span></button>`:'';}).join('');show('topics');}
  function dots(n){let h='<div class="rg-dots">';for(let i=1;i<=4;i++)h+='<i class="'+(i<=n?'on':'')+'"></i>';return h+'</div>';}
  function openDetail(k){const t=TOPIC_INFO[k];if(!t)return;document.getElementById('rgDetailCrumb').textContent='Suzuki · '+curBike.model;document.getElementById('rgDetailTitle').textContent=t.titulo;document.getElementById('rgDetailLede').textContent=t.lede;let b=t.html;if(t.tip)b+='<div class="rg-box rg-box--tip"><b>◆ Truco de mecánico</b>'+t.tip+'</div>';if(t.warn)b+='<div class="rg-box rg-box--warn"><b>▲ Cuidado con esto</b>'+t.warn+'</div>';if(t.secret)b+='<div class="rg-box rg-box--secret"><b>★ Lo que no te dicen en el taller</b>'+t.secret+'</div>';document.getElementById('rgDetailInfo').innerHTML=b;const r=(t.specs||[]).map(s=>'<div class="rg-row"><dt>'+s[0]+'</dt><dd>'+s[1]+'</dd></div>').join('');document.getElementById('rgDetailAside').innerHTML=`<div class="rg-spec"><h4>Datos rápidos</h4><dl>${r}</dl></div><div class="rg-difficulty"><span>Dificultad DIY</span>${dots(t.dif||1)}</div><div class="rg-spec"><h4>Logística</h4><dl><div class="rg-row"><dt>Intervalo</dt><dd>${t.interval||'—'}</dd></div><div class="rg-row"><dt>Tiempo aprox.</dt><dd>${t.tiempo||'—'}</dd></div></dl></div>`;show('detail');}
  function show(l){modelsEl.hidden=l!=='models';document.querySelector('.rg-hero').style.display=l==='models'?'':'none';topicsEl.hidden=l!=='topics';detailEl.hidden=l!=='detail';const t=l==='topics'?topicsEl:l==='detail'?detailEl:document.getElementById('ridera-garage');window.scrollTo({top:t.getBoundingClientRect().top+window.pageYOffset-90,behavior:'smooth'});}
  modelsEl.addEventListener('click',e=>{const b=e.target.closest('[data-bike]');if(b)openTopics(+b.dataset.bike)});
  topicsGrid.addEventListener('click',e=>{const t=e.target.closest('[data-topic]');if(t)openDetail(t.dataset.topic)});
  document.getElementById('btnBackModels').addEventListener('click',()=>show('models'));
  document.getElementById('btnBackTopics').addEventListener('click',()=>show('topics'));
  renderModels();
})();
</script>
