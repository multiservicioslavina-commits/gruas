<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ridera Music — Reproductor</title>
<meta name="description" content="Reproductor de música para motociclistas. Escucha tu playlist mientras rodas con Ridera Aventura.">
<meta name="robots" content="noindex, nofollow">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap');

  :root {
    --void: #0e0e0e;
    --surface: #141414;
    --card: #1a1a1a;
    --card2: #222;
    --orange: #E85D20;
    --orange-glow: rgba(232,93,32,0.35);
    --orange-dim: rgba(232,93,32,0.12);
    --green: #1DA84C;
    --ink: #e6e3de;
    --muted: #8a8a8a;
    --line: #2a2a2a;
    --font-display: 'Bebas Neue', sans-serif;
    --font-body: 'DM Sans', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--void);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ═══════════ HEADER ═══════════ */
  .header {
    padding: 16px 20px 12px;
    display: flex; align-items: center; gap: 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  .header-brand {
    font-family: var(--font-display);
    font-size: 22px; letter-spacing: 3px; color: var(--orange);
  }
  .header-sub {
    font-size: 11px; color: var(--muted); letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* ═══════════ PLAYER PRINCIPAL ═══════════ */
  .player-main {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 24px 20px 16px;
    position: relative;
    overflow: hidden;
  }

  .album-art-wrap {
    position: relative;
    width: min(280px, 65vw);
    height: min(280px, 65vw);
    margin-bottom: 28px;
  }
  .album-glow {
    position: absolute; inset: -30px;
    background: radial-gradient(circle, var(--orange-glow) 0%, transparent 70%);
    opacity: 0; transition: opacity 0.8s;
    border-radius: 50%;
  }
  .playing .album-glow { opacity: 1; }
  .album-art {
    width: 100%; height: 100%;
    border-radius: 20px;
    background: var(--card);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    transition: transform 0.3s;
  }
  .playing .album-art { transform: scale(1.02); }
  .album-art img {
    width: 100%; height: 100%; object-fit: cover;
    display: none;
  }
  .album-art img.loaded { display: block; }
  .album-placeholder {
    font-size: 64px;
    opacity: 0.3;
  }
  .album-art img.loaded ~ .album-placeholder { display: none; }

  .track-info {
    text-align: center;
    margin-bottom: 24px;
    max-width: 320px;
  }
  .track-title {
    font-size: 20px; font-weight: 700;
    color: var(--ink);
    line-height: 1.3;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 300px;
  }
  .track-artist {
    font-size: 14px; color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 300px;
  }

  /* ═══════════ PROGRESS BAR ═══════════ */
  .progress-wrap {
    width: min(340px, 85vw);
    margin-bottom: 8px;
  }
  .progress-bar {
    width: 100%; height: 6px;
    background: var(--card2);
    border-radius: 3px;
    cursor: pointer;
    position: relative;
    -webkit-tap-highlight-color: transparent;
  }
  .progress-fill {
    height: 100%; width: 0%;
    background: var(--orange);
    border-radius: 3px;
    position: relative;
    transition: width 0.1s linear;
  }
  .progress-fill::after {
    content: '';
    position: absolute; right: -6px; top: -4px;
    width: 14px; height: 14px;
    background: var(--orange);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--orange-glow);
    opacity: 0; transition: opacity 0.2s;
  }
  .progress-bar:hover .progress-fill::after,
  .progress-bar:active .progress-fill::after { opacity: 1; }
  .progress-times {
    display: flex; justify-content: space-between;
    font-size: 11px; color: var(--muted);
    margin-top: 6px;
    font-variant-numeric: tabular-nums;
  }

  /* ═══════════ CONTROLES ═══════════ */
  .controls {
    display: flex; align-items: center; gap: 24px;
    margin-bottom: 20px;
  }
  .ctrl-btn {
    background: none; border: none;
    color: var(--ink); cursor: pointer;
    padding: 8px;
    -webkit-tap-highlight-color: transparent;
    transition: color 0.15s, transform 0.1s;
  }
  .ctrl-btn:hover { color: var(--orange); }
  .ctrl-btn:active { transform: scale(0.9); }
  .ctrl-btn svg { display: block; }

  .btn-play {
    width: 64px; height: 64px;
    background: var(--orange);
    border: none; border-radius: 50%;
    color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 20px var(--orange-glow);
    transition: transform 0.15s, box-shadow 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-play:hover { transform: scale(1.06); box-shadow: 0 6px 30px var(--orange-glow); }
  .btn-play:active { transform: scale(0.95); }
  .btn-play svg { display: block; }

  /* ═══════════ CONTROLES SECUNDARIOS ═══════════ */
  .secondary-controls {
    display: flex; align-items: center; gap: 28px;
    margin-bottom: 16px;
  }
  .sec-btn {
    background: none; border: none;
    color: var(--muted); cursor: pointer;
    padding: 6px;
    -webkit-tap-highlight-color: transparent;
    transition: color 0.15s;
  }
  .sec-btn:hover { color: var(--ink); }
  .sec-btn.active { color: var(--orange); }
  .sec-btn svg { display: block; }

  /* ═══════════ VOLUMEN ═══════════ */
  .volume-wrap {
    display: flex; align-items: center; gap: 8px;
    width: min(200px, 50vw);
    margin-bottom: 4px;
  }
  .volume-icon {
    color: var(--muted);
    flex-shrink: 0;
    cursor: pointer;
    background: none; border: none;
    padding: 4px;
    -webkit-tap-highlight-color: transparent;
  }
  .volume-icon:hover { color: var(--ink); }
  .volume-bar {
    flex: 1; height: 4px;
    background: var(--card2);
    border-radius: 2px;
    cursor: pointer;
    position: relative;
  }
  .volume-fill {
    height: 100%; width: 80%;
    background: var(--ink);
    border-radius: 2px;
  }

  /* ═══════════ PLAYLIST ═══════════ */
  .playlist-toggle {
    width: 100%;
    background: var(--surface);
    border: none;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-family: var(--font-body);
    font-size: 12px; letter-spacing: 2px;
    text-transform: uppercase;
    padding: 12px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    -webkit-tap-highlight-color: transparent;
    transition: color 0.15s;
    flex-shrink: 0;
  }
  .playlist-toggle:hover { color: var(--ink); }
  .playlist-toggle svg {
    transition: transform 0.3s;
  }
  .playlist-toggle.open svg { transform: rotate(180deg); }

  .playlist-panel {
    background: var(--surface);
    max-height: 0;
    overflow-y: auto;
    transition: max-height 0.4s ease;
    flex-shrink: 0;
  }
  .playlist-panel.open {
    max-height: 50vh;
    border-top: 1px solid var(--line);
  }
  .playlist-panel::-webkit-scrollbar { width: 4px; }
  .playlist-panel::-webkit-scrollbar-track { background: transparent; }
  .playlist-panel::-webkit-scrollbar-thumb { background: var(--line); border-radius: 2px; }

  .pl-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px;
    cursor: pointer;
    transition: background 0.15s;
    -webkit-tap-highlight-color: transparent;
    border-bottom: 1px solid rgba(255,255,255,0.03);
  }
  .pl-item:hover { background: rgba(255,255,255,0.04); }
  .pl-item.active { background: var(--orange-dim); }
  .pl-item.active .pl-title { color: var(--orange); }
  .pl-num {
    width: 24px; text-align: center;
    font-size: 12px; color: var(--muted);
    flex-shrink: 0;
  }
  .pl-item.active .pl-num { color: var(--orange); }
  .pl-eq {
    display: none;
    gap: 2px; align-items: flex-end; height: 14px;
  }
  .pl-item.active.is-playing .pl-eq { display: flex; }
  .pl-item.active.is-playing .pl-num-text { display: none; }
  .pl-eq span {
    width: 3px; background: var(--orange); border-radius: 1px;
    animation: eq 0.6s ease-in-out infinite alternate;
  }
  .pl-eq span:nth-child(1) { height: 6px; animation-delay: 0s; }
  .pl-eq span:nth-child(2) { height: 10px; animation-delay: 0.15s; }
  .pl-eq span:nth-child(3) { height: 4px; animation-delay: 0.3s; }
  @keyframes eq {
    0% { height: 3px; }
    100% { height: 14px; }
  }
  .pl-info { flex: 1; min-width: 0; }
  .pl-title {
    font-size: 14px; font-weight: 500; color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .pl-artist {
    font-size: 12px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .pl-dur {
    font-size: 12px; color: var(--muted);
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }

  /* ═══════════ ADD MUSIC ═══════════ */
  .add-section {
    padding: 16px 20px;
    border-top: 1px solid var(--line);
  }
  .add-btn {
    width: 100%;
    padding: 12px;
    background: var(--card);
    border: 2px dashed var(--line);
    border-radius: 12px;
    color: var(--muted);
    font-family: var(--font-body);
    font-size: 14px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: border-color 0.2s, color 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .add-btn:hover { border-color: var(--orange); color: var(--orange); }
  .add-btn svg { flex-shrink: 0; }

  input[type="file"] { display: none; }

  /* ═══════════ EMPTY STATE ═══════════ */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
  }
  .empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.4; }
  .empty-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  .empty-sub { font-size: 14px; color: var(--muted); line-height: 1.5; }

  /* ═══════════ MINI PLAYER (bottom bar) ═══════════ */
  .mini-player {
    display: none;
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 1px solid var(--line);
    padding: 8px 16px;
    align-items: center; gap: 12px;
    z-index: 50;
  }
  .mini-art {
    width: 40px; height: 40px;
    border-radius: 8px;
    background: var(--surface);
    overflow: hidden;
    flex-shrink: 0;
  }
  .mini-art img { width: 100%; height: 100%; object-fit: cover; }
  .mini-info { flex: 1; min-width: 0; }
  .mini-title {
    font-size: 13px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .mini-artist {
    font-size: 11px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .mini-play {
    width: 36px; height: 36px;
    background: var(--orange); border: none; border-radius: 50%;
    color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
  }

  /* ═══════════ SAFE AREA (notch) ═══════════ */
  @supports (padding-top: env(safe-area-inset-top)) {
    .header { padding-top: calc(16px + env(safe-area-inset-top)); }
    .playlist-panel { padding-bottom: env(safe-area-inset-bottom); }
  }
</style>
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <div>
      <div class="header-brand">RIDERA</div>
      <div class="header-sub">Music Player</div>
    </div>
  </div>

  <!-- PLAYER -->
  <div class="player-main" id="playerMain">
    <!-- Empty state -->
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">🎵</div>
      <div class="empty-title">Tu musica para rodar</div>
      <div class="empty-sub">Agrega canciones desde tu dispositivo.<br>La musica sigue sonando con la pantalla apagada.</div>
      <br>
      <label class="add-btn" style="max-width:260px; margin:0 auto">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="10" y1="4" x2="10" y2="16"/><line x1="4" y1="10" x2="16" y2="10"/></svg>
        Agregar musica
        <input type="file" accept="audio/*" multiple id="fileInputEmpty">
      </label>
    </div>

    <!-- Player content (hidden until tracks added) -->
    <div id="playerContent" style="display:none; width:100%; display:none; flex-direction:column; align-items:center;">
      <div class="album-art-wrap" id="artWrap">
        <div class="album-glow"></div>
        <div class="album-art">
          <img id="albumImg" src="" alt="">
          <div class="album-placeholder">🏍</div>
        </div>
      </div>

      <div class="track-info">
        <div class="track-title" id="trackTitle">--</div>
        <div class="track-artist" id="trackArtist">--</div>
      </div>

      <div class="progress-wrap">
        <div class="progress-bar" id="progressBar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-times">
          <span id="timeCurrent">0:00</span>
          <span id="timeTotal">0:00</span>
        </div>
      </div>

      <div class="controls">
        <button class="ctrl-btn" id="btnPrev" title="Anterior">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="btn-play" id="btnPlay" title="Reproducir">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" id="iconPlay"><polygon points="8,5 19,12 8,19"/></svg>
          <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" id="iconPause" style="display:none"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>
        </button>
        <button class="ctrl-btn" id="btnNext" title="Siguiente">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zm-10 6l8.5 6V6z" transform="scale(-1,1) translate(-24,0)"/></svg>
        </button>
      </div>

      <div class="secondary-controls">
        <button class="sec-btn" id="btnShuffle" title="Aleatorio">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
        </button>
        <button class="sec-btn" id="btnRepeat" title="Repetir">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        </button>
      </div>

      <div class="volume-wrap">
        <button class="volume-icon" id="btnMute">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path id="volWaves" d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM19 12c0 2.97-1.65 5.54-4 6.71V5.29c2.35 1.17 4 3.74 4 6.71z"/></svg>
        </button>
        <div class="volume-bar" id="volumeBar">
          <div class="volume-fill" id="volumeFill"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- PLAYLIST TOGGLE -->
  <button class="playlist-toggle" id="plToggle">
    <span>Playlist</span>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
  </button>

  <!-- PLAYLIST PANEL -->
  <div class="playlist-panel" id="plPanel">
    <div id="plList"></div>
    <div class="add-section">
      <label class="add-btn">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><line x1="9" y1="3" x2="9" y2="15"/><line x1="3" y1="9" x2="15" y2="9"/></svg>
        Agregar mas canciones
        <input type="file" accept="audio/*" multiple id="fileInputAdd">
      </label>
    </div>
  </div>

<script>
(function() {
  'use strict';

  // ── State ─────────────────────────────────────────────────────────────
  let tracks = [];
  let currentIdx = -1;
  let isPlaying = false;
  let shuffle = false;
  let repeat = 0; // 0=off, 1=all, 2=one
  let shuffleOrder = [];

  const audio = new Audio();
  audio.preload = 'metadata';

  // ── DOM refs ──────────────────────────────────────────────────────────
  const $empty       = document.getElementById('emptyState');
  const $content     = document.getElementById('playerContent');
  const $artWrap     = document.getElementById('artWrap');
  const $albumImg    = document.getElementById('albumImg');
  const $title       = document.getElementById('trackTitle');
  const $artist      = document.getElementById('trackArtist');
  const $progressBar = document.getElementById('progressBar');
  const $progressFill= document.getElementById('progressFill');
  const $timeCur     = document.getElementById('timeCurrent');
  const $timeTotal   = document.getElementById('timeTotal');
  const $btnPlay     = document.getElementById('btnPlay');
  const $iconPlay    = document.getElementById('iconPlay');
  const $iconPause   = document.getElementById('iconPause');
  const $btnPrev     = document.getElementById('btnPrev');
  const $btnNext     = document.getElementById('btnNext');
  const $btnShuffle  = document.getElementById('btnShuffle');
  const $btnRepeat   = document.getElementById('btnRepeat');
  const $btnMute     = document.getElementById('btnMute');
  const $volumeBar   = document.getElementById('volumeBar');
  const $volumeFill  = document.getElementById('volumeFill');
  const $plToggle    = document.getElementById('plToggle');
  const $plPanel     = document.getElementById('plPanel');
  const $plList      = document.getElementById('plList');
  const $playerMain  = document.getElementById('playerMain');

  // ── Helpers ───────────────────────────────────────────────────────────
  function fmt(sec) {
    if (!sec || !isFinite(sec)) return '0:00';
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return m + ':' + String(s).padStart(2, '0');
  }

  function cleanName(filename) {
    return filename
      .replace(/\.[^.]+$/, '')
      .replace(/[-_]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  // ── File handling ─────────────────────────────────────────────────────
  function addFiles(files) {
    const newTracks = [];
    for (const file of files) {
      if (!file.type.startsWith('audio/')) continue;
      const url = URL.createObjectURL(file);
      newTracks.push({
        name: cleanName(file.name),
        artist: 'Archivo local',
        url,
        file,
        duration: 0,
        artUrl: null,
      });
    }
    if (!newTracks.length) return;

    tracks.push(...newTracks);
    buildShuffleOrder();

    // Extract metadata
    newTracks.forEach((track, i) => {
      const idx = tracks.indexOf(track);
      extractMeta(track).then(() => {
        renderPlaylist();
        if (idx === currentIdx) updateUI();
      });
    });

    if (currentIdx < 0) {
      loadTrack(0);
    }
    showPlayer();
    renderPlaylist();
  }

  async function extractMeta(track) {
    return new Promise(resolve => {
      const a = new Audio();
      a.preload = 'metadata';
      a.src = track.url;
      a.addEventListener('loadedmetadata', () => {
        track.duration = a.duration;
        resolve();
      }, { once: true });
      a.addEventListener('error', () => resolve(), { once: true });
      setTimeout(resolve, 3000);
    });
  }

  // ── Player logic ──────────────────────────────────────────────────────
  function showPlayer() {
    $empty.style.display = 'none';
    $content.style.display = 'flex';
  }

  function loadTrack(idx) {
    if (idx < 0 || idx >= tracks.length) return;
    currentIdx = idx;
    const track = tracks[idx];
    audio.src = track.url;
    updateUI();
    renderPlaylist();
    updateMediaSession();
  }

  function updateUI() {
    if (currentIdx < 0) return;
    const track = tracks[currentIdx];
    $title.textContent = track.name;
    $artist.textContent = track.artist;
    if (track.artUrl) {
      $albumImg.src = track.artUrl;
      $albumImg.classList.add('loaded');
    } else {
      $albumImg.classList.remove('loaded');
      $albumImg.src = '';
    }
    $timeTotal.textContent = fmt(track.duration);
  }

  function play() {
    if (currentIdx < 0 && tracks.length) loadTrack(0);
    if (currentIdx < 0) return;
    audio.play().then(() => {
      isPlaying = true;
      updatePlayBtn();
      $artWrap.parentElement.classList.add('playing');
      renderPlaylist();
    }).catch(() => {});
  }

  function pause() {
    audio.pause();
    isPlaying = false;
    updatePlayBtn();
    $artWrap.parentElement.classList.remove('playing');
    renderPlaylist();
  }

  function togglePlay() {
    isPlaying ? pause() : play();
  }

  function updatePlayBtn() {
    $iconPlay.style.display = isPlaying ? 'none' : 'block';
    $iconPause.style.display = isPlaying ? 'block' : 'none';
  }

  function nextTrack() {
    if (!tracks.length) return;
    if (repeat === 2) {
      audio.currentTime = 0;
      play();
      return;
    }
    let next;
    if (shuffle) {
      const curShuffleIdx = shuffleOrder.indexOf(currentIdx);
      next = shuffleOrder[(curShuffleIdx + 1) % shuffleOrder.length];
    } else {
      next = (currentIdx + 1) % tracks.length;
    }
    if (next === 0 && repeat === 0 && !shuffle) {
      loadTrack(0);
      pause();
      return;
    }
    loadTrack(next);
    play();
  }

  function prevTrack() {
    if (!tracks.length) return;
    if (audio.currentTime > 3) {
      audio.currentTime = 0;
      return;
    }
    let prev;
    if (shuffle) {
      const curShuffleIdx = shuffleOrder.indexOf(currentIdx);
      prev = shuffleOrder[(curShuffleIdx - 1 + shuffleOrder.length) % shuffleOrder.length];
    } else {
      prev = (currentIdx - 1 + tracks.length) % tracks.length;
    }
    loadTrack(prev);
    play();
  }

  function buildShuffleOrder() {
    shuffleOrder = tracks.map((_, i) => i);
    for (let i = shuffleOrder.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffleOrder[i], shuffleOrder[j]] = [shuffleOrder[j], shuffleOrder[i]];
    }
  }

  // ── Playlist render ───────────────────────────────────────────────────
  function renderPlaylist() {
    $plList.innerHTML = tracks.map((t, i) => {
      const active = i === currentIdx;
      const playing = active && isPlaying;
      return `<div class="pl-item${active ? ' active' : ''}${playing ? ' is-playing' : ''}" data-idx="${i}">
        <div class="pl-num">
          <span class="pl-num-text">${i + 1}</span>
          <div class="pl-eq"><span></span><span></span><span></span></div>
        </div>
        <div class="pl-info">
          <div class="pl-title">${esc(t.name)}</div>
          <div class="pl-artist">${esc(t.artist)}</div>
        </div>
        <div class="pl-dur">${fmt(t.duration)}</div>
      </div>`;
    }).join('');
  }

  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // ── Media Session API (background playback) ───────────────────────────
  function updateMediaSession() {
    if (!('mediaSession' in navigator)) return;
    const track = tracks[currentIdx];
    if (!track) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: track.name,
      artist: track.artist,
      album: 'Ridera Aventura',
      artwork: track.artUrl
        ? [{ src: track.artUrl, sizes: '512x512', type: 'image/png' }]
        : [],
    });
    navigator.mediaSession.setActionHandler('play', play);
    navigator.mediaSession.setActionHandler('pause', pause);
    navigator.mediaSession.setActionHandler('previoustrack', prevTrack);
    navigator.mediaSession.setActionHandler('nexttrack', nextTrack);
    navigator.mediaSession.setActionHandler('seekto', e => {
      if (e.fastSeek && 'fastSeek' in audio) audio.fastSeek(e.seekTime);
      else audio.currentTime = e.seekTime;
    });
  }

  // ── Event listeners ───────────────────────────────────────────────────

  // Play / Pause / Nav
  $btnPlay.addEventListener('click', togglePlay);
  $btnNext.addEventListener('click', nextTrack);
  $btnPrev.addEventListener('click', prevTrack);

  // Shuffle
  $btnShuffle.addEventListener('click', () => {
    shuffle = !shuffle;
    $btnShuffle.classList.toggle('active', shuffle);
    if (shuffle) buildShuffleOrder();
  });

  // Repeat
  $btnRepeat.addEventListener('click', () => {
    repeat = (repeat + 1) % 3;
    $btnRepeat.classList.toggle('active', repeat > 0);
    if (repeat === 2) {
      $btnRepeat.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/><text x="12" y="16" font-size="9" fill="currentColor" stroke="none" text-anchor="middle" font-weight="bold">1</text></svg>';
    } else {
      $btnRepeat.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>';
    }
  });

  // Progress bar
  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    $progressFill.style.width = pct + '%';
    $timeCur.textContent = fmt(audio.currentTime);
  });

  audio.addEventListener('loadedmetadata', () => {
    $timeTotal.textContent = fmt(audio.duration);
    if (currentIdx >= 0) tracks[currentIdx].duration = audio.duration;
  });

  audio.addEventListener('ended', nextTrack);

  $progressBar.addEventListener('click', e => {
    if (!audio.duration) return;
    const rect = $progressBar.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    audio.currentTime = pct * audio.duration;
  });

  // Touch drag on progress
  let draggingProgress = false;
  $progressBar.addEventListener('touchstart', e => { draggingProgress = true; }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (!draggingProgress || !audio.duration) return;
    const rect = $progressBar.getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (e.touches[0].clientX - rect.left) / rect.width));
    audio.currentTime = pct * audio.duration;
  }, { passive: true });
  document.addEventListener('touchend', () => { draggingProgress = false; });

  // Volume
  $volumeBar.addEventListener('click', e => {
    const rect = $volumeBar.getBoundingClientRect();
    const vol = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    audio.volume = vol;
    $volumeFill.style.width = (vol * 100) + '%';
  });

  $btnMute.addEventListener('click', () => {
    audio.muted = !audio.muted;
    $btnMute.style.opacity = audio.muted ? 0.4 : 1;
  });

  // Playlist toggle
  $plToggle.addEventListener('click', () => {
    $plToggle.classList.toggle('open');
    $plPanel.classList.toggle('open');
  });

  // Playlist item click
  $plList.addEventListener('click', e => {
    const item = e.target.closest('.pl-item');
    if (!item) return;
    const idx = parseInt(item.dataset.idx);
    loadTrack(idx);
    play();
  });

  // File inputs
  document.getElementById('fileInputEmpty').addEventListener('change', e => addFiles(e.target.files));
  document.getElementById('fileInputAdd').addEventListener('change', e => addFiles(e.target.files));

  // Keyboard shortcuts
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
    if (e.code === 'ArrowRight') { e.preventDefault(); nextTrack(); }
    if (e.code === 'ArrowLeft') { e.preventDefault(); prevTrack(); }
  });

  // Keep audio session alive for background playback
  if ('wakeLock' in navigator) {
    let wakeLock = null;
    async function requestWakeLock() {
      try {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      } catch {}
    }
    audio.addEventListener('play', requestWakeLock);
    audio.addEventListener('pause', () => { if (wakeLock) wakeLock.release(); });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && isPlaying) requestWakeLock();
    });
  }

})();
</script>
</body>
</html>
