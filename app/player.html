<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ridera Music</title>
<meta name="description" content="Reproductor de musica para motociclistas. Escucha tu playlist mientras rodas con Ridera Aventura.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0e0e0e">
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap');

:root {
  --void: #0e0e0e;
  --surface: #141414;
  --card: #1a1a1a;
  --card2: #222;
  --accent: #E85D20;
  --accent-glow: rgba(232,93,32,0.35);
  --accent-dim: rgba(232,93,32,0.10);
  --green: #1DA84C;
  --red: #C0272D;
  --ink: #e6e3de;
  --muted: #8a8a8a;
  --muted2: #555;
  --line: #2a2a2a;
  --font-display: 'Bebas Neue', sans-serif;
  --font-body: 'DM Sans', sans-serif;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --bottom-nav: 56px;
  --mini-h: 64px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--void);
  color: var(--ink);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column;
  position: relative;
  user-select: none;
  -webkit-user-select: none;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; }
input[type="file"] { display: none; }

/* ═══════════ APP SHELL ═══════════ */
.app-header {
  padding: calc(12px + var(--safe-top)) 20px 10px;
  display: flex; align-items: center; justify-content: space-between;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  flex-shrink: 0; z-index: 10;
}
.brand { font-family: var(--font-display); font-size: 24px; letter-spacing: 3px; color: var(--accent); }
.brand small { font-size: 11px; color: var(--muted); letter-spacing: 2px; font-family: var(--font-body); font-weight: 400; margin-left: 6px; }
.header-actions { display: flex; gap: 4px; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 50%;
  background: none; border: none; color: var(--muted);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: color .15s, background .15s;
}
.icon-btn:hover { color: var(--ink); background: rgba(255,255,255,.06); }
.icon-btn.active { color: var(--accent); }

/* ═══════════ SCREENS ═══════════ */
.screens {
  flex: 1; position: relative; overflow: hidden;
  margin-bottom: calc(var(--mini-h) + var(--bottom-nav) + var(--safe-bottom));
}
.screen {
  position: absolute; inset: 0;
  overflow-y: auto; overflow-x: hidden;
  padding: 16px 16px 20px;
  display: none;
  -webkit-overflow-scrolling: touch;
}
.screen.active { display: block; }
.screen::-webkit-scrollbar { width: 3px; }
.screen::-webkit-scrollbar-thumb { background: var(--line); border-radius: 2px; }

/* ═══════════ BOTTOM NAV ═══════════ */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: calc(var(--bottom-nav) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  background: var(--surface);
  border-top: 1px solid var(--line);
  display: flex; z-index: 30;
}
.nav-item {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 3px;
  background: none; border: none; color: var(--muted);
  font-size: 10px; letter-spacing: .5px;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: color .15s;
}
.nav-item.active { color: var(--accent); }
.nav-item svg { width: 22px; height: 22px; }

/* ═══════════ MINI PLAYER ═══════════ */
.mini-player {
  position: fixed; left: 0; right: 0;
  bottom: calc(var(--bottom-nav) + var(--safe-bottom));
  height: var(--mini-h);
  background: var(--card);
  border-top: 1px solid var(--line);
  display: none; align-items: center; gap: 12px;
  padding: 0 12px; z-index: 25;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.mini-player.visible { display: flex; }
.mini-progress {
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: var(--line);
}
.mini-progress-fill { height: 100%; width: 0%; background: var(--accent); transition: width .2s linear; }
.mini-art {
  width: 44px; height: 44px; border-radius: 10px;
  background: var(--surface); overflow: hidden; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.mini-art img { width: 100%; height: 100%; object-fit: cover; display: none; }
.mini-art img.loaded { display: block; }
.mini-art-ph { font-size: 20px; opacity: .3; }
.mini-art img.loaded ~ .mini-art-ph { display: none; }
.mini-info { flex: 1; min-width: 0; }
.mini-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini-artist { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini-controls { display: flex; gap: 2px; flex-shrink: 0; }
.mini-btn {
  width: 38px; height: 38px; border-radius: 50%;
  background: none; border: none; color: var(--ink);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.mini-btn.play-btn { background: var(--accent); color: #fff; width: 36px; height: 36px; }

/* ═══════════ HOME SCREEN ═══════════ */
.section-title {
  font-size: 18px; font-weight: 700; margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
}
.section-title .sec-icon { font-size: 16px; }
.home-greeting {
  font-family: var(--font-display);
  font-size: 28px; letter-spacing: 2px;
  margin-bottom: 20px;
}
.home-greeting span { color: var(--accent); }

.quick-actions {
  display: flex; gap: 10px; margin-bottom: 24px;
  overflow-x: auto; padding-bottom: 4px;
  -webkit-overflow-scrolling: touch;
}
.quick-actions::-webkit-scrollbar { display: none; }
.quick-chip {
  flex-shrink: 0; padding: 10px 18px;
  background: var(--card); border: 1px solid var(--line);
  border-radius: 24px; font-size: 13px; font-weight: 500;
  display: flex; align-items: center; gap: 8px;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: border-color .15s, background .15s;
}
.quick-chip:hover { border-color: var(--accent); }
.quick-chip.accent { background: var(--accent-dim); border-color: rgba(232,93,32,.3); color: var(--accent); }

.recent-grid {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 10px; margin-bottom: 24px;
}
.recent-item {
  display: flex; align-items: center; gap: 10px;
  background: var(--card); border-radius: 8px;
  overflow: hidden; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background .15s;
}
.recent-item:hover { background: var(--card2); }
.recent-art {
  width: 48px; height: 48px; flex-shrink: 0;
  background: var(--surface);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}
.recent-art img { width: 100%; height: 100%; object-fit: cover; }
.recent-name { font-size: 12px; font-weight: 600; padding: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ═══════════ SONG LIST ITEMS ═══════════ */
.song-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 4px; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  border-radius: 8px;
  transition: background .12s;
}
.song-item:hover { background: rgba(255,255,255,.04); }
.song-item.active { background: var(--accent-dim); }
.song-item.active .song-title { color: var(--accent); }
.song-art {
  width: 48px; height: 48px; border-radius: 8px;
  background: var(--card2); overflow: hidden; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.song-art img { width: 100%; height: 100%; object-fit: cover; display: none; }
.song-art img.loaded { display: block; }
.song-art-ph { font-size: 18px; opacity: .3; }
.song-art img.loaded ~ .song-art-ph { display: none; }
.song-info { flex: 1; min-width: 0; }
.song-title { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.song-artist { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.song-meta { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.song-dur { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.song-fav {
  width: 30px; height: 30px; background: none; border: none;
  color: var(--muted2); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
  transition: color .15s;
}
.song-fav:hover { color: var(--ink); }
.song-fav.liked { color: var(--red); }

.eq-bars {
  display: none; gap: 2px; align-items: flex-end; height: 16px;
}
.song-item.active.is-playing .eq-bars { display: flex; }
.song-item.active.is-playing .song-art-ph,
.song-item.active.is-playing .song-art img { opacity: .4; }
.eq-bars span {
  width: 3px; background: var(--accent); border-radius: 1px;
  animation: eqAnim .5s ease-in-out infinite alternate;
}
.eq-bars span:nth-child(1) { height: 5px; animation-delay: 0s; }
.eq-bars span:nth-child(2) { height: 11px; animation-delay: .12s; }
.eq-bars span:nth-child(3) { height: 7px; animation-delay: .24s; }
@keyframes eqAnim { 0%{height:3px} 100%{height:16px} }

/* ═══════════ LIBRARY SCREEN ═══════════ */
.lib-tabs {
  display: flex; gap: 6px; margin-bottom: 16px;
  overflow-x: auto; padding-bottom: 4px;
}
.lib-tabs::-webkit-scrollbar { display: none; }
.lib-tab {
  flex-shrink: 0; padding: 8px 16px;
  background: var(--card); border: 1px solid var(--line);
  border-radius: 20px; font-size: 13px;
  color: var(--muted); cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: all .15s;
}
.lib-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.lib-empty {
  text-align: center; padding: 40px 20px;
  color: var(--muted);
}
.lib-empty-icon { font-size: 40px; margin-bottom: 12px; opacity: .4; }
.lib-empty-text { font-size: 14px; line-height: 1.5; }

/* ═══════════ FULL PLAYER (overlay) ═══════════ */
.full-player {
  position: fixed; inset: 0; z-index: 50;
  background: var(--void);
  display: flex; flex-direction: column;
  transform: translateY(100%);
  transition: transform .35s cubic-bezier(.32,.72,0,1);
  padding: calc(12px + var(--safe-top)) 24px calc(24px + var(--safe-bottom));
  overflow: hidden;
}
.full-player.open { transform: translateY(0); }
.full-player-bg {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at 50% 30%, var(--accent-glow) 0%, var(--void) 70%);
  opacity: 0; transition: opacity .8s;
}
.full-player.playing .full-player-bg { opacity: 1; }

.fp-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px; position: relative; z-index: 1;
}
.fp-close {
  width: 40px; height: 40px; background: none; border: none;
  color: var(--muted); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
}
.fp-source { font-size: 11px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }
.fp-menu { width: 40px; height: 40px; background: none; border: none; color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center; }

.fp-art-wrap {
  flex: 1; display: flex; align-items: center; justify-content: center;
  position: relative; z-index: 1; min-height: 0;
}
.fp-art {
  width: min(300px, 70vw); height: min(300px, 70vw);
  border-radius: 20px; overflow: hidden;
  background: var(--card);
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
  display: flex; align-items: center; justify-content: center;
  transition: transform .4s;
}
.full-player.playing .fp-art { transform: scale(1.03); }
.fp-art img { width: 100%; height: 100%; object-fit: cover; display: none; }
.fp-art img.loaded { display: block; }
.fp-art-ph { font-size: 72px; opacity: .25; }
.fp-art img.loaded ~ .fp-art-ph { display: none; }

.fp-info {
  text-align: center; margin: 20px 0 16px;
  position: relative; z-index: 1;
}
.fp-title {
  font-size: 20px; font-weight: 700; line-height: 1.3;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 320px; margin: 0 auto;
}
.fp-artist {
  font-size: 14px; color: var(--muted); margin-top: 4px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 280px; margin: 4px auto 0;
}

.fp-progress { position: relative; z-index: 1; margin: 0 0 4px; }
.fp-bar {
  width: 100%; height: 6px; background: rgba(255,255,255,.12);
  border-radius: 3px; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.fp-bar-fill {
  height: 100%; width: 0%; background: var(--accent);
  border-radius: 3px; position: relative;
  transition: width .15s linear;
}
.fp-bar-fill::after {
  content: ''; position: absolute; right: -7px; top: -5px;
  width: 16px; height: 16px; background: #fff;
  border-radius: 50%; box-shadow: 0 0 8px rgba(0,0,0,.4);
  opacity: 0; transition: opacity .15s;
}
.fp-bar:active .fp-bar-fill::after { opacity: 1; }
.fp-times {
  display: flex; justify-content: space-between;
  font-size: 11px; color: var(--muted);
  margin-top: 6px; font-variant-numeric: tabular-nums;
}

.fp-controls {
  display: flex; align-items: center; justify-content: center;
  gap: 20px; margin: 12px 0; position: relative; z-index: 1;
}
.fp-ctrl {
  width: 44px; height: 44px; background: none; border: none;
  color: var(--ink); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
  transition: color .12s, transform .1s;
}
.fp-ctrl:active { transform: scale(.9); }
.fp-ctrl.sm { width: 36px; height: 36px; color: var(--muted); }
.fp-ctrl.sm.active { color: var(--accent); }
.fp-play-btn {
  width: 64px; height: 64px; border-radius: 50%;
  background: var(--accent); border: none; color: #fff;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 24px var(--accent-glow);
  -webkit-tap-highlight-color: transparent;
  transition: transform .12s;
}
.fp-play-btn:hover { transform: scale(1.06); }
.fp-play-btn:active { transform: scale(.94); }

.fp-extra {
  display: flex; align-items: center; justify-content: center;
  gap: 32px; position: relative; z-index: 1;
}
.fp-extra-btn {
  background: none; border: none; color: var(--muted2);
  cursor: pointer; padding: 6px;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
  transition: color .15s;
}
.fp-extra-btn:hover { color: var(--ink); }
.fp-extra-btn.liked { color: var(--red); }

/* ═══════════ QUEUE SHEET ═══════════ */
.queue-sheet {
  position: fixed; inset: 0; z-index: 60;
  display: flex; flex-direction: column;
  justify-content: flex-end;
  pointer-events: none;
  opacity: 0; transition: opacity .25s;
}
.queue-sheet.open { pointer-events: auto; opacity: 1; }
.queue-overlay {
  position: absolute; inset: 0;
  background: rgba(0,0,0,.6);
}
.queue-body {
  position: relative;
  background: var(--surface);
  border-radius: 20px 20px 0 0;
  max-height: 70vh;
  display: flex; flex-direction: column;
  transform: translateY(100%);
  transition: transform .35s cubic-bezier(.32,.72,0,1);
  padding-bottom: var(--safe-bottom);
}
.queue-sheet.open .queue-body { transform: translateY(0); }
.queue-header {
  padding: 16px 20px 12px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}
.queue-title { font-size: 16px; font-weight: 700; }
.queue-clear {
  font-size: 12px; color: var(--accent); background: none; border: none;
  cursor: pointer; padding: 6px 10px;
}
.queue-list {
  flex: 1; overflow-y: auto; padding: 8px 12px;
}

/* ═══════════ ADD FAB ═══════════ */
.fab-add {
  position: fixed;
  right: 16px;
  bottom: calc(var(--mini-h) + var(--bottom-nav) + var(--safe-bottom) + 12px);
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--accent); border: none; color: #fff;
  box-shadow: 0 4px 16px var(--accent-glow);
  cursor: pointer; z-index: 20;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
  transition: transform .15s;
}
.fab-add:hover { transform: scale(1.08); }
.fab-add:active { transform: scale(.92); }

/* ═══════════ TOAST ═══════════ */
.toast {
  position: fixed; bottom: calc(var(--mini-h) + var(--bottom-nav) + var(--safe-bottom) + 16px);
  left: 50%; transform: translateX(-50%) translateY(60px);
  background: var(--card2); color: var(--ink);
  padding: 10px 20px; border-radius: 24px;
  font-size: 13px; font-weight: 500;
  box-shadow: 0 4px 20px rgba(0,0,0,.4);
  z-index: 100; opacity: 0;
  transition: transform .3s, opacity .3s;
  pointer-events: none;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- ═══════════ HEADER ═══════════ -->
<div class="app-header">
  <div class="brand">RIDERA<small>Music</small></div>
</div>

<!-- ═══════════ SCREENS ═══════════ -->
<div class="screens">
  <!-- HOME -->
  <div class="screen active" id="scrHome">
    <div class="home-greeting">Hola, <span>Rider</span></div>
    <div class="quick-actions">
      <label class="quick-chip accent">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="2" x2="8" y2="14"/><line x1="2" y1="8" x2="14" y2="8"/></svg>
        Agregar musica
        <input type="file" accept="audio/*" multiple id="fileHome">
      </label>
      <div class="quick-chip" onclick="showTab('library');setLibTab('favorites')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        Favoritos
      </div>
      <div class="quick-chip" onclick="openQueue()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="14" y2="12"/><line x1="4" y1="18" x2="18" y2="18"/></svg>
        Cola
      </div>
    </div>

    <div class="section-title"><span class="sec-icon">&#9205;</span> Recientes</div>
    <div id="homeRecent"></div>

    <div style="margin-top:24px">
      <div class="section-title"><span class="sec-icon">&#127925;</span> Todas las canciones</div>
      <div id="homeAll"></div>
    </div>
  </div>

  <!-- LIBRARY -->
  <div class="screen" id="scrLibrary">
    <div class="section-title" style="margin-bottom:14px">Biblioteca</div>
    <div class="lib-tabs" id="libTabs">
      <div class="lib-tab active" data-tab="all">Canciones</div>
      <div class="lib-tab" data-tab="favorites">Favoritos</div>
      <div class="lib-tab" data-tab="playlists">Playlists</div>
      <div class="lib-tab" data-tab="recent">Recientes</div>
    </div>
    <div id="libContent"></div>
  </div>

  <!-- SEARCH -->
  <div class="screen" id="scrSearch">
    <div style="position:relative; margin-bottom:16px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" style="position:absolute;left:14px;top:50%;transform:translateY(-50%)"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="Buscar canciones, artistas..." style="
        width:100%; padding:12px 16px 12px 42px;
        background:var(--card); border:1px solid var(--line);
        border-radius:12px; color:var(--ink);
        font-family:var(--font-body); font-size:14px;
        outline:none; -webkit-appearance:none;
      ">
    </div>
    <div id="searchResults"></div>
  </div>
</div>

<!-- ═══════════ FAB ═══════════ -->
<label class="fab-add" title="Agregar musica">
  <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  <input type="file" accept="audio/*" multiple id="fileFab">
</label>

<!-- ═══════════ MINI PLAYER ═══════════ -->
<div class="mini-player" id="miniPlayer" onclick="openFullPlayer()">
  <div class="mini-progress"><div class="mini-progress-fill" id="miniProgressFill"></div></div>
  <div class="mini-art">

      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>

    </button>
    <button class="fp-extra-btn" onclick="openQueue()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="14" y2="12"/><line x1="4" y1="18" x2="18" y2="18"/></svg>

  </div>

<!-- ═══════════ TOAST ═══════════ -->
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

// ── State ─────────────────────────────────────────────────────────────
let tracks = [];
let queue = [];
let currentIdx = -1;
let isPlaying = false;
let shuffleOn = false;
let repeatMode = 0; // 0=off 1=all 2=one
let shuffleOrder = [];
let favorites = new Set();
let recentIds = [];
let currentLibTab = 'all';

const audio = new Audio();
audio.preload = 'metadata';

const DB_NAME = 'ridera_music';
const DB_VER = 1;
let db = null;

// ── IndexedDB ───────────────────────────────────────────────────────
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('state')) d.createObjectStore('state');
    };
    req.onsuccess = e => { db = e.target.result; resolve(db); };
    req.onerror = () => resolve(null);
  });
}
function dbGet(key) {
  return new Promise(resolve => {
    if (!db) return resolve(null);
    const tx = db.transaction('state','readonly');
    const req = tx.objectStore('state').get(key);
    req.onsuccess = () => resolve(req.result ?? null);
    req.onerror = () => resolve(null);
  });
}
function dbSet(key, val) {
  if (!db) return;
  const tx = db.transaction('state','readwrite');
  tx.objectStore('state').put(val, key);
}
async function loadState() {
  await openDB();
  const favs = await dbGet('favorites');
  if (Array.isArray(favs)) favorites = new Set(favs);
  const rec = await dbGet('recents');
  if (Array.isArray(rec)) recentIds = rec;
}
function saveFavorites() { dbSet('favorites', [...favorites]); }
function saveRecents() { dbSet('recents', recentIds.slice(0, 30)); }

// ── Helpers ─────────────────────────────────────────────────────────
function fmt(sec) {
  if (!sec || !isFinite(sec)) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ':' + String(s).padStart(2, '0');
}
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function cleanName(fn) { return fn.replace(/\.[^.]+$/, '').replace(/[-_]/g, ' ').replace(/\s+/g, ' ').trim(); }
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2200);
}

// ── File handling ───────────────────────────────────────────────────
function addFiles(files) {
  let added = 0;
  for (const file of files) {
    if (!file.type.startsWith('audio/')) continue;
    const url = URL.createObjectURL(file);
    const id = genId();
    tracks.push({ id, name: cleanName(file.name), artist: 'Archivo local', url, file, duration: 0, artUrl: null });
    queue.push(tracks.length - 1);
    added++;
    extractMeta(tracks[tracks.length - 1]);
  }
  if (!added) return;
  buildShuffleOrder();
  if (currentIdx < 0) loadTrack(0);
  document.getElementById('miniPlayer').classList.add('visible');
  renderAll();
  toast(added === 1 ? 'Cancion agregada' : added + ' canciones agregadas');
}

function extractMeta(track) {
  const a = new Audio();
  a.preload = 'metadata';
  a.src = track.url;
  a.addEventListener('loadedmetadata', () => {
    track.duration = a.duration;
    renderAll();
  }, { once: true });
}

// ── Playback ────────────────────────────────────────────────────────
function loadTrack(idx) {
  if (idx < 0 || idx >= tracks.length) return;
  currentIdx = idx;
  audio.src = tracks[idx].url;
  updateNowPlaying();
  updateMediaSession();
  addToRecent(idx);
  renderAll();
}

function play() {
  if (currentIdx < 0 && tracks.length) loadTrack(0);
  if (currentIdx < 0) return;
  audio.play().then(() => {
    isPlaying = true;
    updatePlayIcons();
    document.getElementById('fullPlayer').classList.add('playing');
    renderAll();
  }).catch(() => {});
}

function pause() {
  audio.pause();
  isPlaying = false;
  updatePlayIcons();
  document.getElementById('fullPlayer').classList.remove('playing');
  renderAll();
}

window.togglePlay = function() { isPlaying ? pause() : play(); };

window.nextTrack = function() {
  if (!tracks.length) return;
  if (repeatMode === 2) { audio.currentTime = 0; play(); return; }
  let next;
  if (shuffleOn) {
    const si = shuffleOrder.indexOf(currentIdx);
    next = shuffleOrder[(si + 1) % shuffleOrder.length];
  } else {
    next = (currentIdx + 1) % tracks.length;
  }
  if (next === 0 && repeatMode === 0 && !shuffleOn) { loadTrack(0); pause(); return; }
  loadTrack(next);
  play();
};

window.prevTrack = function() {
  if (!tracks.length) return;
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  let prev;
  if (shuffleOn) {
    const si = shuffleOrder.indexOf(currentIdx);
    prev = shuffleOrder[(si - 1 + shuffleOrder.length) % shuffleOrder.length];
  } else {
    prev = (currentIdx - 1 + tracks.length) % tracks.length;
  }
  loadTrack(prev);
  play();
};

function buildShuffleOrder() {
  shuffleOrder = tracks.map((_, i) => i);
  for (let i = shuffleOrder.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffleOrder[i], shuffleOrder[j]] = [shuffleOrder[j], shuffleOrder[i]];
  }
}

window.toggleShuffle = function() {
  shuffleOn = !shuffleOn;
  document.getElementById('fpShuffle').classList.toggle('active', shuffleOn);
  if (shuffleOn) buildShuffleOrder();
  toast(shuffleOn ? 'Aleatorio activado' : 'Aleatorio desactivado');
};

window.toggleRepeat = function() {
  repeatMode = (repeatMode + 1) % 3;
  const btn = document.getElementById('fpRepeat');
  btn.classList.toggle('active', repeatMode > 0);
  if (repeatMode === 2) {
    btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/><text x="12" y="16" font-size="9" fill="currentColor" stroke="none" text-anchor="middle" font-weight="bold">1</text></svg>';
  } else {
    btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>';
  }
  const labels = ['Repetir desactivado', 'Repetir todo', 'Repetir una'];
  toast(labels[repeatMode]);
};

// ── Favorites ───────────────────────────────────────────────────────
window.toggleFav = function(idx) {
  const t = tracks[idx];
  if (!t) return;
  if (favorites.has(t.id)) { favorites.delete(t.id); toast('Eliminado de favoritos'); }
  else { favorites.add(t.id); toast('Agregado a favoritos'); }
  saveFavorites();
  updateFavIcon();
  renderAll();
};
window.toggleFavCurrent = function() {
  if (currentIdx >= 0) toggleFav(currentIdx);
};
function updateFavIcon() {
  const btn = document.getElementById('fpFav');
  if (currentIdx >= 0 && favorites.has(tracks[currentIdx].id)) {
    btn.classList.add('liked');
    btn.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';
  } else {
    btn.classList.remove('liked');
    btn.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>';
  }
}

// ── Recents ─────────────────────────────────────────────────────────
function addToRecent(idx) {
  const id = tracks[idx].id;
  recentIds = recentIds.filter(r => r !== id);
  recentIds.unshift(id);
  if (recentIds.length > 30) recentIds.length = 30;
  saveRecents();
}

// ── Queue ───────────────────────────────────────────────────────────
window.openQueue = function() { renderQueue(); document.getElementById('queueSheet').classList.add('open'); };
window.closeQueue = function() { document.getElementById('queueSheet').classList.remove('open'); };
window.clearQueue = function() {
  queue = tracks.map((_, i) => i);
  renderQueue();
  toast('Cola restablecida');
};
function renderQueue() {
  const list = document.getElementById('queueList');
  if (!tracks.length) { list.innerHTML = '<div class="lib-empty"><div class="lib-empty-icon">&#128247;</div><div class="lib-empty-text">Cola vacia</div></div>'; return; }
  list.innerHTML = tracks.map((t, i) => `
    <div class="song-item${i===currentIdx?' active':''}${i===currentIdx&&isPlaying?' is-playing':''}" onclick="loadTrack(${i});play();renderQueue()">
      <div class="song-art"><span class="song-art-ph">&#127925;</span><div class="eq-bars"><span></span><span></span><span></span></div></div>
      <div class="song-info"><div class="song-title">${esc(t.name)}</div><div class="song-artist">${esc(t.artist)}</div></div>
      <div class="song-dur">${fmt(t.duration)}</div>
    </div>
  `).join('');
}
window.loadTrack = loadTrack;
window.play = play;

// ── UI Updates ──────────────────────────────────────────────────────
function updateNowPlaying() {
  if (currentIdx < 0) return;
  const t = tracks[currentIdx];
  document.getElementById('miniTitle').textContent = t.name;
  document.getElementById('miniArtist').textContent = t.artist;
  document.getElementById('fpTitle').textContent = t.name;
  document.getElementById('fpArtist').textContent = t.artist;
  document.getElementById('fpTimeTotal').textContent = fmt(t.duration);
  updateFavIcon();
}

function updatePlayIcons() {
  document.querySelectorAll('.ico-play').forEach(el => el.style.display = isPlaying ? 'none' : 'block');
  document.querySelectorAll('.ico-pause').forEach(el => el.style.display = isPlaying ? 'block' : 'none');
}

// ── Render lists ────────────────────────────────────────────────────
function songItemHTML(t, idx) {
  const isActive = idx === currentIdx;
  const isFav = favorites.has(t.id);
  return `<div class="song-item${isActive?' active':''}${isActive&&isPlaying?' is-playing':''}" onclick="loadTrack(${idx});play()">
    <div class="song-art"><span class="song-art-ph">&#127925;</span><div class="eq-bars"><span></span><span></span><span></span></div></div>
    <div class="song-info"><div class="song-title">${esc(t.name)}</div><div class="song-artist">${esc(t.artist)}</div></div>
    <div class="song-meta">
      <div class="song-dur">${fmt(t.duration)}</div>
      <button class="song-fav${isFav?' liked':''}" onclick="event.stopPropagation();toggleFav(${idx})">
        ${isFav
          ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>'
          : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>'
        }
      </button>
    </div>
  </div>`;
}

function renderAll() {
  renderHome();
  renderLibrary();
  renderSearch();
}

function renderHome() {
  // Recents grid
  const recEl = document.getElementById('homeRecent');
  const recentTracks = recentIds.map(id => tracks.find(t => t.id === id)).filter(Boolean).slice(0, 6);
  if (recentTracks.length) {
    recEl.innerHTML = '<div class="recent-grid">' + recentTracks.map(t => {
      const idx = tracks.indexOf(t);
      return `<div class="recent-item" onclick="loadTrack(${idx});play()">
        <div class="recent-art">&#127925;</div>
        <div class="recent-name">${esc(t.name)}</div>
      </div>`;
    }).join('') + '</div>';
  } else {
    recEl.innerHTML = '<div style="color:var(--muted);font-size:13px;padding:8px 0">Aun no has escuchado canciones</div>';
  }

  // All songs
  const allEl = document.getElementById('homeAll');
  if (!tracks.length) {
    allEl.innerHTML = '<div class="lib-empty"><div class="lib-empty-icon">&#127925;</div><div class="lib-empty-text">Agrega musica para comenzar</div></div>';
  } else {
    allEl.innerHTML = tracks.map((t, i) => songItemHTML(t, i)).join('');
  }
}

function renderLibrary() {
  const el = document.getElementById('libContent');
  if (currentLibTab === 'all') {
    if (!tracks.length) { el.innerHTML = '<div class="lib-empty"><div class="lib-empty-icon">&#127925;</div><div class="lib-empty-text">Sin canciones.<br>Agrega musica con el boton +</div></div>'; return; }
    el.innerHTML = `<div style="font-size:12px;color:var(--muted);margin-bottom:12px">${tracks.length} canciones</div>` + tracks.map((t,i) => songItemHTML(t,i)).join('');
  } else if (currentLibTab === 'favorites') {
    const favTracks = tracks.filter(t => favorites.has(t.id));
    if (!favTracks.length) { el.innerHTML = '<div class="lib-empty"><div class="lib-empty-icon">&#10084;&#65039;</div><div class="lib-empty-text">Sin favoritos.<br>Toca el corazon en una cancion para agregarla.</div></div>'; return; }
    el.innerHTML = `<div style="font-size:12px;color:var(--muted);margin-bottom:12px">${favTracks.length} favoritos</div>` + favTracks.map(t => songItemHTML(t, tracks.indexOf(t))).join('');
  } else if (currentLibTab === 'playlists') {
    el.innerHTML = '<div class="lib-empty"><div class="lib-empty-icon">&#128221;</div><div class="lib-empty-text">Proximamente: crea tus propias playlists</div></div>';
  } else if (currentLibTab === 'recent') {
    const recentTracks = recentIds.map(id => tracks.find(t => t.id === id)).filter(Boolean);
    if (!recentTracks.length) { el.innerHTML = '<div class="lib-empty"><div class="lib-empty-icon">&#128347;</div><div class="lib-empty-text">Aun no has escuchado canciones</div></div>'; return; }
    el.innerHTML = recentTracks.map(t => songItemHTML(t, tracks.indexOf(t))).join('');
  }
}

function renderSearch() {
  const q = (document.getElementById('searchInput').value || '').toLowerCase().trim();
  const el = document.getElementById('searchResults');
  if (!q) {
    if (!tracks.length) { el.innerHTML = ''; return; }
    el.innerHTML = '<div style="color:var(--muted);font-size:13px;padding:16px 0">Escribe para buscar en tus canciones</div>';
    return;
  }
  const results = tracks.filter(t => t.name.toLowerCase().includes(q) || t.artist.toLowerCase().includes(q));
  if (!results.length) { el.innerHTML = '<div class="lib-empty"><div class="lib-empty-icon">&#128269;</div><div class="lib-empty-text">Sin resultados para "' + esc(q) + '"</div></div>'; return; }
  el.innerHTML = results.map(t => songItemHTML(t, tracks.indexOf(t))).join('');
}

// ── Navigation ──────────────────────────────────────────────────────
function showTab(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('scr' + id.charAt(0).toUpperCase() + id.slice(1)).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => {
    n.classList.toggle('active', n.dataset.screen === 'scr' + id.charAt(0).toUpperCase() + id.slice(1));
  });
  if (id === 'search') document.getElementById('searchInput').focus();
}
window.showTab = showTab;

document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => {
    const scrId = btn.dataset.screen;
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(scrId).classList.add('active');
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    btn.classList.add('active');
    if (scrId === 'scrSearch') document.getElementById('searchInput').focus();
    renderAll();
  });
});

// Library tabs
document.getElementById('libTabs').addEventListener('click', e => {
  const tab = e.target.closest('.lib-tab');
  if (!tab) return;
  currentLibTab = tab.dataset.tab;
  document.querySelectorAll('.lib-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === currentLibTab));
  renderLibrary();
});
function setLibTab(tab) {
  currentLibTab = tab;
  document.querySelectorAll('.lib-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  renderLibrary();
}
window.setLibTab = setLibTab;

// Search input
document.getElementById('searchInput').addEventListener('input', renderSearch);

// Full player
window.openFullPlayer = function() { document.getElementById('fullPlayer').classList.add('open'); if(isPlaying) document.getElementById('fullPlayer').classList.add('playing'); };
window.closeFullPlayer = function() { document.getElementById('fullPlayer').classList.remove('open'); };

// ── Progress & time ─────────────────────────────────────────────────
audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  document.getElementById('fpBarFill').style.width = pct + '%';
  document.getElementById('miniProgressFill').style.width = pct + '%';
  document.getElementById('fpTimeCur').textContent = fmt(audio.currentTime);
});

audio.addEventListener('loadedmetadata', () => {
  document.getElementById('fpTimeTotal').textContent = fmt(audio.duration);
  if (currentIdx >= 0) { tracks[currentIdx].duration = audio.duration; renderAll(); }
});

audio.addEventListener('ended', () => window.nextTrack());

// Seek
document.getElementById('fpBar').addEventListener('click', e => {
  if (!audio.duration) return;
  const rect = e.currentTarget.getBoundingClientRect();
  audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
});

let dragging = false;
document.getElementById('fpBar').addEventListener('touchstart', () => { dragging = true; }, { passive: true });
document.addEventListener('touchmove', e => {
  if (!dragging || !audio.duration) return;
  const bar = document.getElementById('fpBar');
  const rect = bar.getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (e.touches[0].clientX - rect.left) / rect.width));
  audio.currentTime = pct * audio.duration;
}, { passive: true });
document.addEventListener('touchend', () => { dragging = false; });

// ── File inputs ─────────────────────────────────────────────────────
document.getElementById('fileHome').addEventListener('change', e => addFiles(e.target.files));
document.getElementById('fileFab').addEventListener('change', e => addFiles(e.target.files));

// ── Keyboard ────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  if (e.code === 'ArrowRight') { e.preventDefault(); nextTrack(); }
  if (e.code === 'ArrowLeft') { e.preventDefault(); prevTrack(); }
});

// ── Media Session (background playback) ──────────────────────────────
function updateMediaSession() {
  if (!('mediaSession' in navigator)) return;
  const t = tracks[currentIdx];
  if (!t) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: t.name,
    artist: t.artist,
    album: 'Ridera Music',
  });
  navigator.mediaSession.setActionHandler('play', play);
  navigator.mediaSession.setActionHandler('pause', pause);
  navigator.mediaSession.setActionHandler('previoustrack', prevTrack);
  navigator.mediaSession.setActionHandler('nexttrack', nextTrack);
  navigator.mediaSession.setActionHandler('seekto', e => {
    if (e.fastSeek && 'fastSeek' in audio) audio.fastSeek(e.seekTime);
    else audio.currentTime = e.seekTime;
  });
}

// Wake Lock (keep playing with screen off)
if ('wakeLock' in navigator) {
  let wl = null;
  async function reqWL() { try { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => { wl = null; }); } catch {} }
  audio.addEventListener('play', reqWL);
  audio.addEventListener('pause', () => { if (wl) wl.release(); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && isPlaying) reqWL(); });
}

// ── Swipe down to close full player ─────────────────────────────────
let touchStartY = 0;
const fp = document.getElementById('fullPlayer');
fp.addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; }, { passive: true });
fp.addEventListener('touchend', e => {
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (dy > 80) closeFullPlayer();
});

// ── Init ────────────────────────────────────────────────────────────
loadState().then(() => renderAll());

})();
</script>
</body>
</html>
