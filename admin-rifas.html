<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Rifas — Ridera</title>
<meta name="robots" content="noindex">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0e0e0e; --s: #1a1a1a; --s2: #222; --line: #2a2a2a;
  --or: #E85D20; --or2: #cf4f18; --text: #f0f0f0; --mu: #888;
  --green: #4ade80; --gold: #f5c518; --warn: #f59e0b; --danger: #f87171;
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* LOGIN */
#loginWrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
.login-card { background: var(--s); border: 1px solid var(--line); border-radius: 12px; padding: 2.5rem 2rem; width: 100%; max-width: 360px; }
.login-card h1 { font-size: 1.4rem; font-weight: 700; color: var(--or); margin-bottom: 0.25rem; }
.login-card p { color: var(--mu); font-size: 0.875rem; margin-bottom: 1.75rem; }
.lbl { display: block; font-size: 0.8rem; color: var(--mu); margin-bottom: 0.35rem; margin-top: 1rem; }
input[type="password"], input[type="text"], input[type="number"], input[type="email"], input[type="tel"], input[type="url"],
input[type="date"], input[type="datetime-local"], textarea, select {
  width: 100%; background: #111; border: 1px solid var(--line); border-radius: 8px;
  color: var(--text); font-size: 1rem; padding: 0.7rem 0.9rem; outline: none; transition: border-color 0.2s;
  font-family: inherit;
}
input:focus, textarea:focus, select:focus { border-color: var(--or); }
textarea { resize: vertical; min-height: 70px; }
.btn { display: block; width: 100%; margin-top: 1rem; padding: 0.8rem; background: var(--or); color: #fff; font-size: 1rem; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; transition: background 0.2s, opacity 0.2s; }
.btn:hover { background: var(--or2); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-sm { padding: 0.4rem 0.85rem; font-size: 0.8rem; font-weight: 600; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--mu); cursor: pointer; transition: border-color 0.2s, color 0.2s; display: inline-flex; align-items: center; gap: 4px; }
.btn-sm:hover { border-color: var(--or); color: var(--or); }
.btn-sm.danger { color: var(--danger); border-color: var(--danger); }
.btn-sm.danger:hover { background: rgba(248,113,113,.1); }
.btn-sm.green { color: var(--green); border-color: var(--green); }
.btn-sm.green:hover { background: rgba(74,222,128,.1); }
.btn-sm.gold { color: var(--gold); border-color: var(--gold); }
.btn-sm.gold:hover { background: rgba(245,197,24,.1); }
.err { color: var(--danger); font-size: 0.85rem; margin-top: 0.75rem; display: none; }

/* PANEL */
#panel { display: none; }
nav { background: var(--s); border-bottom: 1px solid var(--line); padding: 0 1.5rem; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
.nav-brand { font-weight: 700; color: var(--or); font-size: 1.05rem; }
.nav-right { display: flex; align-items: center; gap: 0.75rem; }

.container { max-width: 1040px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
.page-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 0.25rem; }
.page-sub { color: var(--mu); font-size: 0.875rem; margin-bottom: 1.5rem; }

/* STATS */
.stats { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
.stat { background: var(--s); border: 1px solid var(--line); border-radius: 10px; padding: 1rem 1.25rem; min-width: 110px; flex: 1; }
.stat .num { font-size: 1.75rem; font-weight: 700; color: var(--or); }
.stat .num.green { color: var(--green); }
.stat .num.gold { color: var(--gold); }
.stat .num.warn { color: var(--warn); }
.stat .lbl { font-size: 0.75rem; color: var(--mu); margin-top: 0.2rem; }

/* CARDS */
.rifa-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
.rifa-card { background: var(--s); border: 1px solid var(--line); border-radius: 12px; padding: 1.25rem; }
.rifa-card h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.25rem; }
.rifa-card .premio { color: var(--gold); font-weight: 600; font-size: 0.9rem; margin-bottom: 0.5rem; }
.rifa-card .card-meta { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
.card-tag { font-size: 0.75rem; padding: 0.2rem 0.55rem; border-radius: 4px; background: var(--s2); border: 1px solid var(--line); }
.card-tag b { color: var(--or); }
.card-tag.green b { color: var(--green); }
.card-tag.gold b { color: var(--gold); }
.estado-badge { display: inline-block; font-size: 0.7rem; font-weight: 700; padding: 0.2rem 0.5rem; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; }
.eb-activa { background: rgba(74,222,128,.12); color: var(--green); }
.eb-borrador { background: rgba(136,136,136,.12); color: var(--mu); }
.eb-cerrada { background: rgba(245,158,11,.12); color: var(--warn); }
.eb-sorteada { background: rgba(96,165,250,.12); color: #60a5fa; }
.card-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.75rem; border-top: 1px solid var(--line); padding-top: 0.75rem; }

/* MODAL */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 100; display: none; align-items: center; justify-content: center; padding: 1rem; }
.modal-bg.on { display: flex; }
.modal { background: var(--s); border: 1px solid var(--line); border-radius: 14px; padding: 1.75rem; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; }
.modal h2 { font-size: 1.2rem; font-weight: 700; color: var(--or); margin-bottom: 0.25rem; }
.modal .sub { color: var(--mu); font-size: 0.85rem; margin-bottom: 1.25rem; }
.modal-close { position: absolute; top: 1rem; right: 1rem; background: none; border: none; color: var(--mu); font-size: 1.5rem; cursor: pointer; }
.field { margin-bottom: 0.85rem; }
.field-row { display: flex; gap: 0.75rem; }
.field-row .field { flex: 1; }

/* TABLA BOLETOS */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--s); }
table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
th { text-align: left; padding: 0.65rem 0.85rem; color: var(--mu); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--line); background: var(--s2); }
td { padding: 0.6rem 0.85rem; border-bottom: 1px solid var(--line); }
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(232,93,32,.04); }
.status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.sd-disponible { background: var(--mu); }
.sd-apartado { background: var(--warn); }
.sd-pagado { background: var(--green); }

.spin { width: 18px; height: 18px; border: 2.5px solid rgba(255,255,255,.2); border-top-color: #fff; border-radius: 50%; animation: rot .7s linear infinite; display: inline-block; vertical-align: middle; }
@keyframes rot { to { transform: rotate(360deg); } }
.empty { color: var(--mu); font-size: 0.9rem; padding: 2rem; text-align: center; }

/* FILTROS */
.filters { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }
.filter-btn { padding: 0.35rem 0.75rem; font-size: 0.8rem; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--mu); cursor: pointer; transition: all 0.15s; }
.filter-btn.active { border-color: var(--or); color: var(--or); background: rgba(232,93,32,.08); }
.filter-btn:hover { border-color: var(--or); color: var(--or); }

.search-input { max-width: 220px; padding: 0.4rem 0.75rem; font-size: 0.85rem; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginWrap">
  <div class="login-card">
    <h1>🎟️ Admin Rifas</h1>
    <p>Panel de administración de rifas Ridera</p>
    <label class="lbl">Contraseña</label>
    <input type="password" id="loginPass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
    <div class="err" id="loginErr"></div>
    <button class="btn" onclick="doLogin()">Entrar</button>
  </div>
</div>

<!-- PANEL -->
<div id="panel">
  <nav>
    <span class="nav-brand">🎟️ Admin Rifas</span>
    <div class="nav-right">
      <a href="/rifas.html" class="btn-sm" target="_blank">Ver público</a>
      <button class="btn-sm danger" onclick="logout()">Salir</button>
    </div>
  </nav>

  <div class="container">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:0.5rem;margin-bottom:0.25rem">
      <h1 class="page-title">Rifas</h1>
      <button class="btn-sm green" onclick="openModal('crear')" style="font-size:0.9rem;padding:0.5rem 1rem">+ Nueva rifa</button>
    </div>
    <p class="page-sub">Gestiona tus rifas, boletos y sorteos.</p>

    <div class="stats" id="globalStats"></div>
    <div id="rifaCards"><div class="empty"><span class="spin"></span> Cargando…</div></div>

    <!-- Detalle boletos de una rifa -->
    <div id="boletosSection" style="display:none">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:0.5rem;margin-bottom:0.5rem">
        <div>
          <button class="btn-sm" onclick="closeBoletosSection()" style="margin-bottom:0.5rem">← Volver</button>
          <h2 id="boletosTitle" style="font-size:1.1rem;font-weight:700"></h2>
        </div>
        <button class="btn-sm" onclick="exportCSV()">↓ Exportar CSV</button>
      </div>
      <div class="stats" id="boletosStats"></div>
      <div class="filters" id="boletosFilters"></div>
      <div id="boletosTable"></div>
    </div>
  </div>
</div>

<!-- MODAL CREAR/EDITAR -->
<div class="modal-bg" id="modalRifa">
  <div class="modal">
    <h2 id="modalTitle">Nueva rifa</h2>
    <p class="sub" id="modalSub">Configura los datos de la rifa.</p>
    <input type="hidden" id="mRifaId">
    <div class="field">
      <label class="lbl">Nombre de la rifa *</label>
      <input type="text" id="mNombre" placeholder="Ej: Rifa Navideña 2024">
    </div>
    <div class="field">
      <label class="lbl">Premio *</label>
      <input type="text" id="mPremio" placeholder="Ej: Moto Honda CB190R 0km">
    </div>
    <div class="field">
      <label class="lbl">Descripción</label>
      <textarea id="mDesc" placeholder="Descripción de la rifa, reglas, etc."></textarea>
    </div>
    <div class="field-row">
      <div class="field">
        <label class="lbl">Precio del boleto *</label>
        <input type="number" id="mPrecio" placeholder="10000" min="0" step="100">
      </div>
      <div class="field">
        <label class="lbl">Total de boletos *</label>
        <input type="number" id="mTotal" placeholder="100" min="1" max="999999">
      </div>
    </div>
    <div class="field">
      <label class="lbl">Fecha del sorteo</label>
      <input type="datetime-local" id="mFecha">
    </div>
    <div class="field">
      <label class="lbl">URL de imagen (opcional)</label>
      <input type="url" id="mImagen" placeholder="https://...">
    </div>
    <div class="field">
      <label class="lbl">Estado</label>
      <select id="mEstado">
        <option value="borrador">Borrador</option>
        <option value="activa">Activa</option>
        <option value="cerrada">Cerrada</option>
      </select>
    </div>
    <div class="err" id="mErr"></div>
    <button class="btn" id="mBtn" onclick="saveRifa()">Guardar</button>
    <button class="btn" style="background:transparent;border:1px solid var(--line);color:var(--mu);margin-top:0.5rem" onclick="closeModal()">Cancelar</button>
  </div>
</div>

<!-- MODAL SORTEO -->
<div class="modal-bg" id="modalSorteo">
  <div class="modal" style="text-align:center">
    <h2>🎰 Realizar sorteo</h2>
    <p class="sub" id="sorteoInfo"></p>
    <div id="sorteoResult" style="margin:1.5rem 0"></div>
    <button class="btn" id="sorteoBtn" onclick="ejecutarSorteo()" style="background:var(--gold);color:#000">🎲 Sortear ahora</button>
    <button class="btn" style="background:transparent;border:1px solid var(--line);color:var(--mu);margin-top:0.5rem" onclick="closeSorteo()">Cerrar</button>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://vzzxsdtsaahhzyctvmhx.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ6enhzZHRzYWFoaHp5Y3R2bWh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzNzU3NzIsImV4cCI6MjA5Njk1MTc3Mn0.5GZRCUuMx7fwmvoo48nXVCq9QJs0ysCzz0TPr9mmcNI';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const ADMIN_PASS = 'ridera2024';
let allRifas = [];
let currentBoletos = [];
let currentRifaId = null;
let boletosFilter = 'todos';

function esc(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
function fmtMoney(n){ return '$'+Number(n).toLocaleString('es-CO'); }
function fmtDate(d){ if(!d) return '—'; return new Date(d).toLocaleDateString('es-CO',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
function padLen(total){ return String(total-1).length; }
function padNum(n,total){ return String(n).padStart(padLen(total),'0'); }

// AUTH
function doLogin(){
  const pass = document.getElementById('loginPass').value;
  if(pass !== ADMIN_PASS){
    const e = document.getElementById('loginErr');
    e.textContent = 'Contraseña incorrecta';
    e.style.display = 'block';
    return;
  }
  sessionStorage.setItem('rifas_auth','1');
  showPanel();
}
function logout(){ sessionStorage.removeItem('rifas_auth'); location.reload(); }
function showPanel(){
  document.getElementById('loginWrap').style.display='none';
  document.getElementById('panel').style.display='block';
  loadRifas();
}
if(sessionStorage.getItem('rifas_auth')==='1') showPanel();

// LOAD RIFAS
async function loadRifas(){
  const { data, error } = await sb.from('rifas').select('*').order('created_at',{ascending:false});
  if(error){ document.getElementById('rifaCards').innerHTML='<div class="empty">Error al cargar rifas</div>'; return; }
  allRifas = data || [];

  for(let r of allRifas){
    const { data: bols } = await sb.from('boletos').select('estado').eq('rifa_id', r.id);
    r._boletos = bols || [];
    r._pagados = r._boletos.filter(b=>b.estado==='pagado').length;
    r._apartados = r._boletos.filter(b=>b.estado==='apartado').length;
    r._disponibles = r.total_boletos - r._pagados - r._apartados;
  }

  renderStats();
  renderCards();
}

function renderStats(){
  const total = allRifas.length;
  const activas = allRifas.filter(r=>r.estado==='activa').length;
  const totalBolPagados = allRifas.reduce((s,r)=>s+r._pagados,0);
  const totalIngresos = allRifas.reduce((s,r)=>s + r._pagados * r.precio_boleto, 0);
  document.getElementById('globalStats').innerHTML = `
    <div class="stat"><div class="num">${total}</div><div class="lbl">Rifas totales</div></div>
    <div class="stat"><div class="num green">${activas}</div><div class="lbl">Activas</div></div>
    <div class="stat"><div class="num gold">${totalBolPagados}</div><div class="lbl">Boletos vendidos</div></div>
    <div class="stat"><div class="num">${fmtMoney(totalIngresos)}</div><div class="lbl">Ingresos</div></div>
  `;
}

function renderCards(){
  const el = document.getElementById('rifaCards');
  if(!allRifas.length){ el.innerHTML='<div class="empty">No hay rifas. Crea la primera.</div>'; return; }
  el.innerHTML = '<div class="rifa-cards">' + allRifas.map(r => {
    const ebCls = 'eb-'+r.estado;
    const ebTxt = {borrador:'Borrador',activa:'Activa',cerrada:'Cerrada',sorteada:'Sorteada'}[r.estado]||r.estado;
    const pct = r.total_boletos ? Math.round(r._pagados/r.total_boletos*100) : 0;
    return `
    <div class="rifa-card">
      <span class="estado-badge ${ebCls}">${ebTxt}</span>
      <h3>${esc(r.nombre)}</h3>
      <div class="premio">🏆 ${esc(r.premio)}</div>
      <div class="card-meta">
        <span class="card-tag">Boleto: <b>${fmtMoney(r.precio_boleto)}</b></span>
        <span class="card-tag green">Vendidos: <b>${r._pagados}/${r.total_boletos}</b> (${pct}%)</span>
        <span class="card-tag" style="color:var(--warn)">Apartados: <b>${r._apartados}</b></span>
      </div>
      ${r.fecha_sorteo ? `<div style="font-size:0.8rem;color:var(--mu)">Sorteo: ${fmtDate(r.fecha_sorteo)}</div>` : ''}
      ${r.numero_ganador!=null ? `<div style="margin-top:0.5rem;color:var(--gold);font-weight:700">🏆 Ganador: #${padNum(r.numero_ganador,r.total_boletos)}</div>` : ''}
      <div class="card-actions">
        <button class="btn-sm" onclick="verBoletos('${r.id}')">Ver boletos</button>
        <button class="btn-sm" onclick="openModal('editar','${r.id}')">Editar</button>
        ${r.estado!=='sorteada' ? `<button class="btn-sm gold" onclick="openSorteo('${r.id}')">🎲 Sortear</button>` : ''}
        <button class="btn-sm danger" onclick="deleteRifa('${r.id}')">Eliminar</button>
      </div>
    </div>`;
  }).join('') + '</div>';
}

// MODAL CREAR/EDITAR
function openModal(mode, id){
  const m = document.getElementById('modalRifa');
  m.classList.add('on');
  document.getElementById('mErr').style.display='none';

  if(mode==='crear'){
    document.getElementById('modalTitle').textContent='Nueva rifa';
    document.getElementById('mRifaId').value='';
    document.getElementById('mNombre').value='';
    document.getElementById('mPremio').value='';
    document.getElementById('mDesc').value='';
    document.getElementById('mPrecio').value='';
    document.getElementById('mTotal').value='100';
    document.getElementById('mFecha').value='';
    document.getElementById('mImagen').value='';
    document.getElementById('mEstado').value='borrador';
  } else {
    const r = allRifas.find(x=>x.id===id);
    if(!r) return;
    document.getElementById('modalTitle').textContent='Editar rifa';
    document.getElementById('mRifaId').value=r.id;
    document.getElementById('mNombre').value=r.nombre||'';
    document.getElementById('mPremio').value=r.premio||'';
    document.getElementById('mDesc').value=r.descripcion||'';
    document.getElementById('mPrecio').value=r.precio_boleto||'';
    document.getElementById('mTotal').value=r.total_boletos||100;
    document.getElementById('mFecha').value=r.fecha_sorteo ? r.fecha_sorteo.slice(0,16) : '';
    document.getElementById('mImagen').value=r.imagen_url||'';
    document.getElementById('mEstado').value=r.estado||'borrador';
  }
}
function closeModal(){ document.getElementById('modalRifa').classList.remove('on'); }

async function saveRifa(){
  const id = document.getElementById('mRifaId').value;
  const nombre = document.getElementById('mNombre').value.trim();
  const premio = document.getElementById('mPremio').value.trim();
  const descripcion = document.getElementById('mDesc').value.trim();
  const precio_boleto = parseFloat(document.getElementById('mPrecio').value);
  const total_boletos = parseInt(document.getElementById('mTotal').value);
  const fecha_str = document.getElementById('mFecha').value;
  const imagen_url = document.getElementById('mImagen').value.trim() || null;
  const estado = document.getElementById('mEstado').value;
  const errEl = document.getElementById('mErr');
  errEl.style.display='none';

  if(!nombre||!premio){ errEl.textContent='Nombre y premio son obligatorios'; errEl.style.display='block'; return; }
  if(!precio_boleto||precio_boleto<=0){ errEl.textContent='Precio debe ser mayor a 0'; errEl.style.display='block'; return; }
  if(!total_boletos||total_boletos<1){ errEl.textContent='Debe tener al menos 1 boleto'; errEl.style.display='block'; return; }

  const btn = document.getElementById('mBtn');
  btn.disabled=true; btn.textContent='Guardando…';

  const row = { nombre, premio, descripcion: descripcion||null, precio_boleto, total_boletos, imagen_url, estado, updated_at: new Date().toISOString() };
  if(fecha_str) row.fecha_sorteo = new Date(fecha_str).toISOString();
  else row.fecha_sorteo = null;

  let error;
  if(id){
    ({ error } = await sb.from('rifas').update(row).eq('id',id));
  } else {
    ({ error } = await sb.from('rifas').insert(row));
  }

  btn.disabled=false; btn.textContent='Guardar';
  if(error){ errEl.textContent='Error: '+error.message; errEl.style.display='block'; return; }
  closeModal();
  loadRifas();
}

async function deleteRifa(id){
  if(!confirm('¿Eliminar esta rifa y todos sus boletos?')) return;
  await sb.from('rifas').delete().eq('id',id);
  loadRifas();
}

// BOLETOS
async function verBoletos(rifaId){
  currentRifaId = rifaId;
  boletosFilter = 'todos';
  const rifa = allRifas.find(r=>r.id===rifaId);
  if(!rifa) return;

  document.getElementById('rifaCards').style.display='none';
  document.getElementById('globalStats').style.display='none';
  document.getElementById('boletosSection').style.display='block';
  document.getElementById('boletosTitle').textContent='Boletos — '+rifa.nombre;

  await loadBoletos();
}

async function loadBoletos(){
  const rifa = allRifas.find(r=>r.id===currentRifaId);
  if(!rifa) return;

  const { data } = await sb.from('boletos').select('*').eq('rifa_id',currentRifaId).order('numero',{ascending:true});
  currentBoletos = data || [];

  const pagados = currentBoletos.filter(b=>b.estado==='pagado').length;
  const apartados = currentBoletos.filter(b=>b.estado==='apartado').length;
  const disponibles = rifa.total_boletos - pagados - apartados;
  const ingresos = pagados * rifa.precio_boleto;

  document.getElementById('boletosStats').innerHTML = `
    <div class="stat"><div class="num green">${disponibles}</div><div class="lbl">Disponibles</div></div>
    <div class="stat"><div class="num warn">${apartados}</div><div class="lbl">Apartados</div></div>
    <div class="stat"><div class="num gold">${pagados}</div><div class="lbl">Pagados</div></div>
    <div class="stat"><div class="num">${fmtMoney(ingresos)}</div><div class="lbl">Recaudado</div></div>
  `;

  document.getElementById('boletosFilters').innerHTML = `
    <button class="filter-btn ${boletosFilter==='todos'?'active':''}" onclick="setFilter('todos')">Todos</button>
    <button class="filter-btn ${boletosFilter==='apartado'?'active':''}" onclick="setFilter('apartado')">Apartados (${apartados})</button>
    <button class="filter-btn ${boletosFilter==='pagado'?'active':''}" onclick="setFilter('pagado')">Pagados (${pagados})</button>
    <input class="search-input" type="text" placeholder="Buscar nombre/tel…" oninput="searchBoletos(this.value)">
  `;

  renderBoletos(currentBoletos);
}

let searchTerm = '';
function setFilter(f){ boletosFilter=f; searchTerm=''; renderBoletos(currentBoletos); }
function searchBoletos(v){ searchTerm=v.toLowerCase(); renderBoletos(currentBoletos); }

function renderBoletos(bols){
  let filtered = bols;
  if(boletosFilter!=='todos') filtered = filtered.filter(b=>b.estado===boletosFilter);
  if(searchTerm) filtered = filtered.filter(b=>(b.comprador_nombre||'').toLowerCase().includes(searchTerm)||(b.comprador_telefono||'').includes(searchTerm));

  if(!filtered.length){
    document.getElementById('boletosTable').innerHTML='<div class="empty">Sin boletos para mostrar.</div>';
    return;
  }
  const rifa = allRifas.find(r=>r.id===currentRifaId);

  document.getElementById('boletosTable').innerHTML = `
  <div class="table-wrap"><table>
    <thead><tr><th>#</th><th>Estado</th><th>Nombre</th><th>Teléfono</th><th>Email</th><th>Fecha</th><th>Acciones</th></tr></thead>
    <tbody>
      ${filtered.map(b => `<tr>
        <td><b>${padNum(b.numero,rifa.total_boletos)}</b></td>
        <td><span class="status-dot sd-${b.estado}"></span>${b.estado==='apartado'?'Apartado':b.estado==='pagado'?'Pagado':'Disponible'}</td>
        <td>${esc(b.comprador_nombre)}</td>
        <td>${esc(b.comprador_telefono)}</td>
        <td>${esc(b.comprador_email)}</td>
        <td style="font-size:0.8rem">${fmtDate(b.apartado_at||b.created_at)}</td>
        <td>
          ${b.estado==='apartado'?`<button class="btn-sm green" onclick="confirmarPago('${b.id}')">✓ Confirmar pago</button>`:''}
          ${b.estado!=='disponible'?`<button class="btn-sm danger" onclick="liberarBoleto('${b.id}')">Liberar</button>`:''}
        </td>
      </tr>`).join('')}
    </tbody>
  </table></div>`;
}

async function confirmarPago(id){
  await sb.from('boletos').update({ estado:'pagado', pagado_at:new Date().toISOString() }).eq('id',id);
  loadBoletos();
}

async function liberarBoleto(id){
  if(!confirm('¿Liberar este boleto?')) return;
  await sb.from('boletos').delete().eq('id',id);
  loadBoletos();
}

function closeBoletosSection(){
  document.getElementById('boletosSection').style.display='none';
  document.getElementById('rifaCards').style.display='';
  document.getElementById('globalStats').style.display='';
  currentRifaId = null;
}

// SORTEO
let sorteoRifaId = null;
function openSorteo(id){
  sorteoRifaId = id;
  const rifa = allRifas.find(r=>r.id===id);
  if(!rifa) return;
  document.getElementById('sorteoInfo').textContent = `Rifa: ${rifa.nombre} — ${rifa._pagados} boletos pagados`;
  document.getElementById('sorteoResult').innerHTML = '';
  document.getElementById('sorteoBtn').disabled = false;
  document.getElementById('sorteoBtn').textContent = '🎲 Sortear ahora';
  document.getElementById('modalSorteo').classList.add('on');
}
function closeSorteo(){ document.getElementById('modalSorteo').classList.remove('on'); sorteoRifaId=null; }

async function ejecutarSorteo(){
  const rifa = allRifas.find(r=>r.id===sorteoRifaId);
  if(!rifa) return;

  const pagados = rifa._boletos ? currentBoletos.filter(b=>b.estado==='pagado') : [];
  const { data: bols } = await sb.from('boletos').select('numero').eq('rifa_id',sorteoRifaId).eq('estado','pagado');
  const boletosP = bols || pagados;

  if(!boletosP.length){
    document.getElementById('sorteoResult').innerHTML='<p style="color:var(--danger)">No hay boletos pagados para sortear.</p>';
    return;
  }

  const btn = document.getElementById('sorteoBtn');
  btn.disabled=true; btn.textContent='Sorteando…';

  const resEl = document.getElementById('sorteoResult');
  let count = 0;
  const total = 20;
  const anim = setInterval(()=>{
    const rand = boletosP[Math.floor(Math.random()*boletosP.length)].numero;
    resEl.innerHTML = `<div style="font-size:4rem;font-weight:700;color:var(--gold)">${padNum(rand,rifa.total_boletos)}</div>`;
    count++;
    if(count>=total){
      clearInterval(anim);
      const ganador = boletosP[Math.floor(Math.random()*boletosP.length)].numero;
      resEl.innerHTML = `
        <div style="font-size:5rem;font-weight:700;color:var(--gold);text-shadow:0 0 30px rgba(245,197,24,.4)">🏆 ${padNum(ganador,rifa.total_boletos)}</div>
        <p style="color:var(--green);font-weight:700;margin-top:0.5rem">¡Número ganador!</p>
      `;
      sb.from('rifas').update({ numero_ganador:ganador, estado:'sorteada', updated_at:new Date().toISOString() }).eq('id',sorteoRifaId).then(()=>{
        btn.textContent='✓ Sorteado';
        loadRifas();
      });
    }
  }, 100);
}

// EXPORT CSV
function exportCSV(){
  const rifa = allRifas.find(r=>r.id===currentRifaId);
  if(!rifa||!currentBoletos.length) return;
  const headers = ['Número','Estado','Nombre','Teléfono','Email','Apartado','Pagado'];
  const csv = [headers, ...currentBoletos.map(b=>[
    padNum(b.numero,rifa.total_boletos), b.estado, b.comprador_nombre||'', b.comprador_telefono||'',
    b.comprador_email||'', b.apartado_at?new Date(b.apartado_at).toLocaleString('es-CO'):'',
    b.pagado_at?new Date(b.pagado_at).toLocaleString('es-CO'):''
  ])].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`boletos-${rifa.nombre.replace(/\s+/g,'-')}-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}
</script>
