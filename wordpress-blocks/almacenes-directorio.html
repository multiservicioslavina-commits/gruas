<!-- RIDERA — Widget Almacenes CON RESEÑAS
     Cambios sobre la versión anterior:
     - Estrella de calificación promedio en cada tarjeta (si tiene reseñas)
     - Sección de reseñas dentro del modal: promedio, lista y formulario para dejar una nueva
     - Las reseñas nuevas quedan pendientes de aprobación (se aprueban desde /mi-almacen)
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

<style>
#ra-wrap *{box-sizing:border-box;margin:0;padding:0}
#ra-wrap{background:#0e0e0e;border-radius:12px;overflow:hidden;font-family:sans-serif}
.ra-filters{padding:1.25rem 2rem;border-bottom:1px solid #181818;display:flex;gap:8px;flex-wrap:wrap}
.ra-pill{background:#151515;border:1px solid #252525;border-radius:20px;padding:8px 16px;font-size:13px;color:#e6e3de;cursor:pointer;display:flex;align-items:center;gap:5px;transition:all .2s;user-select:none}
.ra-pill.on{background:#E85D20;border-color:#E85D20;color:#fff}
.ra-search{padding:1rem 2rem;display:flex;gap:8px;border-bottom:1px solid #181818}
.ra-search input{flex:1;background:#171717;border:1px solid #2a2a2a;border-radius:8px;padding:12px 16px;font-size:15px;color:#e6e3de;outline:none}
.ra-search input:focus{border-color:#E85D20}
.ra-search input::placeholder{color:#666}
.ra-header{padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between}
.ra-header span{font-size:14px;color:#e6e3de}
.ra-sort{background:#151515;border:1px solid #252525;border-radius:6px;padding:7px 12px;font-size:13px;color:#e6e3de;outline:none;cursor:pointer}
.ra-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;padding:0 2rem 2rem}
.ra-card{background:#141414;border:1px solid #1e1e1e;border-radius:14px;overflow:hidden;cursor:pointer;transition:border-color .2s,transform .15s;display:flex;flex-direction:column}
.ra-card:hover{border-color:#E85D20;transform:translateY(-2px)}
.ra-card-top{height:130px;background:#191919;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.ra-card-top img{width:100%;height:100%;object-fit:cover;opacity:.7}
.ra-icon{width:58px;height:58px;background:#1f1f1f;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #2a2a2a;position:relative;z-index:1}
.ra-icon i{font-size:26px;color:#E85D20}
.ra-icon img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.ra-badge-ok{position:absolute;top:10px;left:10px;background:#0d2318;color:#4ade80;font-size:11px;padding:4px 9px;border-radius:4px;display:flex;align-items:center;gap:3px;z-index:2}
.ra-dom{position:absolute;top:10px;right:10px;background:#1a2a1a;color:#4ade80;font-size:11px;padding:4px 9px;border-radius:4px;z-index:2}
.ra-body{padding:16px 18px;flex:1}
.ra-name{font-size:16px;font-weight:600;color:#fff;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ra-rating{display:flex;align-items:center;gap:5px;font-size:12px;color:#facc15;margin-bottom:8px}
.ra-rating .ra-rating-count{color:#888}
.ra-zona{font-size:13px;color:#e6e3de;display:flex;align-items:center;gap:5px;margin-bottom:12px}
.ra-zona i{font-size:14px;color:#E85D20}
.ra-specs{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.ra-spec{display:flex;align-items:center;gap:7px;font-size:13px;color:#e6e3de}
.ra-spec i{font-size:15px;color:#888;flex-shrink:0}
.ra-tags{display:flex;flex-wrap:wrap;gap:5px}
.ra-tag{background:#1a1a1a;color:#e6e3de;font-size:12px;padding:3px 9px;border-radius:4px;border:1px solid #252525}
.ra-foot{padding:12px 18px;border-top:1px solid #1e1e1e;display:flex;align-items:center;justify-content:space-between}
.ra-btn{background:transparent;border:1px solid #2a2a2a;border-radius:6px;padding:6px 14px;font-size:13px;color:#e6e3de;cursor:pointer;transition:all .2s}
.ra-btn:hover{border-color:#E85D20;color:#E85D20}
.ra-cta{background:#111;border:2px dashed #E85D20;border-radius:14px;min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;padding:1.5rem;transition:background .2s}
.ra-cta:hover{background:#1a1a1a}
.ra-cta i{font-size:34px;color:#E85D20}
.ra-cta-title{font-size:15px;font-weight:600;color:#E85D20}
.ra-cta-sub{font-size:13px;color:#e6e3de;text-align:center;line-height:1.5}
.ra-empty{grid-column:1/-1;text-align:center;padding:3rem;color:#e6e3de;font-size:15px}
.ra-spinner{width:32px;height:32px;border:3px solid #222;border-top-color:#E85D20;border-radius:50%;animation:raspin .7s linear infinite;margin:0 auto 12px}
@keyframes raspin{to{transform:rotate(360deg)}}
.ra-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:99999;align-items:center;justify-content:center}
.ra-overlay.open{display:flex}
.ra-modal{background:#141414;border:1px solid #2a2a2a;border-radius:16px;padding:2rem;max-width:480px;width:90%;position:relative;max-height:90vh;overflow-y:auto}
.ra-modal-x{position:absolute;top:14px;right:16px;background:none;border:none;color:#888;font-size:20px;cursor:pointer}
.ra-modal-logo{width:72px;height:72px;border-radius:50%;object-fit:cover;border:2px solid #2a2a2a;margin-bottom:14px}
.ra-modal h3{color:#fff;font-size:20px;margin-bottom:4px}
.ra-modal-zona{color:#E85D20;font-size:14px;margin-bottom:1.2rem}
.ra-modal-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px;font-size:14px;color:#e6e3de}
.ra-modal-row i{color:#E85D20;font-size:17px;flex-shrink:0;margin-top:1px}
.ra-modal-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:1.2rem}
.ra-modal-fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:1rem}
.ra-modal-fotos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}

.ram-resenas{margin-top:1.5rem;padding-top:1.2rem;border-top:1px solid #222}
.ram-resenas-titulo{font-size:14px;font-weight:700;color:#fff;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.ram-resenas-avg{font-size:13px;color:#facc15;font-weight:400}
.ram-resena-item{background:#191919;border-radius:8px;padding:10px 12px;margin-bottom:8px}
.ram-resena-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.ram-resena-autor{font-size:13px;font-weight:600;color:#fff}
.ram-resena-stars{font-size:12px;color:#facc15}
.ram-resena-texto{font-size:12.5px;color:#bbb;line-height:1.5}
.ram-resenas-empty{font-size:13px;color:#888;margin-bottom:10px}
.ram-resena-form{margin-top:12px}
.ram-star-picker{display:flex;gap:5px;margin-bottom:8px;font-size:22px;cursor:pointer}
.ram-star-picker span{color:#333;transition:color .15s}
.ram-star-picker span.filled{color:#facc15}
.ram-resena-form input,.ram-resena-form textarea{width:100%;background:#171717;border:1px solid #2a2a2a;border-radius:8px;color:#e6e3de;font-family:inherit;font-size:13px;padding:9px 11px;margin-bottom:8px;outline:none}
.ram-resena-form textarea{resize:vertical;min-height:60px}
.ram-resena-form input:focus,.ram-resena-form textarea:focus{border-color:#E85D20}
.ram-resena-btn{background:#E85D20;color:#fff;border:none;padding:9px 16px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer}
.ram-resena-btn:hover{background:#c94e18}
.ram-resena-status{font-size:12.5px;margin-top:8px;display:none}
.ram-resena-status.visible{display:block}
.ram-resena-status.ok{color:#4ade80}
.ram-resena-status.err{color:#f87171}

@media(max-width:600px){
  .ra-filters{padding:1rem 1.1rem;gap:7px}
  .ra-search{padding:1rem 1.1rem}
  .ra-header{padding:1rem 1.1rem}
  .ra-grid{grid-template-columns:1fr;gap:16px;padding:0 1.1rem 1.5rem}
  .ra-card-top{height:150px}
  .ra-icon{width:64px;height:64px}
}
</style>

<div id="ra-wrap">
  <div class="ra-search">
    <input id="ra-input" type="text" placeholder="Buscar por nombre, marca o ciudad...">
  </div>
  <div class="ra-filters" id="ra-filters">
    <div class="ra-pill on" data-f="todos"><i class="ti ti-adjustments-horizontal"></i> Todos</div>
    <div class="ra-pill" data-f="repuestos oem"><i class="ti ti-tools"></i> Repuestos OEM</div>
    <div class="ra-pill" data-f="accesorios"><i class="ti ti-backpack"></i> Accesorios</div>
    <div class="ra-pill" data-f="llantas"><i class="ti ti-circle"></i> Llantas</div>
    <div class="ra-pill" data-f="lubricantes"><i class="ti ti-droplet"></i> Lubricantes</div>
    <div class="ra-pill" data-f="eléctrico"><i class="ti ti-bolt"></i> Eléctrico</div>

    <span id="ra-count">Cargando...</span>

      <option value="reciente">Más recientes</option>

<div class="ra-overlay" id="ra-overlay">
  <div class="ra-modal">
    <button class="ra-modal-x" id="ra-close"><i class="ti ti-x"></i></button>
    <div id="ram-logo-wrap"></div>
    <h3 id="ram-nombre"></h3>
    <div class="ra-modal-zona" id="ram-zona"></div>
    <div class="ra-modal-row"><i class="ti ti-map-pin"></i><span id="ram-direccion"></span></div>
    <div class="ra-modal-row"><i class="ti ti-phone"></i><span id="ram-tel"></span></div>
    <div class="ra-modal-row" id="ram-email-row"><i class="ti ti-mail"></i><span id="ram-email"></span></div>
    <div class="ra-modal-row" id="ram-web-row"><i class="ti ti-world"></i><span id="ram-web"></span></div>
    <div class="ra-modal-row"><i class="ti ti-truck-delivery"></i><span id="ram-domicilio"></span></div>

        <span class="ram-resenas-avg" id="ram-resenas-avg"></span>

      <div class="ram-resena-form">

        </div>
        <input type="text" id="ram-resena-nombre" placeholder="Tu nombre" maxlength="60">
        <textarea id="ram-resena-comentario" placeholder="¿Cómo fue tu experiencia?" maxlength="500"></textarea>
        <button class="ram-resena-btn" id="ram-resena-enviar">Enviar reseña</button>
        <div class="ram-resena-status" id="ram-resena-status"></div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var SUPABASE_URL = 'https://vzzxsdtsaahhzyctvmhx.supabase.co';
  var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ6enhzZHRzYWFoaHp5Y3R2bWh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzNzU3NzIsImV4cCI6MjA5Njk1MTc3Mn0.5GZRCUuMx7fwmvoo48nXVCq9QJs0ysCzz0TPr9mmcNI';

  function sbHeaders(extra) {
    return Object.assign({
      'apikey':        SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY
    }, extra || {});
  }

  function flattenRow(row) {
    // Mezcla campos de nivel superior con el JSONB datos{}
    var datos = row.datos || {};
    return Object.assign({}, datos, row);
  }

  function starsHtml(avg) {
    var full = Math.round(avg);
    return '★'.repeat(full) + '☆'.repeat(5 - full);
  }

  function card(t) {
    var marcas   = (t.marcas||'').split(',').map(function(s){return s.trim();}).filter(Boolean);
    var cats     = (t.categorias||'').split(',').map(function(s){return s.trim();}).filter(Boolean);
    var zona     = [t.barrio, t.ciudad].filter(Boolean).join(', ');
    var domicilio= (t.domicilio||'').toLowerCase().includes('sí') || (t.domicilio||'').toLowerCase().includes('si');
    var bgImg    = t.foto1_url ? '<img src="'+t.foto1_url+'" alt="" loading="lazy">' : '';
    var iconHtml = t.logo_url
      ? '<img src="'+t.logo_url+'" alt="logo">'
      : '<i class="ti ti-tools"></i>';
    var ratingHtml = t.reviewCount
      ? '<div class="ra-rating">'+starsHtml(t.avgRating)+' <span class="ra-rating-count">'+t.avgRating.toFixed(1)+' ('+t.reviewCount+')</span></div>'
      : '';
    return '<div class="ra-card"'+
      ' data-id="'+t.id+'"'+
      ' data-nombre="'+esc(t.nombre)+'"'+
      ' data-zona="'+esc(zona)+'"'+
      ' data-tel="'+esc(t.telefono)+'"'+
      ' data-email="'+esc(t.email)+'"'+
      ' data-web="'+esc(t.web_instagram)+'"'+
      ' data-domicilio="'+esc(t.domicilio)+'"'+
      ' data-direccion="'+esc(t.direccion)+'"'+
      ' data-marcas="'+esc(t.marcas)+'"'+
      ' data-categorias="'+esc(t.categorias)+'"'+
      ' data-logo="'+esc(t.logo_url)+'"'+
      ' data-foto1="'+esc(t.foto1_url)+'"'+
      ' data-foto2="'+esc(t.foto2_url)+'"'+
      ' data-foto3="'+esc(t.foto3_url)+'"'+
      ' data-nit="'+esc(t.nit)+'"'+
      ' data-avg="'+(t.avgRating||0)+'"'+
      ' data-count="'+(t.reviewCount||0)+'"'+
      '>'+
      '<div class="ra-card-top">'+bgImg+
        '<div class="ra-icon">'+iconHtml+'</div>'+
        '<div class="ra-badge-ok"><i class="ti ti-check"></i> Verificado</div>'+
        (domicilio ? '<div class="ra-dom">🚚 Domicilio</div>' : '')+
      '</div>'+
      '<div class="ra-body">'+
        '<div class="ra-name">'+esc(t.nombre||'Sin nombre')+'</div>'+
        ratingHtml+
        '<div class="ra-zona"><i class="ti ti-map-pin"></i> '+(zona||'–')+'</div>'+
        '<div class="ra-specs">'+
          '<div class="ra-spec"><i class="ti ti-phone"></i> '+(t.telefono||'–')+'</div>'+
          '<div class="ra-spec"><i class="ti ti-tag"></i> '+(cats.slice(0,2).join(', ')||'–')+'</div>'+
        '</div>'+
        '<div class="ra-tags">'+marcas.slice(0,3).map(function(m){return '<span class="ra-tag">'+esc(m)+'</span>';}).join('')+'</div>'+
      '</div>'+
      '<div class="ra-foot">'+
        '<span style="font-size:12px;color:#999">'+(t.nit ? 'NIT: '+esc(t.nit) : '')+'</span>'+
        '<button class="ra-btn">Ver más</button>'+
      '</div>'+
    '</div>';
  }

  function cta() {
    return '<div class="ra-cta" onclick="window.open(\'https://gruas.ridera.com.co/registro-almacen\',\'_blank\')">'+
      '<i class="ti ti-plus"></i>'+
      '<div class="ra-cta-title">Registrar mi almacén</div>'+
      '<div class="ra-cta-sub">¿Tenés un almacén de repuestos?<br>Aparecé gratis en el directorio</div>'+
    '</div>';
  }

  function esc(s) {
    return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  var todos = [], filtro = 'todos', busq = '', orden = 'reciente';

  function visibles() {
    var l = todos.slice();
    if (filtro !== 'todos') l = l.filter(function(t){
      return (t.categorias||'').toLowerCase().includes(filtro) ||
             (t.marcas||'').toLowerCase().includes(filtro);
    });
    if (busq) {
      var q = busq.toLowerCase();
      l = l.filter(function(t){
        return (t.nombre||'').toLowerCase().includes(q) ||
               (t.ciudad||'').toLowerCase().includes(q) ||
               (t.barrio||'').toLowerCase().includes(q) ||
               (t.marcas||'').toLowerCase().includes(q) ||
               (t.categorias||'').toLowerCase().includes(q);
      });
    }
    if (orden === 'az') l.sort(function(a,b){return(a.nombre||'').localeCompare(b.nombre||'');});
    if (orden === 'rating') l.sort(function(a,b){return (b.avgRating||0)-(a.avgRating||0);});
    return l;
  }

  function render() {
    var grid  = document.getElementById('ra-grid');
    var lista = visibles();
    document.getElementById('ra-count').textContent =
      lista.length + ' almacén' + (lista.length !== 1 ? 'es' : '') +
      ' encontrado' + (lista.length !== 1 ? 's' : '');
    grid.innerHTML = lista.map(card).join('') + cta();
    grid.querySelectorAll('.ra-card').forEach(function(c){
      c.addEventListener('click', function(){ modal(c.dataset); });
      c.querySelector('.ra-btn').addEventListener('click', function(ev){
        ev.stopPropagation(); modal(c.dataset);
      });
    });
  }

  var modalAlmacenId = null;
  var modalCalificacion = 0;

  function modal(d) {
    modalAlmacenId = d.id;
    modalCalificacion = 0;
    document.querySelectorAll('#ram-star-picker span').forEach(function(s){ s.classList.remove('filled'); });
    document.getElementById('ram-resena-nombre').value = '';
    document.getElementById('ram-resena-comentario').value = '';
    document.getElementById('ram-resena-status').className = 'ram-resena-status';

    // Logo
    var logoWrap = document.getElementById('ram-logo-wrap');
    logoWrap.innerHTML = d.logo
      ? '<img class="ra-modal-logo" src="'+esc(d.logo)+'" alt="logo">'
      : '';

    document.getElementById('ram-nombre').textContent    = d.nombre;
    document.getElementById('ram-zona').textContent      = d.zona;
    document.getElementById('ram-direccion').textContent = d.direccion || '–';
    document.getElementById('ram-tel').textContent       = d.tel || '–';

    var emailEl = document.getElementById('ram-email');
    var emailRow = document.getElementById('ram-email-row');
    emailEl.textContent = d.email || '';
    emailRow.style.display = d.email ? '' : 'none';

    var webEl  = document.getElementById('ram-web');
    var webRow = document.getElementById('ram-web-row');
    webEl.textContent = d.web || '';
    webRow.style.display = d.web ? '' : 'none';

    document.getElementById('ram-domicilio').textContent = d.domicilio || '–';

    var marcas = (d.marcas||'').split(',').map(function(s){return s.trim();}).filter(Boolean);
    var cats   = (d.categorias||'').split(',').map(function(s){return s.trim();}).filter(Boolean);
    document.getElementById('ram-marcas').innerHTML =
      [].concat(marcas, cats).map(function(m){return '<span class="ra-tag">'+esc(m)+'</span>';}).join('');

    // Fotos
    var fotosEl = document.getElementById('ram-fotos');
    var fotos   = [d.foto1, d.foto2, d.foto3].filter(Boolean);
    fotosEl.innerHTML = fotos.map(function(f){
      return '<img src="'+esc(f)+'" alt="" loading="lazy">';
    }).join('');

    cargarResenas(d.id);

    document.getElementById('ra-overlay').classList.add('open');
  }

  function cargarResenas(almacenId) {
    var listEl  = document.getElementById('ram-resenas-list');
    var emptyEl = document.getElementById('ram-resenas-empty');
    var avgEl   = document.getElementById('ram-resenas-avg');
    listEl.innerHTML = '';
    emptyEl.style.display = 'none';
    avgEl.textContent = '';

    fetch(SUPABASE_URL + '/rest/v1/almacen_resenas?almacen_id=eq.' + encodeURIComponent(almacenId) +
      '&aprobado=eq.true&select=nombre_autor,calificacion,comentario,created_at&order=created_at.desc',
      { headers: sbHeaders() }
    )
    .then(function(r){ return r.ok ? r.json() : []; })
    .then(function(resenas){
      if (!resenas.length) {
        emptyEl.style.display = 'block';
        return;
      }
      var avg = resenas.reduce(function(s,r){ return s + r.calificacion; }, 0) / resenas.length;
      avgEl.textContent = starsHtml(avg) + ' ' + avg.toFixed(1) + ' (' + resenas.length + ')';
      listEl.innerHTML = resenas.map(function(r){
        return '<div class="ram-resena-item">'+
          '<div class="ram-resena-head">'+
            '<span class="ram-resena-autor">'+esc(r.nombre_autor)+'</span>'+
            '<span class="ram-resena-stars">'+starsHtml(r.calificacion)+'</span>'+
          '</div>'+
          (r.comentario ? '<div class="ram-resena-texto">'+esc(r.comentario)+'</div>' : '')+
        '</div>';
      }).join('');
    })
    .catch(function(){ /* silencioso: no bloquea el resto del modal */ });
  }

  document.getElementById('ram-star-picker').addEventListener('click', function(e){
    var val = e.target.dataset.val;
    if (!val) return;
    modalCalificacion = parseInt(val);
    document.querySelectorAll('#ram-star-picker span').forEach(function(s){
      s.classList.toggle('filled', parseInt(s.dataset.val) <= modalCalificacion);
    });
  });

  document.getElementById('ram-resena-enviar').addEventListener('click', function(){
    var statusEl  = document.getElementById('ram-resena-status');
    var nombre    = document.getElementById('ram-resena-nombre').value.trim();
    var comentario= document.getElementById('ram-resena-comentario').value.trim();

    if (!nombre || !modalCalificacion) {
      statusEl.className = 'ram-resena-status visible err';
      statusEl.textContent = 'Escribe tu nombre y selecciona una calificación.';
      return;
    }

    fetch(SUPABASE_URL + '/rest/v1/almacen_resenas', {
      method: 'POST',
      headers: sbHeaders({ 'Content-Type': 'application/json', 'Prefer': 'return=minimal' }),
      body: JSON.stringify({
        almacen_id: modalAlmacenId,
        nombre_autor: nombre,
        calificacion: modalCalificacion,
        comentario: comentario || null
      })
    })
    .then(function(r){
      if (!r.ok) throw new Error('HTTP ' + r.status);
      statusEl.className = 'ram-resena-status visible ok';
      statusEl.textContent = '¡Gracias! Tu reseña se publicará después de ser revisada.';
      document.getElementById('ram-resena-nombre').value = '';
      document.getElementById('ram-resena-comentario').value = '';
      modalCalificacion = 0;
      document.querySelectorAll('#ram-star-picker span').forEach(function(s){ s.classList.remove('filled'); });
    })
    .catch(function(err){
      statusEl.className = 'ram-resena-status visible err';
      statusEl.textContent = 'Error al enviar: ' + err.message;
    });
  });

  document.getElementById('ra-close').onclick = function(){
    document.getElementById('ra-overlay').classList.remove('open');
  };
  document.getElementById('ra-overlay').onclick = function(e){
    if (e.target === e.currentTarget) e.target.classList.remove('open');
  };
  document.getElementById('ra-filters').addEventListener('click', function(e){
    var p = e.target.closest('.ra-pill'); if (!p) return;
    document.querySelectorAll('.ra-pill').forEach(function(x){ x.classList.remove('on'); });
    p.classList.add('on'); filtro = p.dataset.f; render();
  });
  document.getElementById('ra-input').addEventListener('input', function(e){
    busq = e.target.value; render();
  });
  document.getElementById('ra-sort').addEventListener('change', function(e){
    orden = e.target.value; render();
  });

  // Cargar almacenes y, en paralelo, las reseñas aprobadas (para el promedio en cada tarjeta)
  Promise.all([
    fetch(SUPABASE_URL + '/rest/v1/almacenes?aprobado=eq.true&select=*&order=created_at.desc', { headers: sbHeaders() })
      .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }),
    fetch(SUPABASE_URL + '/rest/v1/almacen_resenas?aprobado=eq.true&select=almacen_id,calificacion', { headers: sbHeaders() })
      .then(function(r){ return r.ok ? r.json() : []; })
  ])
  .then(function(results){
    var data = results[0];
    var resenas = results[1];

    var ratingMap = {};
    resenas.forEach(function(r){
      if (!ratingMap[r.almacen_id]) ratingMap[r.almacen_id] = { sum: 0, count: 0 };
      ratingMap[r.almacen_id].sum += r.calificacion;
      ratingMap[r.almacen_id].count += 1;
    });

    todos = data.map(function(row){
      var t = flattenRow(row);
      var rm = ratingMap[t.id];
      t.avgRating = rm ? rm.sum / rm.count : 0;
      t.reviewCount = rm ? rm.count : 0;
      return t;
    });
    render();
  })
  .catch(function(err){
    document.getElementById('ra-grid').innerHTML =
      '<div class="ra-empty" style="color:#E85D20">⚠️ No se pudo cargar. ' + err.message + '</div>';
  });
})();
</script>
