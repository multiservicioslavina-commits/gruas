<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ridera - Mapa Interactivo (Test)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: #1a1a2e;
            color: #f0e8de;
        }

        #container {
            width: 100%;
            height: 100vh;
            position: relative;
            display: flex;
        }

        #rmMap {
            flex: 1;
            background: linear-gradient(135deg, #2d5a3d 0%, #1f3a2f 100%);
            border: 2px solid #E85D20;
        }

        .rm-sidebar {
            width: 360px;
            background: rgba(20, 24, 50, 0.95);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(232, 93, 32, 0.2);
            padding: 24px;
            overflow-y: auto;
            box-shadow: 8px 0 40px rgba(0, 0, 0, 0.7);
        }

        .rm-sidebar h2 {
            font-size: 26px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 8px;
        }

        .rm-sidebar p {
            font-size: 12px;
            color: #E85D20;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(232, 93, 32, 0.3);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .stat-num {
            font-size: 20px;
            font-weight: 800;
            color: #E85D20;
        }

        .stat-label {
            font-size: 10px;
            color: #b0b5c8;
            text-transform: uppercase;
            margin-top: 8px;
            letter-spacing: 1px;
        }

        .debug-info {
            background: rgba(232, 93, 32, 0.1);
            border: 1px solid #E85D20;
            border-radius: 8px;
            padding: 12px;
            margin-top: 20px;
            font-size: 12px;
            color: #E8975A;
        }

        @media (max-width: 1024px) {
            #container {
                flex-direction: column;
            }

            .rm-sidebar {
                width: 100%;
                height: auto;
                max-height: 40vh;
                border-right: none;
                border-bottom: 2px solid rgba(232, 93, 32, 0.3);
                order: 2;
            }

            #rmMap {
                order: 1;
                height: 60vh;
            }
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="rmMap"></div>
        <div class="rm-sidebar">
            <h2>RIDERA</h2>
            <p>Rutas de Senderismo</p>

            <div class="stats">
                <div class="stat">
                    <span class="stat-num" id="rutasCount">0</span>
                    <span class="stat-label">Rutas</span>
                </div>
                <div class="stat">
                    <span class="stat-num" id="depsCount">0</span>
                    <span class="stat-label">Regiones</span>
                </div>
                <div class="stat">
                    <span class="stat-num" id="kmCount">0</span>
                    <span class="stat-label">KM</span>
                </div>
            </div>

            <div class="debug-info">
                <strong>Estado:</strong> Cargando rutas...<br>
                <span id="debugStatus">Conectando a API...</span>
            </div>
        </div>
    </div>

    <script>
        console.log('🗺️ Iniciando mapa...');

        // Verificar que Leaflet esté cargado
        if (typeof L === 'undefined') {
            console.error('❌ Leaflet no se cargó correctamente');
            document.getElementById('debugStatus').innerHTML = '❌ Error: Leaflet no cargado';
        } else {
            console.log('✅ Leaflet cargado:', L.version);
        }

        // Crear mapa
        var map = null;
        try {
            map = L.map('rmMap', {
                center: [6.0, -74.8],
                zoom: 6,
                zoomControl: false
            });
            console.log('✅ Mapa creado');

            L.control.zoom({ position: 'topright' }).addTo(map);

            // Agregar tiles OpenStreetMap
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap',
                maxZoom: 18,
            }).addTo(map);
            console.log('✅ Tiles cargados');

            // Agregar marcadores de prueba
            var testCoords = [
                {name: 'Medellín', lat: 6.2442, lon: -75.5812},
                {name: 'Guatapé', lat: 6.2272, lon: -75.1561},
                {name: 'Ayapel', lat: 8.5967, lon: -75.6328}
            ];

            testCoords.forEach(function(coord) {
                L.marker([coord.lat, coord.lon], {
                    icon: L.divIcon({
                        className: '',
                        html: '<div style="width:20px;height:20px;background:radial-gradient(circle,#ff7a3d,#E85D20);border-radius:50%;border:3px solid #fff;box-shadow:0 0 12px rgba(232,93,32,0.8)"></div>',
                        iconSize: [20, 20],
                        iconAnchor: [10, 10]
                    })
                }).bindPopup('<strong>' + coord.name + '</strong>').addTo(map);
            });

            document.getElementById('debugStatus').innerHTML = '✅ Mapa listo! (Versión test)';
            document.getElementById('rutasCount').textContent = '3';
            document.getElementById('depsCount').textContent = '3';
            document.getElementById('kmCount').textContent = '+1000';

        } catch (err) {
            console.error('❌ Error creando mapa:', err);
            document.getElementById('debugStatus').innerHTML = '❌ Error: ' + err.message;
        }

        // Agregar listeners
        if (map) {
            map.on('load', function() {
                console.log('✅ Mapa completamente cargado');
            });
            map.on('error', function(e) {
                console.error('❌ Error del mapa:', e);
            });
        }
    </script>
</body>
</html>
