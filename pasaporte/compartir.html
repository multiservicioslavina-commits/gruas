const RANKS=[
  {min:0,name:"Aprendiz de Ruta"},{min:5,name:"Trochero"},{min:20,name:"Explorador"},
  {min:45,name:"Trotapueblos"},{min:80,name:"Maestro Viajero"},{min:120,name:"Leyenda"},{min:125,name:"Patrón de Antioquia"}
];
function rankFor(n){ let r=RANKS[0]; for(const k of RANKS){ if(n>=k.min) r=k; } return r.name; }

let blobCache=null, shareText="";

(async function(){
  const { data:sess } = await sb.auth.getSession();
  if(!sess.session){ window.location.href="index.html"; return; }
  const u=sess.session.user;

  let nombre="Rider", count=0, pts=0, sealedSet=new Set();
  try{
    const { data:prof } = await sb.from("riders").select("nombre").eq("id",u.id).maybeSingle();
    if(prof&&prof.nombre) nombre=prof.nombre;
    const { data:sellos } = await sb.from("sellos").select("municipio_id").eq("rider_id",u.id);
    count = sellos ? sellos.length : 0;
    sealedSet = new Set((sellos||[]).map(s=>s.municipio_id));
    if(sellos&&sellos.length){
      const { data:munis } = await sb.from("municipios").select("id,puntos_sello");
      const map={}; (munis||[]).forEach(m=>map[m.id]=m.puntos_sello||0);
      pts = sellos.reduce((a,s)=>a+(map[s.municipio_id]||0),0);
    }
  }catch(e){}

  await drawBanner({nombre, count, pts, rango:rankFor(count), sealed:sealedSet});

  shareText = `Voy ${count}/125 municipios de Antioquia en el reto Ridera 125 🏍️🧡 ¿Te le mides? Únete: ${SITE}`;
  $("waBtn").href = "https://wa.me/?text="+encodeURIComponent(shareText);
  $("fbBtn").href = "https://www.facebook.com/sharer/sharer.php?u="+encodeURIComponent(SITE);

  $("loadingBox").style.display="none";
  $("bannerPreview").style.display="block";
  $("btns").style.display="flex";
  $("note").style.display="block";
})();

async function drawBanner({nombre,count,pts,rango,sealed}){
  await Promise.all([
    document.fonts.load('400 100px "Bebas Neue"'),
    document.fonts.load('700 30px "JetBrains Mono"'),
    document.fonts.load('600 30px "Barlow Condensed"')
  ]).catch(()=>{});
  await document.fonts.ready;

  const c=$("canvas"), x=c.getContext("2d"), W=1080,H=1350;
  x.fillStyle="#0d0d0d"; x.fillRect(0,0,W,H);
  x.strokeStyle="#E85D20"; x.lineWidth=5; x.strokeRect(28,28,W-56,H-56);
  x.strokeStyle="rgba(232,93,32,.28)"; x.lineWidth=2; x.strokeRect(42,42,W-84,H-84);

  x.textAlign="center"; x.textBaseline="alphabetic";
  x.fillStyle="#E85D20"; x.font='700 26px "JetBrains Mono"';
  x.fillText("P A S A P O R T E   \u00b7   A N T I O Q U I A   1 2 5",W/2,98);
  x.fillStyle="#f4f1ea"; x.font='400 112px "Bebas Neue"';
  x.fillText("RIDERA 125",W/2,205);
  x.fillStyle="#c9a84c"; x.font='400 60px "Bebas Neue"';
  x.fillText((nombre||"RIDER").toUpperCase(),W/2,283);

  // Mapa de Antioquia (lo sellado en naranja)
  const mapW=520, sc=mapW/MAP.w, mapH=MAP.h*sc, ox=(W-mapW)/2, oy=312;
  x.save(); x.translate(ox,oy); x.scale(sc,sc);
  for(const sg in MAP.paths){
    const p=new Path2D(MAP.paths[sg]);
    x.fillStyle = sealed.has(sg) ? "#3fb05a" : "#2e2e2e"; x.fill(p);
    x.lineWidth=1.4/sc; x.strokeStyle="#0d0d0d"; x.stroke(p);
  }
  for(const sg in MAP.paths){
    if(sealed.has(sg)){ const p=new Path2D(MAP.paths[sg]); x.lineWidth=2.4/sc; x.strokeStyle="rgba(120,230,150,.9)"; x.stroke(p); }
  }
  x.restore();

  const yb=oy+mapH, baseY=yb+120;
  const numStr=String(count);
  x.textAlign="left";
  x.font='400 130px "Bebas Neue"'; const nW=x.measureText(numStr).width;
  x.font='400 60px "Bebas Neue"'; const sW=x.measureText("/ 125").width;
  const gap=16, tot=nW+gap+sW, sx=(W-tot)/2;
  x.fillStyle="#E85D20"; x.font='400 130px "Bebas Neue"'; x.fillText(numStr,sx,baseY);
  x.fillStyle="#c2beb4"; x.font='400 60px "Bebas Neue"'; x.fillText("/ 125",sx+nW+gap,baseY);
  x.textAlign="center";
  x.fillStyle="#c2beb4"; x.font='700 30px "Barlow Condensed"';
  x.fillText("M U N I C I P I O S   S E L L A D O S",W/2,baseY+52);

  const rTxt="RANGO \u00b7 "+rango.toUpperCase();
  x.font='700 38px "Barlow Condensed"'; const rW=x.measureText(rTxt).width, cw=rW+80, chY=baseY+95;
  x.fillStyle="#1b1b1b"; roundRect(x,(W-cw)/2,chY,cw,70,16); x.fill();
  x.strokeStyle="#c9a84c"; x.lineWidth=2; roundRect(x,(W-cw)/2,chY,cw,70,16); x.stroke();
  x.fillStyle="#c9a84c"; x.textBaseline="middle"; x.fillText(rTxt,W/2,chY+37); x.textBaseline="alphabetic";

  x.fillStyle="#E85D20"; x.font='400 50px "Bebas Neue"';
  x.fillText("\u00daNETE AL RETO",W/2,chY+150);
  x.fillStyle="#938c80"; x.font='700 23px "JetBrains Mono"';
  x.fillText("pasaporte.ridera.com.co",W/2,chY+192);

  const url=c.toDataURL("image/png");
  $("bannerPreview").src=url;
  blobCache=await new Promise(r=>c.toBlob(r,"image/png"));
}
function roundRect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

// Compartir nativo (con imagen)
$("shareBtn").addEventListener("click", async ()=>{
  try{
    if(blobCache && navigator.canShare){
      const file=new File([blobCache],"ridera125.png",{type:"image/png"});
      if(navigator.canShare({files:[file]})){
        await navigator.share({files:[file], text:shareText});
        return;
      }
    }
    // Fallback: descargar
    download();
    alert("Tu navegador no abre el menú de compartir. Descargué el banner para que lo subas a tus redes.");
  }catch(e){ /* el usuario canceló, no hacemos nada */ }
});
$("downloadBtn").addEventListener("click", download);
function download(){
  const a=document.createElement("a");
  a.href=$("bannerPreview").src; a.download="ridera125-mi-avance.png"; a.click();
}
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}</script>
