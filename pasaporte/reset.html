<style>
  :root{--bg:#0d0d0d;--panel:#141414;--panel-2:#1b1b1b;--line:#262626;--orange:#E85D20;--ink:#f4f1ea;--ink-dim:#c2beb4;--ink-faint:#a89e90;--ok:#5fb86a;--err:#ff8a6b}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 22px}
  .wrap{width:100%;max-width:400px;text-align:center}
  .eyebrow{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:15px;letter-spacing:.34em;color:var(--orange);text-transform:uppercase}
  h1{font-family:"Bebas Neue",sans-serif;font-size:54px;line-height:.9;letter-spacing:1px;margin:6px 0 0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px 20px;margin-top:22px;text-align:left}
  label{display:block;font-family:"JetBrains Mono",monospace;font-weight:600;font-size:15px;letter-spacing:.18em;color:var(--ink-faint);text-transform:uppercase;margin:14px 0 6px}
  input{width:100%;padding:13px 14px;font-size:16px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;color:var(--ink);font-family:"DM Sans",sans-serif}
  input:focus{outline:none;border-color:var(--orange)}
  .cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:22px;border:0;border-radius:11px;background:var(--orange);color:#100a06;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:19px;letter-spacing:.6px;text-transform:uppercase;padding:15px;cursor:pointer}
  .cta:active{transform:translateY(1px)} .cta:disabled{opacity:.5}
  .msg{margin-top:14px;font-family:"JetBrains Mono",monospace;font-size:14px;line-height:1.5;border-radius:10px;padding:11px 13px;display:none}
  .msg.show{display:block} .msg.error{color:var(--err);background:#1a0f0a;border:1px solid #3a1d12} .msg.ok{color:var(--ok);background:#0d160e;border:1px solid #1d3a22}
  p{color:var(--ink-dim);font-size:15px}
  a.link{color:var(--orange);text-decoration:none;font-weight:700}
  #form,#bad,#done{display:none}
  body.s-form #form{display:block} body.s-bad #bad{display:block} body.s-done #done{display:block}
  .pwrap{position:relative}
  .pwrap > input{padding-right:78px}
  .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:transparent;border:0;color:var(--orange);font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:14px;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;padding:10px 8px}
</style>
</head>
<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NPWT32Q5"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
<div class="wrap">
  <div class="eyebrow">Pasaporte · Ridera 125</div>
  <h1>NUEVA CLAVE</h1>

  <div class="card" id="form">
    <p style="margin-top:0">Escribe tu nueva contraseña.</p>
    <label>Nueva contraseña</label>
    <div class="pwrap">
      <input id="p1" type="password" placeholder="mínimo 6 caracteres">
      <button class="eye" type="button" data-for="p1" aria-label="Ver">Ver</button>
    </div>
    <label>Repítela</label>
    <div class="pwrap">
      <input id="p2" type="password" placeholder="otra vez">
      <button class="eye" type="button" data-for="p2" aria-label="Ver">Ver</button>
    </div>
    <button class="cta" id="saveBtn">Guardar contraseña</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card" id="bad">
    <p style="margin:0">Este enlace no es válido o ya expiró. Vuelve al login y pide uno nuevo en <b>"¿Olvidaste tu contraseña?"</b>.</p>
    <a class="link" href="index.html">← Volver al login</a>
  </div>

  <div class="card" id="done" style="text-align:center">
    <p style="margin:0 0 14px">✅ ¡Contraseña actualizada! Ya puedes entrar con la nueva.</p>
    <a class="cta" href="index.html" style="text-decoration:none">Ir al login</a>
  </div>
</div>

<script>
const SUPABASE_URL="https://vzzxsdtsaahhzyctvmhx.supabase.co";
const SUPABASE_KEY="sb_publishable_r1ImtuUXs1zM02OgwserGQ_F7R26Niu";
const sb=supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $=id=>document.getElementById(id);

let ready=false;

// Intentar detectar la sesión de recuperación hasta 8 segundos
async function checkSession(){
  const { data } = await sb.auth.getSession();
  if(data.session){ ready=true; document.body.className="s-form"; return true; }
  return false;
}

sb.auth.onAuthStateChange((event)=>{
  if(event==="PASSWORD_RECOVERY"){ ready=true; document.body.className="s-form"; }
  else if(event==="SIGNED_IN" && !ready){
    // Supabase puede emitir SIGNED_IN en lugar de PASSWORD_RECOVERY en algunas versiones
    checkSession();
  }
});

// Polling hasta 8 s para conexiones lentas
(async()=>{
  for(const delay of [800,1200,2000,4000]){
    await new Promise(r=>setTimeout(r,delay));
    if(ready) return;
    if(await checkSession()) return;
  }
  if(!ready) document.body.className="s-bad";
})();

$("saveBtn").addEventListener("click", async ()=>{
  const p1=$("p1").value, p2=$("p2").value, m=$("msg");
  if(p1.length<6){ m.textContent="Mínimo 6 caracteres."; m.className="msg show error"; return; }
  if(p1!==p2){ m.textContent="Las contraseñas no coinciden."; m.className="msg show error"; return; }
  $("saveBtn").disabled=true;
  try{
    const { error } = await sb.auth.updateUser({ password:p1 });
    if(error) throw error;
    document.body.className="s-done";
  }catch(err){
    m.textContent="Ups: "+err.message; m.className="msg show error"; $("saveBtn").disabled=false;
  }
});

document.querySelectorAll(".eye").forEach(b=>b.addEventListener("click",()=>{
  const i=document.getElementById(b.dataset.for);
  const show=i.type==="password"; i.type=show?"text":"password"; b.textContent=show?"Ocultar":"Ver";
}));
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}</script>
</body>
</html>
