<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clubes · Ridera 125</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d0d0d">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="icon" href="favicon.ico" sizes="any">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ridera 125">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@500;600;700&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--bg:#0d0d0d;--panel:#141414;--panel-2:#1b1b1b;--line:#262626;--orange:#E85D20;--green:#3fae5a;--ink:#f4f1ea;--ink-dim:#c2beb4;--ink-faint:#a89e90;--copper:#c9a84c}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif}
  body{max-width:560px;margin:0 auto;min-height:100vh;padding:0 0 40px}
  .top{padding:20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px}
  .back{font-family:"Bebas Neue",sans-serif;font-size:30px;color:var(--ink-dim);text-decoration:none;line-height:1}
  .eyebrow{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:13px;letter-spacing:.3em;color:var(--orange);text-transform:uppercase}
  .top h1{font-family:"Bebas Neue",sans-serif;font-size:36px;line-height:.95;margin:2px 0 0}
  .wrap{padding:18px}
  h2{font-family:"Bebas Neue",sans-serif;font-size:26px;margin:22px 0 12px;letter-spacing:.5px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px}
  .club-name{font-family:"Bebas Neue",sans-serif;font-size:28px;line-height:1}
  .badge{display:inline-block;font-family:"JetBrains Mono",monospace;font-weight:700;font-size:12px;letter-spacing:.15em;color:var(--copper);border:1px solid var(--copper);border-radius:6px;padding:2px 8px;margin-left:8px;vertical-align:middle}
  .code{font-family:"JetBrains Mono",monospace;font-weight:700;color:var(--orange);font-size:16px;letter-spacing:.1em}
  .codebox{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:15px;color:var(--ink-dim)}
  .bar{height:12px;background:var(--panel-2);border-radius:7px;overflow:hidden;margin:12px 0 8px}
  .bar > i{display:block;height:100%;background:var(--green);border-radius:7px}
  .stats{display:flex;gap:18px;font-size:15px;color:var(--ink-dim)}
  .stats b{color:var(--ink);font-family:"Bebas Neue",sans-serif;font-size:20px}
  label{display:block;font-family:"JetBrains Mono",monospace;font-weight:600;font-size:13px;letter-spacing:.15em;color:var(--ink-faint);text-transform:uppercase;margin:0 0 6px}
  input{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:14px;color:var(--ink);font-size:17px;font-family:"DM Sans",sans-serif;margin-bottom:12px}
  input:focus{outline:none;border-color:var(--orange)}
  .btn{display:block;width:100%;border:0;border-radius:12px;background:var(--orange);color:#100a06;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:19px;letter-spacing:.5px;text-transform:uppercase;padding:15px;cursor:pointer}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:var(--panel);border:1px solid var(--orange);color:var(--orange)}
  .msg{margin:10px 0 0;padding:11px 13px;border-radius:10px;font-size:15px;display:none}
  .msg.ok{display:block;background:rgba(63,174,90,.12);border:1px solid var(--green);color:var(--green)}
  .msg.err{display:block;background:rgba(232,93,32,.12);border:1px solid var(--orange);color:var(--orange)}
  .empty{color:var(--ink-dim);font-size:16px;line-height:1.5;background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:20px;text-align:center}
  .rank-row{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
  .rank-pos{font-family:"Bebas Neue",sans-serif;font-size:24px;color:var(--copper);min-width:32px}
  .rank-info{flex:1}
  .rank-info .n{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:18px}
  .rank-info .s{font-size:13px;color:var(--ink-faint)}
  .rank-pct{font-family:"Bebas Neue",sans-serif;font-size:26px;color:var(--green)}
  .toggle{font-family:"Barlow Condensed",sans-serif;font-weight:700;color:var(--ink-dim);font-size:16px;background:none;border:0;cursor:pointer;padding:0;margin-bottom:12px}
  .hidden{display:none!important}
  #loader{min-height:50vh;display:grid;place-items:center}
  .spinner{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--orange);border-radius:50%;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <header class="top">
    <a class="back" href="pasaporte.html">‹</a>
    <div><div class="eyebrow">Comunidad · Antioquia 125</div><h1>Clubes</h1></div>
  </header>

  <div id="loader"><div class="spinner"></div></div>

  <div class="wrap hidden" id="main">

    <h2>Mis clubes</h2>
    <div id="myClubs"></div>

    <h2>Unirme a un club</h2>
    <div class="card">
      <label>Código del club</label>
      <input id="joinCode" placeholder="Ej: TBC2026" autocapitalize="characters">
      <button class="btn" id="joinBtn">Unirme</button>
      <div class="msg" id="joinMsg"></div>
    </div>

    <h2>Crear un club</h2>
    <button class="toggle" id="toggleCreate">➕ Soy líder, quiero crear mi club</button>
    <div class="card hidden" id="createBox">
      <label>Nombre del club</label>
      <input id="clubName" placeholder="Ej: Touring Bikers Colombia">
      <label>Código (el que compartirás con tus miembros)</label>
      <input id="clubCode" placeholder="Ej: TBC2026" autocapitalize="characters">
      <button class="btn" id="createBtn">Crear club</button>
      <div class="msg" id="createMsg"></div>
    </div>

    <h2>Ranking de clubes 🏁</h2>
    <div id="ranking"></div>

  </div>

<script>
const SUPABASE_URL="https://vzzxsdtsaahhzyctvmhx.supabase.co";
const SUPABASE_KEY="sb_publishable_r1ImtuUXs1zM02OgwserGQ_F7R26Niu";
const sb=supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $=id=>document.getElementById(id);
let userId=null;

(async function(){
  const { data:sess } = await sb.auth.getSession();
  if(!sess.session){ window.location.href="index.html"; return; }
  userId=sess.session.user.id;
  $("loader").classList.add("hidden");
  $("main").classList.remove("hidden");
  await loadMyClubs();
  await loadRanking();
})();

function pctBar(p){ return '<div class="bar"><i style="width:'+Math.min(100,p||0)+'%"></i></div>'; }

async function loadMyClubs(){
  const { data:mem } = await sb.from("club_members").select("club_id, clubs(id,nombre,codigo,lider_id)").eq("rider_id",userId);
  const box=$("myClubs");
  if(!mem || !mem.length){
    box.innerHTML='<div class="empty">Todavía no perteneces a ningún club. Únete con un código abajo, o crea el tuyo si eres líder. 🏍️</div>';
    return;
  }
  const ids=mem.map(m=>m.club_id);
  const { data:stats } = await sb.from("club_rankings").select("*").in("id", ids);
  const sMap={}; (stats||[]).forEach(s=>sMap[s.id]=s);
  box.innerHTML = mem.map(m=>{
    const c=m.clubs||{}; const st=sMap[c.id]||{};
    const lider = c.lider_id===userId;
    return '<div class="card">'
      +'<div class="club-name">'+(c.nombre||"Club")+(lider?'<span class="badge">LÍDER</span>':'')+'</div>'
      +'<div class="codebox">Código para invitar: <span class="code">'+(c.codigo||"")+'</span></div>'
      + pctBar(st.porcentaje_club)
      +'<div class="stats"><span><b>'+(st.porcentaje_club||0)+'%</b> del mapa</span>'
      +'<span><b>'+(st.municipios_cubiertos||0)+'</b>/125 cubiertos</span>'
      +'<span><b>'+(st.miembros||0)+'</b> miembros</span></div>'
      +'</div>';
  }).join("");
}

async function loadRanking(){
  const { data } = await sb.from("club_rankings").select("*").order("municipios_cubiertos",{ascending:false}).limit(50);
  const box=$("ranking");
  if(!data || !data.length){ box.innerHTML='<div class="empty">Aún no hay clubes en el ranking. ¡Sé el primero!</div>'; return; }
  box.innerHTML = data.map((c,i)=>
    '<div class="rank-row"><div class="rank-pos">'+(i+1)+'</div>'
    +'<div class="rank-info"><div class="n">'+c.nombre+'</div><div class="s">'+(c.municipios_cubiertos||0)+'/125 · '+(c.miembros||0)+' miembros</div></div>'
    +'<div class="rank-pct">'+(c.porcentaje_club||0)+'%</div></div>'
  ).join("");
}

// Unirse por código
$("joinBtn").addEventListener("click", async ()=>{
  const code=($("joinCode").value||"").trim().toUpperCase();
  const msg=$("joinMsg"); msg.className="msg";
  if(!code){ msg.className="msg err"; msg.textContent="Escribe el código del club."; return; }
  $("joinBtn").disabled=true;
  try{
    const { data:club } = await sb.from("clubs").select("id,nombre").eq("codigo",code).maybeSingle();
    if(!club){ msg.className="msg err"; msg.textContent="No existe un club con ese código."; return; }
    const { error } = await sb.from("club_members").insert({ club_id:club.id, rider_id:userId });
    if(error){
      if(/duplicate|unique/i.test(error.message)){ msg.className="msg err"; msg.textContent="Ya perteneces a "+club.nombre+"."; }
      else throw error;
    } else {
      msg.className="msg ok"; msg.textContent="¡Te uniste a "+club.nombre+"! 🏍️";
      $("joinCode").value="";
      await loadMyClubs(); await loadRanking();
    }
  }catch(e){ msg.className="msg err"; msg.textContent="Error: "+(e.message||e); }
  finally{ $("joinBtn").disabled=false; }
});

// Mostrar/ocultar crear
$("toggleCreate").addEventListener("click", ()=>{ $("createBox").classList.toggle("hidden"); });

// Crear club
$("createBtn").addEventListener("click", async ()=>{
  const nombre=($("clubName").value||"").trim();
  const code=($("clubCode").value||"").trim().toUpperCase();
  const msg=$("createMsg"); msg.className="msg";
  if(!nombre){ msg.className="msg err"; msg.textContent="Ponle un nombre al club."; return; }
  if(!code || code.length<3){ msg.className="msg err"; msg.textContent="El código debe tener al menos 3 caracteres."; return; }
  $("createBtn").disabled=true;
  try{
    const { data:club, error } = await sb.from("clubs").insert({ nombre, codigo:code, lider_id:userId }).select("id,nombre").single();
    if(error){
      if(/duplicate|unique/i.test(error.message)){ msg.className="msg err"; msg.textContent="Ese código ya existe, elige otro."; return; }
      throw error;
    }
    await sb.from("club_members").insert({ club_id:club.id, rider_id:userId });
    msg.className="msg ok"; msg.textContent="¡Club "+club.nombre+" creado! Comparte el código "+code+" con tus miembros.";
    $("clubName").value=""; $("clubCode").value="";
    await loadMyClubs(); await loadRanking();
  }catch(e){ msg.className="msg err"; msg.textContent="Error: "+(e.message||e); }
  finally{ $("createBtn").disabled=false; }
});
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}</script>
</body>
</html>
