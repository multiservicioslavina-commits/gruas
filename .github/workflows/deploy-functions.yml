name: Deploy Supabase Edge Functions

# Despliega las edge functions que estan en supabase/functions/ usando el
# Supabase CLI, leyendo su contenido del repo. Reemplaza el despliegue manual
# (que obligaba a reconstruir archivos a mano y causo una caida).
#
# Cuando corre:
#   - al hacer merge/push a main que toque las funciones o su config, y
#   - manualmente desde la pestana Actions (boton "Run workflow").
#
# Despliega SOLO las funciones de la lista explicita FUNCIONES (abajo), no todo
# lo que haya en supabase/functions/. Asi, aunque el repo tenga muchas funciones
# exportadas como respaldo, solo se despliegan las que promovemos a proposito.
# Para agregar una: validala, agregala a FUNCIONES y a supabase/config.toml.
# El verify_jwt de cada funcion sale de supabase/config.toml.
#
# Requisito unico: agregar el secreto SUPABASE_ACCESS_TOKEN en
#   GitHub -> Settings -> Secrets and variables -> Actions
# con un token personal de https://supabase.com/dashboard/account/tokens

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

# Evita que dos despliegues corran a la vez y se pisen.
concurrency:
  group: deploy-supabase-functions
  cancel-in-progress: false

env:
  PROJECT_REF: vzzxsdtsaahhzyctvmhx
  # Lista explicita de funciones a desplegar. Solo estas se suben.
  # Agrega una funcion aqui SOLO cuando este validada y en config.toml.
  FUNCIONES: "rita-v2 wp-content-sync rita-recordatorios"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verificar CLI
        run: supabase --version

      - name: Preparar token
        run: |
          # Strip whitespace, lowercase ALL letters (not just A-F)
          CLEAN="$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          echo "::add-mask::$CLEAN"
          echo "SUPABASE_ACCESS_TOKEN=$CLEAN" >> "$GITHUB_ENV"

          # Diagnostic: character-class breakdown (no values leaked)
          BODY="${CLEAN:4}"
          echo "Token length: ${#CLEAN}, body length: ${#BODY}, prefix: ${CLEAN:0:4}"
          DIGITS=$(printf '%s' "$BODY" | tr -cd '0-9' | wc -c)
          HEX_LO=$(printf '%s' "$BODY" | tr -cd 'a-f' | wc -c)
          HEX_UP=$(printf '%s' "$BODY" | tr -cd 'A-F' | wc -c)
          ALPHA=$(printf '%s' "$BODY" | tr -cd 'g-zG-Z' | wc -c)
          OTHER=$(printf '%s' "$BODY" | tr -d '0-9a-fA-Fg-zG-Z' | wc -c)
          echo "Body chars: digits=$DIGITS hex_lower=$HEX_LO hex_upper=$HEX_UP alpha_nonhex=$ALPHA other=$OTHER"

          # Direct regex check
          if printf '%s' "$CLEAN" | grep -qE '^sbp_[a-f0-9]{40}$'; then
            echo "Regex OK: token matches sbp_[a-f0-9]{40}"
          else
            echo "Regex FAIL: token does NOT match sbp_[a-f0-9]{40}"
            # Show which positions are non-hex (position only, not the char)
            for i in $(seq 0 $((${#BODY}-1))); do
              C="${BODY:$i:1}"
              if ! printf '%s' "$C" | grep -qE '[a-f0-9]'; then
                echo "  bad char at body position $i (char class: $(printf '%s' "$C" | od -An -tx1 | tr -d ' '))"
              fi
            done
          fi
        env:
          RAW_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Desplegar edge functions (lista explicita)
        run: |
          for fn in $FUNCIONES; do
            echo "::group::Deploy $fn"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
            echo "::endgroup::"
          done
