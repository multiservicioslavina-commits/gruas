name: Deploy Supabase Edge Functions

# Despliega las edge functions que estan en supabase/functions/ usando el
# Supabase CLI, leyendo su contenido del repo. Reemplaza el despliegue manual
# (que obligaba a reconstruir archivos a mano y causo una caida).
#
# Cuando corre:
#   - al hacer merge/push a main que toque las funciones o su config, y
#   - manualmente desde la pestana Actions (boton "Run workflow").
#
# Solo despliega las funciones presentes en el repo. Las demas funciones que
# viven solo en Supabase NO se tocan (el deploy es por-funcion, no borra las
# que faltan). El verify_jwt de cada funcion sale de supabase/config.toml.
#
# Requisito unico: agregar el secreto SUPABASE_ACCESS_TOKEN en
#   GitHub -> Settings -> Secrets and variables -> Actions
# con un token personal de https://supabase.com/dashboard/account/tokens

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

# Evita que dos despliegues corran a la vez y se pisen.
concurrency:
  group: deploy-supabase-functions
  cancel-in-progress: false

env:
  PROJECT_REF: vzzxsdtsaahhzyctvmhx

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verificar login
        run: supabase --version
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Desplegar edge functions desde el repo
        run: supabase functions deploy --project-ref "$PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
