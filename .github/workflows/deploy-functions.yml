name: Deploy Supabase Edge Functions

# Despliega las edge functions que estan en supabase/functions/ usando el
# Supabase CLI, leyendo su contenido del repo. Reemplaza el despliegue manual
# (que obligaba a reconstruir archivos a mano y causo una caida).
#
# Cuando corre:
#   - al hacer merge/push a main que toque las funciones o su config, y
#   - manualmente desde la pestana Actions (boton "Run workflow").
#
# Despliega SOLO las funciones de la lista explicita FUNCIONES (abajo), no todo
# lo que haya en supabase/functions/. Asi, aunque el repo tenga muchas funciones
# exportadas como respaldo, solo se despliegan las que promovemos a proposito.
# Para agregar una: validala, agregala a FUNCIONES y a supabase/config.toml.
# El verify_jwt de cada funcion sale de supabase/config.toml.
#
# Requisito unico: agregar el secreto SUPABASE_ACCESS_TOKEN en
#   GitHub -> Settings -> Secrets and variables -> Actions
# con un token personal de https://supabase.com/dashboard/account/tokens

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

# Evita que dos despliegues corran a la vez y se pisen.
concurrency:
  group: deploy-supabase-functions
  cancel-in-progress: false

env:
  PROJECT_REF: vzzxsdtsaahhzyctvmhx
  # Lista explicita de funciones a desplegar. Solo estas se suben.
  # Agrega una funcion aqui SOLO cuando este validada y en config.toml.
  FUNCIONES: "rita-v2 wp-content-sync rita-recordatorios rita-whatsapp club-auth club-members"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verificar CLI
        run: supabase --version

      - name: Preparar token
        run: |
          CLEAN="$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')"
          echo "::add-mask::$CLEAN"
          echo "SUPABASE_ACCESS_TOKEN=$CLEAN" >> "$GITHUB_ENV"
        env:
          RAW_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Desplegar edge functions (lista explicita)
        run: |
          for fn in $FUNCIONES; do
            echo "::group::Deploy $fn"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
            echo "::endgroup::"
          done

      # Smoke test: confirma que cada funcion ARRANCA (no BOOT_ERROR).
      # Si una funcion no arranca, el workflow queda en ROJO de inmediato,
      # en vez de descubrir la caida por los usuarios horas despues.
      # Un 401/403 (firma/JWT) cuenta como OK: significa que arranco y corrio.
      - name: Smoke test (verificar arranque)
        run: |
          fail=0
          for fn in $FUNCIONES; do
            url="https://${PROJECT_REF}.supabase.co/functions/v1/$fn"
            code=$(curl -s -o /tmp/smoke_body.txt -w "%{http_code}" -m 30 \
              -X POST "$url" -H "Content-Type: application/json" -d '{"smoke":true}')
            body="$(cat /tmp/smoke_body.txt 2>/dev/null)"
            echo "$fn -> HTTP $code"
            if [ "$code" = "503" ] || printf '%s' "$body" | grep -qi "BOOT_ERROR\|failed to start"; then
              echo "::error::$fn NO ARRANCA (boot error). Revisa el codigo o revierte esta version."
              printf '%s\n' "$body" | head -c 500
              fail=1
            fi
          done
          if [ "$fail" = "1" ]; then exit 1; fi
          echo "Todas las funciones arrancan correctamente."
