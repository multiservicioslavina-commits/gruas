<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — Mi Taller | Ridera</title>
  <meta name="robots" content="noindex">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0e0e0e;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
    }
    .logo { text-align: center; margin-bottom: 1.5rem; }
    .logo svg { width: 48px; height: 48px; }
    .logo h1 { font-size: 1.5rem; font-weight: 700; color: #E85D20; margin-top: 0.5rem; }
    .logo p { color: #888; font-size: 0.9rem; margin-top: 0.25rem; }
    label { display: block; font-size: 0.85rem; color: #aaa; margin-bottom: 0.4rem; margin-top: 1.2rem; }
    input[type="text"], input[type="password"] {
      width: 100%; background: #111; border: 1px solid #333; border-radius: 8px;
      color: #f0f0f0; font-size: 1rem; padding: 0.75rem 1rem; transition: border-color 0.2s; outline: none;
    }
    input:focus { border-color: #E85D20; }
    .btn {
      display: block; width: 100%; margin-top: 1.75rem; padding: 0.85rem;
      background: #E85D20; color: #fff; font-size: 1rem; font-weight: 600;
      border: none; border-radius: 8px; cursor: pointer; transition: background 0.2s, opacity 0.2s;
    }
    .btn:hover { background: #cf4f18; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .error {
      display: none; background: #3a1212; border: 1px solid #6b1e1e; color: #f87171;
      border-radius: 8px; padding: 0.75rem 1rem; font-size: 0.875rem; margin-top: 1rem;
    }
    .forgot { text-align: center; margin-top: 1.25rem; font-size: 0.85rem; }
    .forgot a { color: #E85D20; text-decoration: none; }
    .forgot a:hover { text-decoration: underline; }
    .spinner {
      display: inline-block; width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff;
      border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      align-items: center; justify-content: center; padding: 1rem; z-index: 100;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px;
      padding: 1.75rem; width: 100%; max-width: 360px;
    }
    .modal-box h2 { font-size: 1.1rem; color: #f0f0f0; margin-bottom: 0.5rem; }
    .modal-box p.hint { color: #999; font-size: 0.82rem; line-height: 1.4; margin-bottom: 1rem; }
    .modal-close { float: right; background: none; border: none; color: #888; font-size: 1.2rem; cursor: pointer; }
    .modal-msg { display: none; border-radius: 8px; padding: 0.65rem 0.85rem; font-size: 0.82rem; margin-top: 0.9rem; }
    .modal-msg.ok { display: block; background: #0e2a1a; border: 1px solid #1a5c36; color: #4ade80; }
    .modal-msg.err { display: block; background: #3a1212; border: 1px solid #6b1e1e; color: #f87171; }
    .link-btn {
      background: none; border: none; color: #E85D20; font-size: 0.82rem; cursor: pointer;
      margin-top: 0.75rem; display: block; text-align: center; width: 100%;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="48" height="48" rx="10" fill="#E85D20"/>
        <path d="M14 34V22h6v12M24 34V18h6v16M20 18l4-4 4 4" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="36" cy="14" r="3" fill="#fff"/>
      </svg>
      <h1>Mi Taller</h1>
      <p>Administra tu taller en Ridera</p>
    </div>

    <form id="loginForm" novalidate>
      <label for="identifier">Correo o número de WhatsApp</label>
      <input type="text" id="identifier" placeholder="tu@correo.com o +57 300 000 0000" autocomplete="username" required>

      <label for="password">Contraseña</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>

      <div class="error" id="errorMsg"></div>

      <button type="submit" class="btn" id="submitBtn">Iniciar sesión</button>
    </form>

    <div class="forgot">
      <a href="#" id="forgotLink">¿Olvidé mi contraseña?</a>
    </div>
  </div>

  <div class="modal-overlay" id="phoneResetModal">
    <div class="modal-box">
      <button class="modal-close" id="phoneResetClose">✕</button>
      <div id="phoneResetStep1">
        <h2>Recuperar contraseña</h2>
        <p class="hint">Te enviaremos un código de 6 dígitos por WhatsApp al número con el que te registraste.</p>
        <label for="resetPhone">Número de WhatsApp</label>
        <input type="text" id="resetPhone" placeholder="+57 300 000 0000">
        <button class="btn" id="resetSendBtn" type="button">Enviar código</button>
        <div class="modal-msg" id="resetMsg1"></div>
      </div>
      <div id="phoneResetStep2" style="display:none">
        <h2>Escribe el código</h2>
        <p class="hint">Te llegó un mensaje de WhatsApp con un código de 6 dígitos.</p>
        <label for="resetCode">Código</label>
        <input type="text" id="resetCode" placeholder="123456" maxlength="6" inputmode="numeric">
        <label for="resetNewPass">Nueva contraseña</label>
        <input type="password" id="resetNewPass" placeholder="Mínimo 8 caracteres">
        <button class="btn" id="resetConfirmBtn" type="button">Cambiar contraseña</button>
        <button class="link-btn" id="resetAgainBtn" type="button">No recibí el código, enviar de nuevo</button>
        <div class="modal-msg" id="resetMsg2"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const SUPABASE_URL = 'https://vzzxsdtsaahhzyctvmhx.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ6enhzZHRzYWFoaHp5Y3R2bWh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzNzU3NzIsImV4cCI6MjA5Njk1MTc3Mn0.5GZRCUuMx7fwmvoo48nXVCq9QJs0ysCzz0TPr9mmcNI';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    sb.auth.getSession().then(({ data: { session } }) => {
      if (session) location.replace('mi-cuenta-taller.html');
    });

    const form    = document.getElementById('loginForm');
    const identEl = document.getElementById('identifier');
    const passEl  = document.getElementById('password');
    const btn     = document.getElementById('submitBtn');
    const errEl   = document.getElementById('errorMsg');

    function normalizePhone(raw) {
      let d = (raw || '').replace(/\D/g, '');
      if (!d) return '';
      d = d.replace(/^0+/, '');
      if (d.startsWith('57') && d.length >= 12) return d;
      if (d.length === 10) return '57' + d;
      return d;
    }
    function resolveIdentifier(raw) {
      const val = (raw || '').trim();
      if (val.includes('@')) return { email: val, isPhone: false };
      const tel = normalizePhone(val);
      return { email: `tel${tel}@telefono.gruas.ridera.com.co`, isPhone: true };
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.style.display = 'none';
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Entrando…';

      const { email } = resolveIdentifier(identEl.value);
      const { error } = await sb.auth.signInWithPassword({ email, password: passEl.value });

      if (error) {
        errEl.textContent = error.status === 400
          ? 'Correo/celular o contraseña incorrectos.'
          : 'Error al iniciar sesión. Intenta de nuevo.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Iniciar sesión';
      } else {
        location.replace('mi-cuenta-taller.html');
      }
    });

    const REGISTRAR_TALLER_URL = `${SUPABASE_URL}/functions/v1/registrar-taller`;

    const phoneModal   = document.getElementById('phoneResetModal');
    const step1        = document.getElementById('phoneResetStep1');
    const step2        = document.getElementById('phoneResetStep2');
    const resetPhoneEl = document.getElementById('resetPhone');
    const resetCodeEl  = document.getElementById('resetCode');
    const resetPassEl  = document.getElementById('resetNewPass');
    const resetMsg1    = document.getElementById('resetMsg1');
    const resetMsg2    = document.getElementById('resetMsg2');
    let resetPhoneNormalized = '';

    function showMsg(el, text, ok) {
      el.textContent = text;
      el.className = 'modal-msg ' + (ok ? 'ok' : 'err');
    }
    function openPhoneModal(prefill) {
      step1.style.display = '';
      step2.style.display = 'none';
      resetMsg1.className = 'modal-msg';
      resetMsg2.className = 'modal-msg';
      resetCodeEl.value = '';
      resetPassEl.value = '';
      resetPhoneEl.value = prefill || '';
      phoneModal.classList.add('open');
    }
    function closePhoneModal() { phoneModal.classList.remove('open'); }

    document.getElementById('phoneResetClose').addEventListener('click', closePhoneModal);
    phoneModal.addEventListener('click', (e) => { if (e.target === phoneModal) closePhoneModal(); });

    async function sendResetCode() {
      const tel = normalizePhone(resetPhoneEl.value);
      if (tel.length < 12) {
        showMsg(resetMsg1, 'Escribe un número de WhatsApp válido.', false);
        return;
      }
      resetPhoneNormalized = tel;
      const sendBtn = document.getElementById('resetSendBtn');
      sendBtn.disabled = true;
      sendBtn.textContent = 'Enviando…';
      try {
        await fetch(REGISTRAR_TALLER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'recuperar_clave_telefono', telefono: tel }),
        });
      } catch (_) { /* seguimos igual, no revelamos errores de red */ }
      sendBtn.disabled = false;
      sendBtn.textContent = 'Enviar código';
      step1.style.display = 'none';
      step2.style.display = '';
    }

    document.getElementById('resetSendBtn').addEventListener('click', sendResetCode);
    document.getElementById('resetAgainBtn').addEventListener('click', async () => {
      resetMsg2.className = 'modal-msg';
      await sendResetCode();
      showMsg(resetMsg2, 'Te enviamos un nuevo código por WhatsApp.', true);
    });

    document.getElementById('resetConfirmBtn').addEventListener('click', async () => {
      const code = resetCodeEl.value.trim();
      const newPassword = resetPassEl.value;
      if (!/^\d{6}$/.test(code)) {
        showMsg(resetMsg2, 'El código debe tener 6 dígitos.', false);
        return;
      }
      if (newPassword.length < 8) {
        showMsg(resetMsg2, 'La contraseña debe tener al menos 8 caracteres.', false);
        return;
      }
      const confirmBtn = document.getElementById('resetConfirmBtn');
      confirmBtn.disabled = true;
      confirmBtn.textContent = 'Guardando…';
      try {
        const res = await fetch(REGISTRAR_TALLER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'confirmar_reset_telefono',
            telefono: resetPhoneNormalized,
            code,
            new_password: newPassword,
          }),
        });
        const out = await res.json().catch(() => ({}));
        if (out.ok) {
          showMsg(resetMsg2, '¡Listo! Ya puedes iniciar sesión con tu nueva contraseña.', true);
          setTimeout(() => {
            closePhoneModal();
            identEl.value = resetPhoneEl.value;
            passEl.value = '';
            passEl.focus();
          }, 1800);
        } else {
          showMsg(resetMsg2, out.error || 'No pudimos confirmar el código.', false);
        }
      } catch (_) {
        showMsg(resetMsg2, 'Error de conexión. Intenta de nuevo.', false);
      }
      confirmBtn.disabled = false;
      confirmBtn.textContent = 'Cambiar contraseña';
    });

    document.getElementById('forgotLink').addEventListener('click', async (e) => {
      e.preventDefault();
      const raw = identEl.value.trim();
      if (!raw) {
        errEl.textContent = 'Escribe tu correo o celular primero.';
        errEl.style.display = 'block';
        return;
      }
      const { email, isPhone } = resolveIdentifier(raw);
      if (isPhone) {
        openPhoneModal(raw);
        return;
      }
      btn.disabled = true;
      await sb.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + '/mi-cuenta-taller.html',
      });
      errEl.style.cssText = 'display:block;background:#0e2a1a;border-color:#1a5c36;color:#4ade80;';
      errEl.textContent = 'Revisa tu correo — te enviamos un enlace para restablecer tu contraseña.';
      btn.disabled = false;
    });
  </script>
</body>
</html>
