<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inicia sesión — Mi taller Ridera</title>
<meta name="robots" content="noindex">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --orange:#E85D20; --orange-hot:#FF6B2B;
  --carbon:#0D0F12; --carbon3:#1E2229; --carbon4:#262D37;
  --text-muted:rgba(255,255,255,0.82); --text-dim:rgba(255,255,255,0.48);
  --border:rgba(255,255,255,0.07); --border-hi:rgba(255,255,255,0.13);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--carbon);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:400px;background:var(--carbon3);border:0.5px solid var(--border-hi);border-radius:16px;padding:36px 32px}
.brand{color:var(--orange);font-weight:700;font-size:1.1rem;margin-bottom:6px}
h1{font-size:1.5rem;font-weight:800;margin-bottom:6px}
.sub{color:var(--text-muted);font-size:0.9rem;margin-bottom:28px;line-height:1.5}
.form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
label{font-size:0.85rem;font-weight:600;color:rgba(255,255,255,0.9)}
input{width:100%;background:var(--carbon4);border:0.5px solid var(--border-hi);border-radius:8px;color:#fff;font-size:15px;padding:12px 14px}
input:focus{outline:none;border-color:rgba(232,93,32,0.5)}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:44px}
.pw-toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:18px;padding:4px;line-height:1}
.pw-toggle:hover{color:var(--orange)}
.btn{width:100%;background:var(--orange);color:#fff;font-weight:700;font-size:1rem;padding:14px;border:none;border-radius:8px;cursor:pointer;margin-top:8px;transition:background .2s}
.btn:hover{background:var(--orange-hot)}
.btn:disabled{background:#333;color:var(--text-dim);cursor:default}
.status{display:none;font-size:0.85rem;padding:10px 12px;border-radius:8px;margin-bottom:16px;border-left:3px solid}
.status.visible{display:block}
.status.error{background:rgba(248,113,113,0.1);border-color:#f87171;color:#fca5a5}
.status.success{background:rgba(74,222,128,0.1);border-color:#4ade80;color:#86efac}
.status.loading{background:rgba(232,93,32,0.08);border-color:var(--orange);color:var(--text-muted)}
.foot{text-align:center;margin-top:20px;font-size:0.85rem;color:var(--text-dim)}
.foot a{color:var(--orange);text-decoration:none;cursor:pointer}
.link-row{text-align:right;margin-top:-8px;margin-bottom:16px}
.link-row a{font-size:0.8rem;color:var(--text-dim);text-decoration:none;cursor:pointer}
.link-row a:hover{color:var(--orange)}
</style>
</head>
<body>
<div class="card">
  <div class="brand">RIDERA</div>
  <h1 id="formTitle">Ingresa a tu taller</h1>
  <p class="sub" id="formSub">Órdenes de servicio, clientes, inventario y caja de tu taller de motos.</p>

  <div class="status" id="status"></div>

  <form id="loginForm" onsubmit="handleLogin(event)">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" required placeholder="tu@taller.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label>Contraseña</label>
      <div class="pw-wrap">
        <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
        <button type="button" class="pw-toggle" id="pwToggle" onclick="togglePw()">👁</button>
      </div>
    </div>
    <div class="link-row"><a onclick="showForgot()">¿Olvidaste tu contraseña?</a></div>
    <button type="submit" class="btn" id="btnLogin">Entrar</button>
  </form>

  <form id="forgotForm" style="display:none" onsubmit="handleForgot(event)">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="forgotEmail" required placeholder="tu@taller.com">
    </div>
    <button type="submit" class="btn" id="btnForgot">Enviar enlace</button>
    <div class="foot"><a onclick="showLogin()">← Volver a iniciar sesión</a></div>
  </form>

  <div class="foot" id="footLink">¿Aún no registras tu taller? <a href="/registro-taller.html">Regístralo aquí</a></div>
</div>

<script>
const SB_URL = 'https://vzzxsdtsaahhzyctvmhx.supabase.co';
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ6enhzZHRzYWFoaHp5Y3R2bWh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzNzU3NzIsImV4cCI6MjA5Njk1MTc3Mn0.5GZRCUuMx7fwmvoo48nXVCq9QJs0ysCzz0TPr9mmcNI';

let sbClient = null;
async function initSupabase() {
  if (!sbClient) {
    const module = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.4/+esm');
    sbClient = module.createClient(SB_URL, ANON_KEY);
  }
  return sbClient;
}

function togglePw() {
  const input = document.getElementById('password');
  const btn = document.getElementById('pwToggle');
  const show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  btn.textContent = show ? '🙈' : '👁';
}

function setStatus(state, msg) {
  const el = document.getElementById('status');
  el.className = 'status visible ' + state;
  el.textContent = msg;
}
function clearStatus() { document.getElementById('status').className = 'status'; }

function showForgot() {
  clearStatus();
  document.getElementById('loginForm').style.display = 'none';
  document.getElementById('forgotForm').style.display = 'block';
  document.getElementById('footLink').style.display = 'none';
  document.getElementById('formTitle').textContent = 'Recupera tu contraseña';
  document.getElementById('formSub').textContent = 'Te enviamos un enlace a tu correo para crear una nueva contraseña.';
}
function showLogin() {
  clearStatus();
  document.getElementById('loginForm').style.display = 'block';
  document.getElementById('forgotForm').style.display = 'none';
  document.getElementById('footLink').style.display = 'block';
  document.getElementById('formTitle').textContent = 'Ingresa a tu taller';
  document.getElementById('formSub').textContent = 'Órdenes de servicio, clientes, inventario y caja de tu taller de motos.';
}

async function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('btnLogin');
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  btn.disabled = true;
  setStatus('loading', 'Ingresando...');

  try {
    const sb = await initSupabase();
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw error;

    const { data: equipo } = await sb.from('taller_equipo')
      .select('taller_id').eq('auth_id', data.user.id).eq('activo', true).limit(1);
    window.location.href = (equipo && equipo.length) ? '/mi-taller.html' : '/registro-taller.html';
  } catch (err) {
    setStatus('error', err.message === 'Invalid login credentials'
      ? 'Email o contraseña incorrectos.'
      : (err.message || 'Error al iniciar sesión.'));
    btn.disabled = false;
  }
}

async function handleForgot(e) {
  e.preventDefault();
  const btn = document.getElementById('btnForgot');
  const email = document.getElementById('forgotEmail').value.trim();

  btn.disabled = true;
  setStatus('loading', 'Enviando enlace...');

  try {
    const sb = await initSupabase();
    const { error } = await sb.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/reset-password.html'
    });
    if (error) throw error;
    setStatus('success', 'Listo. Revisa tu correo (y la carpeta de spam) para el enlace de recuperación.');
    btn.disabled = false;
  } catch (err) {
    setStatus('error', err.message || 'No se pudo enviar el enlace. Intenta de nuevo.');
    btn.disabled = false;
  }
}
</script>
</body>
</html>
