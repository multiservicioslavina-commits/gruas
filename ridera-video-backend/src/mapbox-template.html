<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>RIDERA render</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css" rel="stylesheet" />
<script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1080px; background: #000; font-family: 'Arial Black', Arial, sans-serif; overflow: hidden; }
  #map { position: absolute; inset: 0; width: 1080px; height: 1080px; }

  #vignette {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.55) 100%);
  }

  /* HUD superior */
  #rideNameBar {
    position: absolute; top: 0; left: 0; right: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,0.85) 0%, transparent 100%);
    padding: 30px 40px 40px;
    opacity: 0;
  }
  #rideNameBar.show { opacity: 1; }
  #rideNameText { font-size: 28px; font-weight: 900; color: #fff; letter-spacing: 4px; text-transform: uppercase; text-shadow: 0 2px 12px rgba(0,0,0,0.9); }
  #rideBrand { font-size: 14px; color: #E85D20; letter-spacing: 8px; font-weight: 700; margin-bottom: 6px; }

  /* HUD inferior distancia */
  #hudBar {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 100%);
    padding: 40px 40px 30px;
    display: flex; align-items: flex-end; justify-content: space-between;
    opacity: 0;
  }
  #hudBar.show { opacity: 1; }
  #hudKm { font-size: 64px; font-weight: 900; color: #E85D20; text-shadow: 0 0 30px rgba(232,93,32,0.7); line-height: 1; }
  #hudKmLabel { font-size: 13px; color: #ccc; letter-spacing: 4px; margin-top: -2px; }
  #hudSpeed { font-size: 38px; font-weight: 700; color: #fff; text-align: right; line-height: 1; }
  #hudSpeedLabel { font-size: 13px; color: #aaa; letter-spacing: 4px; text-align: right; }

  /* INTRO */
  #intro {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    opacity: 0;
  }
  #intro.show { opacity: 1; }
  #introLogo { font-size: 96px; font-weight: 900; color: #E85D20; letter-spacing: 8px; text-shadow: 0 0 80px rgba(232,93,32,0.9); }
  #introSub { font-size: 24px; letter-spacing: 18px; color: #fff; font-weight: 300; margin-top: 8px; }
  #introName { font-size: 34px; font-weight: 700; color: #fff; margin-top: 40px; letter-spacing: 2px; text-align: center; max-width: 900px; line-height: 1.3; }
  #introLine { width: 90px; height: 4px; background: #E85D20; margin: 24px auto; }

  /* STATS */
  #statsPanel {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.65);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    opacity: 0; gap: 0;
  }
  #statsPanel.show { opacity: 1; }
  #statsTitle { font-size: 15px; letter-spacing: 10px; color: #E85D20; font-weight: 700; margin-bottom: 36px; }
  .stat-row { display: flex; gap: 24px; }
  .stat-box { background: rgba(255,255,255,0.07); border: 1px solid rgba(232,93,32,0.5); border-radius: 20px; padding: 26px 40px; text-align: center; min-width: 180px; }
  .stat-val { font-size: 52px; font-weight: 900; color: #E85D20; }
  .stat-lbl { font-size: 12px; letter-spacing: 5px; color: #aaa; text-transform: uppercase; margin-top: 6px; }

  /* TARJETA DE FOTO */
  #photoCard {
    position: absolute; bottom: 0; left: 0; right: 0; height: 340px;
    background: linear-gradient(to top, rgba(0,0,0,0.97) 70%, rgba(0,0,0,0.8) 100%);
    display: flex; align-items: center; gap: 24px; padding: 20px 28px;
    transform: translateY(100%);
    border-top: 2px solid rgba(232,93,32,0.7);
  }
  #photoCard.show { transform: translateY(0); }
  #photoThumb {
    width: 280px; height: 296px; object-fit: cover;
    border-radius: 18px; border: 2px solid #E85D20;
    box-shadow: 0 0 40px rgba(232,93,32,0.6), 0 10px 40px rgba(0,0,0,0.8);
    flex-shrink: 0;
  }
  #photoInfo { display: flex; flex-direction: column; gap: 14px; }
  #photoCounter { font-size: 13px; letter-spacing: 5px; color: #E85D20; font-weight: 700; }
  #photoLocationLabel {
    font-size: 16px; color: #fff; font-weight: 600; line-height: 1.4;
    display: flex; align-items: center; gap: 10px;
  }
  #photoLocationLabel span { font-size: 22px; }
  #photoMapHint { font-size: 13px; color: #888; letter-spacing: 1px; margin-top: 4px; }

  /* INICIO / FINAL — insignias ancladas al mapa */
  .geoBadge {
    position: absolute; transform: translate(-50%, -130%);
    padding: 6px 14px; border-radius: 20px;
    font-size: 15px; font-weight: 900; letter-spacing: 2px;
    color: #fff; white-space: nowrap;
    box-shadow: 0 4px 16px rgba(0,0,0,0.6);
    display: none;
  }
  .geoBadge::after {
    content: ''; position: absolute; left: 50%; bottom: -7px;
    transform: translateX(-50%);
    border: 7px solid transparent; border-bottom: none;
  }
  #startBadge { background: #1DA84C; }
  #startBadge::after { border-top-color: #1DA84C; }
  #endBadge { background: #C0272D; }
  #endBadge::after { border-top-color: #C0272D; }

  /* Subtítulo desde→hasta en la intro */
  #introRoute { font-size: 17px; color: #E8B84B; letter-spacing: 3px; font-weight: 700; margin-top: 10px; }

  /* SELLO DE MUNICIPIO — estampa de pasaporte al pasar por un pueblo */
  #stampChip {
    position: absolute; top: 200px; left: 36px;
    background: rgba(10, 8, 6, 0.82);
    border: 3px dashed #E8B84B;
    border-radius: 14px;
    padding: 14px 22px;
    transform: rotate(-4deg) scale(0);
    opacity: 0;
    box-shadow: 0 0 40px rgba(232, 184, 75, 0.35), 0 8px 30px rgba(0,0,0,0.6);
  }
  #stampTitle { font-size: 11px; letter-spacing: 5px; color: #E8B84B; font-weight: 700; }
  #stampName  { font-size: 30px; font-weight: 900; color: #fff; letter-spacing: 2px; text-transform: uppercase; margin: 2px 0; }
  #stampPts   { font-size: 14px; color: #E8B84B; font-weight: 700; letter-spacing: 2px; }

  /* PERFIL DE ELEVACIÓN */
  #elevBar {
    position: absolute; bottom: 0; left: 0; right: 0; height: 100px;
    display: none; pointer-events: none;
  }
  #elevBar.show { display: block; }

  /* PANEL DE RIDERS DEL GRUPO */
  #groupPanel {
    position: absolute; top: 130px; right: 30px;
    display: none; flex-direction: column; gap: 8px;
    pointer-events: none;
  }
  #groupPanel.show { display: flex; }
  .riderChip {
    display: flex; align-items: center; gap: 8px;
    background: rgba(0,0,0,0.65); border-radius: 20px;
    padding: 5px 12px 5px 8px;
    border-left: 3px solid currentColor;
  }
  .riderDot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .riderName { font-size: 12px; color: #fff; letter-spacing: 1px; font-weight: 700; }

  /* OUTRO */
  #outro {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    opacity: 0;
  }
  #outro.show { opacity: 1; }
  #outroLogo { font-size: 76px; font-weight: 900; color: #E85D20; letter-spacing: 7px; text-shadow: 0 0 60px rgba(232,93,32,0.8); }
  #outroSub { font-size: 20px; letter-spacing: 14px; color: #fff; margin-top: 12px; }
  #outroLine { width: 70px; height: 4px; background: #E85D20; margin: 20px auto; }
  #outroTagline { font-size: 14px; color: #888; letter-spacing: 5px; }
</style>
</head>
<body>
  <div id="map"></div>
  <div id="vignette"></div>

  <div id="rideNameBar">
    <div id="rideBrand">🏍 RIDERA AVENTURA</div>
    <div id="rideNameText"></div>
  </div>

  <div id="hudBar">
    <div>
      <div id="hudKm">0.0</div>
      <div id="hudKmLabel">KM RECORRIDOS</div>
    </div>
    <div style="text-align:right">
      <div id="hudSpeed">0</div>
      <div id="hudSpeedLabel">KM/H MÁXIMA</div>
    </div>
  </div>

  <div id="intro" class="show">
    <div id="introLogo">RIDERA</div>
    <div id="introSub">AVENTURA</div>
    <div id="introLine"></div>
    <div id="introName"></div>
    <div id="introRoute"></div>
  </div>

  <div id="startBadge" class="geoBadge">🏁 INICIO</div>
  <div id="endBadge" class="geoBadge">🏁 FINAL</div>

  <div id="statsPanel">
    <div id="statsTitle">RESUMEN DE LA RODADA</div>
    <div class="stat-row">
      <div class="stat-box"><div class="stat-val" id="sv-dist">—</div><div class="stat-lbl">Distancia</div></div>
      <div class="stat-box"><div class="stat-val" id="sv-time">—</div><div class="stat-lbl">Tiempo</div></div>
      <div class="stat-box"><div class="stat-val" id="sv-spd">—</div><div class="stat-lbl">Vel. Máx</div></div>
    </div>
  </div>

  <div id="photoCard">
    <img id="photoThumb" src="" crossorigin="anonymous" />
    <div id="photoInfo">
      <div id="photoCounter">📷 FOTO 1 DE 1</div>
      <div id="photoLocationLabel"><span>📍</span><span id="photoLocationText">Ubicación en el mapa ↑</span></div>
      <div id="photoMapHint">El punto naranja muestra dónde fue tomada</div>
    </div>
  </div>

  <div id="stampChip">
    <div id="stampTitle">🏍 SELLO PASAPORTE RIDERA</div>
    <div id="stampName"></div>
    <div id="stampPts"></div>
  </div>

  <div id="elevBar">
    <canvas id="elevCanvas" width="1080" height="100" style="width:1080px;height:100px;display:block"></canvas>
  </div>

  <div id="groupPanel"></div>

  <div id="outro">
    <div id="outroLogo">RIDERA</div>
    <div id="outroLine"></div>
    <div id="outroSub">AVENTURA</div>
    <div id="outroTagline">GRACIAS POR RODAR</div>
  </div>

<script>
  const DATA = __RIDE_DATA__;
  mapboxgl.accessToken = '__MAPBOX_TOKEN__';

  // ── Tiempos de secciones (segundos) ──────────────────────────────────
  // T_ROUTE adaptativo: una vuelta de 5km no necesita 40s de sobrevuelo —
  // menos segundos = menos frames = render más rápido y menos riesgo de OOM.
  const _km = parseFloat(DATA.distanceKm) || 0;
  const T_INTRO  = 4.0;
  const T_ROUTE  = _km < 8 ? 22.0 : _km < 25 ? 32.0 : 40.0;
  const T_PHOTO  = 3.0;
  const T_STATS  = 6.0;
  const T_OUTRO  = 4.0;

  const photos    = [];
  const photoCount = 0;
  const totalSeconds = T_INTRO + T_ROUTE + T_STATS + T_OUTRO;
  window.__totalSeconds = totalSeconds;

  const coords = DATA.routePoints.map(p => [p.lon, p.lat]);
  const bounds = coords.reduce(
    (b, c) => b.extend(c),
    new mapboxgl.LngLatBounds(coords[0], coords[0])
  );
  const centerLng = (bounds.getWest() + bounds.getEast()) / 2;
  const centerLat = (bounds.getSouth() + bounds.getNorth()) / 2;
  const photosWithGps = photos.filter(p => p.lat && p.lon);

  // ── Helpers de UI ─────────────────────────────────────────────────────
  const show  = id => document.getElementById(id).classList.add('show');
  const hide  = id => document.getElementById(id).classList.remove('show');
  const setOp = (id, v) => { document.getElementById(id).style.opacity = v; };
  const setTr = (id, v) => { document.getElementById(id).style.transform = v; };

  // ── Geodesia (sin dependencias): distancias y puntos sobre la ruta ────
  const R_EARTH = 6371000;
  const rad = d => d * Math.PI / 180;
  const deg = r => r * 180 / Math.PI;

  function haversine(a, b) {
    const dLat = rad(b[1] - a[1]);
    const dLng = rad(b[0] - a[0]);
    const s = Math.sin(dLat/2)**2 + Math.cos(rad(a[1])) * Math.cos(rad(b[1])) * Math.sin(dLng/2)**2;
    return 2 * R_EARTH * Math.asin(Math.sqrt(s));
  }

  // Punto destino desde origen con bearing (grados) y distancia (m)
  function destination(origin, bearingDeg, distM) {
    const br = rad(bearingDeg);
    const lat1 = rad(origin[1]), lng1 = rad(origin[0]);
    const dr = distM / R_EARTH;
    const lat2 = Math.asin(Math.sin(lat1)*Math.cos(dr) + Math.cos(lat1)*Math.sin(dr)*Math.cos(br));
    const lng2 = lng1 + Math.atan2(Math.sin(br)*Math.sin(dr)*Math.cos(lat1), Math.cos(dr) - Math.sin(lat1)*Math.sin(lat2));
    return [deg(lng2), deg(lat2)];
  }

  // Distancias acumuladas a lo largo de la ruta
  const cumDist = [0];
  for (let i = 1; i < coords.length; i++) {
    cumDist.push(cumDist[i-1] + haversine(coords[i-1], coords[i]));
  }
  const totalDist = cumDist[cumDist.length - 1];

  // Punto interpolado a `dist` metros del inicio de la ruta
  function pointAlong(dist) {
    dist = Math.max(0, Math.min(totalDist, dist));
    let lo = 0, hi = cumDist.length - 1;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (cumDist[mid] < dist) lo = mid + 1; else hi = mid;
    }
    const i = Math.max(1, lo);
    const seg = cumDist[i] - cumDist[i-1] || 1;
    const f = (dist - cumDist[i-1]) / seg;
    const a = coords[i-1], b = coords[i];
    return [a[0] + (b[0]-a[0]) * f, a[1] + (b[1]-a[1]) * f];
  }

  // Bearing (grados) de la dirección de la ruta en `dist` metros
  function bearingAlong(dist) {
    const a = pointAlong(Math.max(0, dist - 40));
    const b = pointAlong(Math.min(totalDist, dist + 40));
    const y = Math.sin(rad(b[0]-a[0])) * Math.cos(rad(b[1]));
    const x = Math.cos(rad(a[1]))*Math.sin(rad(b[1])) - Math.sin(rad(a[1]))*Math.cos(rad(b[1]))*Math.cos(rad(b[0]-a[0]));
    return deg(Math.atan2(y, x));
  }

  function lerpBearing(a, b, t) {
    let d = ((b - a) % 360 + 540) % 360 - 180;
    return a + d * t;
  }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function easeInOut(t) {
    return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  }
  function easeIn(t) { return t * t; }
  function easeOut(t) { return 1 - (1 - t) * (1 - t); }

  // ── Parámetros de la chase cam (estilo Relive) ─────────────────────────
  // La cámara vuela DETRÁS del piloto mirándolo, a altitud real sobre el
  // terreno — no encima de él. Escala con el tamaño de la ruta.
  const CAM_BACK   = Math.min(1200, Math.max(240, totalDist * 0.04));  // m detrás
  const CAM_HEIGHT = Math.min(850,  Math.max(150, totalDist * 0.028)); // m sobre terreno

  // Zoom que encuadra la ruta completa (para intro y contexto)
  const spanDeg = Math.max(
    bounds.getEast() - bounds.getWest(),
    (bounds.getNorth() - bounds.getSouth()) * 1.2
  );
  // Margen reducido (1.1 vs 1.6) para que la ruta llene más el frame.
  // Mínimo zoom 12 para rutas cortas (<3km), 10 para medias, 13 max.
  const rawZoom = Math.log2(360 / (spanDeg * 1.1));
  const totalKm = parseFloat(DATA.distanceKm) || 0;
  const fitZoom = Math.max(totalKm < 3 ? 14 : 12, Math.min(16, rawZoom));

  // Desde / Hasta: municipio más cercano al inicio y al final de la ruta
  function nearestMuni(pt) {
    let best = null, bd = Infinity;
    for (const mu of (DATA.municipios || [])) {
      const d = haversine(pt, [mu.lon, mu.lat]);
      if (d < bd) { bd = d; best = mu; }
    }
    return bd <= 12000 ? best.nombre : null; // ≤12km para tener sentido
  }
  const desdeName = nearestMuni(coords[0]);
  const hastaName = nearestMuni(coords[coords.length - 1]);

  // ── Sellos de municipios (pasaporte Ridera) ────────────────────────────
  // Municipios a ≤3km de la ruta, con el instante t en que el piloto pasa.
  function invEaseInOut(f) {
    return f < 0.5 ? Math.sqrt(f / 2) : 1 - Math.sqrt((1 - f) / 2);
  }
  const STAMP_SHOW = 2.8; // segundos visible cada sello
  const stamps = (DATA.municipios || [])
    .map(mu => {
      let best = Infinity, bestDist = 0;
      for (let i = 0; i < coords.length; i++) {
        const d = haversine(coords[i], [mu.lon, mu.lat]);
        if (d < best) { best = d; bestDist = cumDist[i]; }
      }
      const f = totalDist > 0 ? bestDist / totalDist : 0;
      return { ...mu, offRoute: best, t: T_INTRO + invEaseInOut(f) * T_ROUTE };
    })
    .filter(s => s.offRoute <= 3000)
    .sort((a, b) => a.t - b.t);
  // Evitar solapes: si dos sellos quedan a <STAMP_SHOW, correr el segundo
  for (let i = 1; i < stamps.length; i++) {
    if (stamps[i].t < stamps[i-1].t + STAMP_SHOW + 0.4) {
      stamps[i].t = stamps[i-1].t + STAMP_SHOW + 0.4;
    }
  }

  // ── Iluminación según hora real de la rodada ──────────────────────────
  function getLightPreset(isoStr) {
    if (!isoStr) return 'dawn';
    try {
      const h = new Date(isoStr).getHours();
      if (h >= 5  && h < 8)  return 'dawn';
      if (h >= 8  && h < 17) return 'day';
      if (h >= 17 && h < 20) return 'dusk';
      return 'night';
    } catch { return 'dawn'; }
  }
  const lightPreset = getLightPreset(DATA.rideStartedAt);

  // ── Paleta de colores para riders del grupo ───────────────────────────
  const RIDER_COLORS = ['#FF6B1A','#3B82F6','#10B981','#F59E0B','#EC4899','#8B5CF6','#06B6D4','#EF4444'];
  const groupRiders  = DATA.groupRiders || [];
  // Distancias acumuladas por rider del grupo
  const groupCumDists = groupRiders.map(r => {
    const pts = (r.routePoints || []).map(p => [p.lon, p.lat]);
    if (pts.length < 2) return [];
    const cd = [0];
    for (let i = 1; i < pts.length; i++) cd.push(cd[i-1] + haversine(pts[i-1], pts[i]));
    return cd;
  });

  // ── Cámara dinámica: tiempo → distancia basado en velocidad GPS ───────
  // Construye un mapa t_norm → dist que hace que la cámara vaya más rápido
  // donde el piloto iba rápido y más lento donde iba despacio.
  function buildSpeedTimemap() {
    const speeds = DATA.routePoints.map(p => p.speed_kmh || 0);
    if (speeds.every(s => s === 0)) return null; // sin datos de velocidad
    const weights = [];
    for (let i = 0; i < coords.length - 1; i++) {
      const dist = haversine(coords[i], coords[i+1]);
      // Velocidad promedio del segmento; clamp 15-150 para evitar extremos
      const spd  = Math.max(15, Math.min(150, (speeds[i] + speeds[i+1]) / 2));
      weights.push(dist / spd); // tiempo proporcional a dist/velocidad
    }
    const totalW = weights.reduce((a,b) => a+b, 0) || 1;
    // Tabla: cumDist[i] → tNorm[i]
    const tNorms = [0];
    let acc = 0;
    for (const w of weights) { acc += w / totalW; tNorms.push(acc); }
    return { tNorms, cumDist };
  }
  const speedTimemap = buildSpeedTimemap();

  // Dado t normalizado [0,1], devuelve la distancia recorrida (m)
  function tNormToDist(tNorm) {
    if (!speedTimemap) return tNorm * totalDist;
    const { tNorms, cumDist: cd } = speedTimemap;
    tNorm = Math.max(0, Math.min(1, tNorm));
    let lo = 0, hi = tNorms.length - 1;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (tNorms[mid] < tNorm) lo = mid + 1; else hi = mid;
    }
    const i = Math.max(1, lo);
    const seg = tNorms[i] - tNorms[i-1] || 1;
    const f   = (tNorm - tNorms[i-1]) / seg;
    return cd[i-1] + (cd[i] - cd[i-1]) * f;
  }

  // ── Perfil de elevación: se precomputa tras el idle ───────────────────
  let elevations = [];   // metros por cada punto de la ruta
  const elevCanvas = document.getElementById('elevCanvas');

  function drawElevProfile(riderDist) {
    if (elevations.length < 4) return;
    const ctx  = elevCanvas.getContext('2d');
    const W = elevCanvas.width, H = elevCanvas.height;
    ctx.clearRect(0, 0, W, H);

    const minE = Math.min(...elevations), maxE = Math.max(...elevations);
    const range = maxE - minE || 1;
    const pad = 14;

    const toX = i => (i / (elevations.length - 1)) * (W - 2*pad) + pad;
    const toY = e => H - pad - ((e - minE) / range) * (H - 2.5*pad);

    // Cut idx for rider position
    let cutIdx = 0;
    while (cutIdx < cumDist.length - 1 && cumDist[cutIdx+1] <= riderDist) cutIdx++;
    const riderF = cumDist[cutIdx] < totalDist
      ? (riderDist - cumDist[cutIdx]) / Math.max(1, cumDist[cutIdx+1] - cumDist[cutIdx])
      : 1;
    const riderElevIdx = Math.min(cutIdx + riderF, elevations.length - 1);

    // Fondo gradiente
    const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0, 'rgba(0,0,0,0)');
    bgGrad.addColorStop(1, 'rgba(0,0,0,0.75)');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    // Área ruta completa
    ctx.beginPath();
    ctx.moveTo(toX(0), H);
    elevations.forEach((e, i) => ctx.lineTo(toX(i), toY(e)));
    ctx.lineTo(toX(elevations.length-1), H);
    ctx.closePath();
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    ctx.fill();

    // Línea ruta completa
    ctx.beginPath();
    elevations.forEach((e, i) => i===0 ? ctx.moveTo(toX(i), toY(e)) : ctx.lineTo(toX(i), toY(e)));
    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.lineWidth = 1.5; ctx.stroke();

    // Área recorrida (naranja)
    const cutX = toX(Math.min(riderElevIdx, elevations.length-1));
    const fillGrad = ctx.createLinearGradient(0, 0, 0, H);
    fillGrad.addColorStop(0, 'rgba(232,93,32,0.55)');
    fillGrad.addColorStop(1, 'rgba(232,93,32,0.08)');
    ctx.beginPath();
    ctx.moveTo(toX(0), H);
    elevations.slice(0, Math.ceil(riderElevIdx) + 1).forEach((e, i) => ctx.lineTo(toX(i), toY(e)));
    ctx.lineTo(cutX, H);
    ctx.closePath();
    ctx.fillStyle = fillGrad;
    ctx.fill();

    // Línea recorrida (naranja)
    ctx.beginPath();
    elevations.slice(0, Math.ceil(riderElevIdx) + 1)
      .forEach((e, i) => i===0 ? ctx.moveTo(toX(i), toY(e)) : ctx.lineTo(toX(i), toY(e)));
    ctx.strokeStyle = '#FF6B1A'; ctx.lineWidth = 2.5; ctx.stroke();

    // Dot rider
    const rx = cutX;
    const ry = toY(elevations[Math.min(Math.round(riderElevIdx), elevations.length-1)]);
    ctx.beginPath();
    ctx.arc(rx, ry, 5, 0, Math.PI*2);
    ctx.fillStyle = '#FF6B1A'; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();

    // Altitud actual
    const curElev = Math.round(elevations[Math.min(Math.round(riderElevIdx), elevations.length-1)]);
    ctx.fillStyle = 'rgba(255,107,26,0.95)';
    ctx.font = 'bold 11px Arial';
    const label = `${curElev} m`;
    const lx = Math.min(rx + 8, W - 45);
    ctx.fillText(label, lx, ry - 6);
  }

  // ── Estado del mapa ────────────────────────────────────────────────────
  let mapReady = false;
  let currentBearing = bearingAlong(0);
  let smCamPos = null;
  let smCamAlt = null;

  const map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/standard-satellite',
    // Apagar labels del basemap DESDE la construcción (no solo tras load): así
    // el error "glyphs > 65535 not supported" nunca se dispara, ni durante el
    // preload. Verificado: standard-satellite soporta estas props (docs Mapbox).
    config: { basemap: {
      lightPreset,
      showPlaceLabels: false,
      showRoadLabels: false,
      showPointOfInterestLabels: false,
      showTransitLabels: false,
    } },
    center: [centerLng, centerLat],
    zoom: 12, pitch: 60, bearing: 30,
    antialias: true, fadeDuration: 0,
    interactive: false, preserveDrawingBuffer: true,
    maxTileCacheSize: 15,  // limitar caché agresivamente para no OOM en Railway
  });

  // Errores del mapa (token inválido, teselas) → visibles en logs del server
  map.on('error', e => console.error('MAPBOX ERROR:', e?.error?.message || e));

  map.on('load', async () => {
    document.getElementById('introName').textContent  = DATA.rideName || '';
    document.getElementById('rideNameText').textContent = DATA.rideName || '';
    if (desdeName || hastaName) {
      document.getElementById('introRoute').textContent =
        `${desdeName || 'Salida'}  →  ${hastaName || 'Llegada'}`;
    }

    // Apagar TODAS las etiquetas del basemap del estilo Standard. En Standard v3
    // las labels NO están en getStyle().layers (viven dentro del import 'basemap'),
    // por eso setLayoutProperty NO las tocaba y el error "glyphs > 65535 not
    // supported" seguía disparándose frame a frame (rendes de texto = memoria).
    // La API correcta es setConfigProperty('basemap', ...).
    try {
      map.setConfigProperty('basemap', 'showPlaceLabels', false);
      map.setConfigProperty('basemap', 'showRoadLabels', false);
      map.setConfigProperty('basemap', 'showPointOfInterestLabels', false);
      map.setConfigProperty('basemap', 'showTransitLabels', false);
    } catch (e) { console.log('hide basemap labels:', e.message); }

    // Terreno 3D con exageración alta
    map.addSource('mapbox-dem', {
      type: 'raster-dem', url: 'mapbox://mapbox.mapbox-terrain-dem-v1',
      tileSize: 512, maxzoom: 14,
    });
    // 1.6: relieve notorio sin deformar — 2.5 volvía irreal el terreno
    // en rutas cortas/urbanas ("mapa flotando en el aire")
    map.setTerrain({ source: 'mapbox-dem', exaggeration: 1.6 });

    // El estilo Standard trae su propia atmósfera/cielo según lightPreset;
    // si por algo no la aplica, este fog es el respaldo (no debe romper).
    try {
      map.setFog({
        range: [0.5, 10],
        color: 'rgba(230, 200, 170, 0.75)',
        'high-color': '#3a5bbf',
        'horizon-blend': 0.08,
        'space-color': '#0b1026',
        'star-intensity': 0.2,
      });
    } catch (e) { console.log('fog no aplicado:', e.message); }

    // ── Heatmap de velocidad: segmentos coloreados por km/h ──────────────
    const speedFeatures = coords.slice(0, -1).map((c, i) => ({
      type: 'Feature',
      properties: { speed: DATA.routePoints[i]?.speed_kmh || 0 },
      geometry: { type: 'LineString', coordinates: [c, coords[i+1]] },
    }));
    const hasSpeedData = speedFeatures.some(f => f.properties.speed > 0);
    map.addSource('speed-heatmap', {
      type: 'geojson',
      data: { type: 'FeatureCollection', features: speedFeatures },
    });

    // ── Sources de riders del grupo ───────────────────────────────────────
    groupRiders.forEach((r, idx) => {
      const rCoords = (r.routePoints || []).map(p => [p.lon, p.lat]);
      const color = RIDER_COLORS[(idx + 1) % RIDER_COLORS.length];
      map.addSource(`group-route-${idx}`, {
        type: 'geojson',
        data: { type: 'Feature', geometry: { type: 'LineString', coordinates: rCoords.length >= 2 ? rCoords : [rCoords[0]||coords[0], rCoords[0]||coords[0]] } },
      });
      map.addSource(`group-live-${idx}`, {
        type: 'geojson',
        data: { type: 'Feature', geometry: { type: 'LineString', coordinates: [rCoords[0]||coords[0], rCoords[0]||coords[0]] } },
      });
      map.addSource(`group-pin-${idx}`, {
        type: 'geojson',
        data: { type: 'Feature', geometry: { type: 'Point', coordinates: rCoords[0]||coords[0] } },
      });
      map.addLayer({ id: `group-trail-${idx}`, type: 'line', source: `group-live-${idx}`,
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: { 'line-color': color, 'line-width': 5, 'line-opacity': 0.75 },
      });
      map.addLayer({ id: `group-dot-${idx}`, type: 'circle', source: `group-pin-${idx}`,
        paint: { 'circle-radius': 9, 'circle-color': color,
          'circle-stroke-width': 2.5, 'circle-stroke-color': '#fff' },
      });
    });

    // Capas de ruta
    map.addSource('route-full', {
      type: 'geojson',
      data: { type: 'Feature', geometry: { type: 'LineString', coordinates: coords } },
    });
    map.addSource('route-live', {
      type: 'geojson',
      data: { type: 'Feature', geometry: { type: 'LineString', coordinates: [coords[0], coords[0]] } },
    });
    map.addSource('pin', {
      type: 'geojson',
      data: { type: 'Feature', geometry: { type: 'Point', coordinates: coords[0] } },
    });
    map.addSource('photo-pins', {
      type: 'geojson',
      data: {
        type: 'FeatureCollection',
        features: photosWithGps.map((p, i) => ({
          type: 'Feature', properties: { index: i },
          geometry: { type: 'Point', coordinates: [p.lon, p.lat] },
        })),
      },
    });
    map.addSource('photo-active', {
      type: 'geojson', data: { type: 'FeatureCollection', features: [] },
    });
    // Municipios con sello en la zona (marcadores dorados)
    map.addSource('stamps', {
      type: 'geojson',
      data: {
        type: 'FeatureCollection',
        features: stamps.map(s => ({
          type: 'Feature', properties: { nombre: s.nombre },
          geometry: { type: 'Point', coordinates: [s.lon, s.lat] },
        })),
      },
    });
    map.addSource('stamp-active', {
      type: 'geojson', data: { type: 'FeatureCollection', features: [] },
    });
    // Puntos de INICIO (verde) y FINAL (rojo) — siempre visibles
    map.addSource('endpoints', {
      type: 'geojson',
      data: {
        type: 'FeatureCollection',
        features: [
          { type: 'Feature', properties: { kind: 'start' },
            geometry: { type: 'Point', coordinates: coords[0] } },
          { type: 'Feature', properties: { kind: 'end' },
            geometry: { type: 'Point', coordinates: coords[coords.length - 1] } },
        ],
      },
    });

    map.addLayer({ id: 'route-full-layer', type: 'line', source: 'route-full',
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': '#ffffff', 'line-width': 4, 'line-opacity': 0.18 },
    });
    map.addLayer({ id: 'route-live-glow', type: 'line', source: 'route-live',
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': '#E85D20', 'line-width': 24, 'line-opacity': 0.28, 'line-blur': 8 },
    });
    map.addLayer({ id: 'route-live-layer', type: 'line', source: 'route-live',
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': '#FF6B1A', 'line-width': 8, 'line-opacity': 1 },
    });
    map.addLayer({ id: 'pin-halo', type: 'circle', source: 'pin',
      paint: { 'circle-radius': 28, 'circle-color': '#E85D20', 'circle-opacity': 0.3 },
    });
    map.addLayer({ id: 'pin-dot', type: 'circle', source: 'pin',
      paint: { 'circle-radius': 12, 'circle-color': '#fff',
        'circle-stroke-width': 4, 'circle-stroke-color': '#E85D20' },
    });
    map.addLayer({ id: 'photo-pins-halo', type: 'circle', source: 'photo-pins',
      paint: { 'circle-radius': 18, 'circle-color': '#fff', 'circle-opacity': 0.12 },
    });
    map.addLayer({ id: 'photo-pins-dot', type: 'circle', source: 'photo-pins',
      paint: { 'circle-radius': 8, 'circle-color': '#fff',
        'circle-stroke-width': 2.5, 'circle-stroke-color': '#E85D20', 'circle-opacity': 0.85 },
    });
    map.addLayer({ id: 'endpoints-halo', type: 'circle', source: 'endpoints',
      paint: { 'circle-radius': 18,
        'circle-color': ['match', ['get','kind'], 'start', '#1DA84C', '#C0272D'],
        'circle-opacity': 0.3 },
    });
    map.addLayer({ id: 'endpoints-dot', type: 'circle', source: 'endpoints',
      paint: { 'circle-radius': 9,
        'circle-color': ['match', ['get','kind'], 'start', '#1DA84C', '#C0272D'],
        'circle-stroke-width': 3, 'circle-stroke-color': '#fff' },
    });

    // Marcadores dorados de municipios con sello
    map.addLayer({ id: 'stamps-halo', type: 'circle', source: 'stamps',
      paint: { 'circle-radius': 16, 'circle-color': '#E8B84B', 'circle-opacity': 0.2 },
    });
    map.addLayer({ id: 'stamps-dot', type: 'circle', source: 'stamps',
      paint: { 'circle-radius': 7, 'circle-color': '#E8B84B',
        'circle-stroke-width': 2, 'circle-stroke-color': '#fff', 'circle-opacity': 0.95 },
    });
    map.addLayer({ id: 'stamp-active-ring', type: 'circle', source: 'stamp-active',
      paint: { 'circle-radius': 32, 'circle-color': '#E8B84B', 'circle-opacity': 0.45 },
    });
    map.addLayer({ id: 'stamp-active-dot', type: 'circle', source: 'stamp-active',
      paint: { 'circle-radius': 13, 'circle-color': '#E8B84B',
        'circle-stroke-width': 4, 'circle-stroke-color': '#fff' },
    });

    map.addLayer({ id: 'photo-active-ring', type: 'circle', source: 'photo-active',
      paint: { 'circle-radius': 36, 'circle-color': '#E85D20', 'circle-opacity': 0.45 },
    });
    map.addLayer({ id: 'photo-active-dot', type: 'circle', source: 'photo-active',
      paint: { 'circle-radius': 16, 'circle-color': '#E85D20',
        'circle-stroke-width': 4, 'circle-stroke-color': '#fff' },
    });

    // ── Heatmap de velocidad — DESACTIVADO ───────────────────────────────
    // El usuario quiere UNA sola línea limpia (como su referencia), no un
    // arcoíris multicolor sobre la ruta. Se deja el código por si algún día
    // se quiere reactivar, pero no se dibuja.
    if (false) {
      map.addLayer({ id: 'speed-heatmap-layer', type: 'line', source: 'speed-heatmap',
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: {
          'line-width': 6,
          'line-opacity': 0.85,
          'line-color': ['interpolate', ['linear'], ['get', 'speed'],
            0,   '#3B82F6',  // azul   — parado/muy lento
            20,  '#10B981',  // verde  — despacio
            60,  '#F59E0B',  // ámbar  — moderado
            100, '#EF4444',  // rojo   — muy rápido
          ],
        },
      }, 'route-full-layer'); // debajo de la ruta naranja
    }

    // Precarga fotos
    await Promise.all(photos.map(p => new Promise(r => {
      const im = new Image(); im.crossOrigin = 'anonymous';
      im.onload = im.onerror = () => r(); im.src = p.url;
    })));

    // ── Pre-computar elevaciones y marcar escena lista ────────────────────
    // Esperamos idle con timeout: si los tiles de satélite/terreno tardan
    // más de 12s (común en rutas largas desde Railway-US), procedemos igual.
    await new Promise(r => { map.once('idle', r); setTimeout(r, 12000); });
    map.triggerRepaint();
    // Pausa breve para que queryTerrainElevation tenga datos DEM disponibles
    await new Promise(r => setTimeout(r, 2000));

    elevations = coords.map(c => {
      const e = map.queryTerrainElevation(c);
      return (typeof e === 'number' && !isNaN(e)) ? e : 0;
    });
    const nonZero = elevations.filter(e => e > 0).length;
    if (nonZero < coords.length * 0.3) elevations = [];

    // Panel de riders del grupo (se construye una sola vez)
    const panel = document.getElementById('groupPanel');
    [{ name: DATA.rideName || 'Tú', color: RIDER_COLORS[0] }, ...groupRiders.map((r, i) => ({ name: r.name, color: RIDER_COLORS[(i+1)%RIDER_COLORS.length] }))]
      .forEach(r => {
        const chip = document.createElement('div');
        chip.className = 'riderChip';
        chip.style.borderLeftColor = r.color;
        chip.innerHTML = `<div class="riderDot" style="background:${r.color}"></div><div class="riderName">${r.name}</div>`;
        panel.appendChild(chip);
      });

    // Pre-cargar teselas de la ruta: muestrear 5 puntos a lo largo
    const sampleIdxs = [0, 0.5, 1].map(f =>
      Math.min(Math.round(f * (coords.length - 1)), coords.length - 1)
    );
    for (const idx of sampleIdxs) {
      map.jumpTo({ center: coords[idx], zoom: 14.5, pitch: 60, bearing: bearingAlong(cumDist[idx]) });
      await new Promise(r => { map.once('idle', r); setTimeout(r, 1500); });
    }
    // Volver a la vista general
    map.jumpTo({ center: [centerLng, centerLat], zoom: fitZoom, pitch: 45, bearing: 15 });
    await new Promise(r => { map.once('idle', r); setTimeout(r, 1500); });

    map.triggerRepaint();
    mapReady = true;
    window.__ready = true;
    window.__onReady && window.__onReady();
  });

  // ── seekTo(t): lleva el estado de la escena al segundo t ─────────────
  // Retorna Promise que resuelve cuando el mapa ha renderizado el frame.
  window.__seekTo = async function(t) {
    if (!mapReady) return;
    t = Math.max(0, Math.min(totalSeconds, t));

    const totalKm = parseFloat(DATA.distanceKm) || 0;

    // Reset del sello: solo la sección de ruta lo puede mostrar
    const stampChipEl = document.getElementById('stampChip');
    stampChipEl.style.opacity = 0;
    stampChipEl.style.transform = 'rotate(-4deg) scale(0)';

    // Insignias INICIO/FINAL ancladas al mapa (se posicionan tras mover cámara)
    function placeBadges(show) {
      const sb = document.getElementById('startBadge');
      const eb = document.getElementById('endBadge');
      if (!show) { sb.style.display = 'none'; eb.style.display = 'none'; return; }
      const sp = map.project(coords[0]);
      const ep = map.project(coords[coords.length - 1]);
      const inView = p => p.x > -80 && p.x < 1160 && p.y > -40 && p.y < 1120;
      sb.style.display = inView(sp) ? 'block' : 'none';
      sb.style.left = sp.x + 'px'; sb.style.top = sp.y + 'px';
      eb.style.display = inView(ep) ? 'block' : 'none';
      eb.style.left = ep.x + 'px'; eb.style.top = ep.y + 'px';
    }
    let badgesOn = false;

    // ── INTRO [0, T_INTRO) ─────────────────────────────────────────────
    if (t < T_INTRO) {
      const p = t / T_INTRO;
      setOp('intro', Math.min(1, p < 0.1 ? p * 10 : p > 0.85 ? (1-p)*(1/0.15) : 1));
      hide('rideNameBar'); hide('hudBar'); hide('statsPanel'); hide('outro');
      hide('elevBar'); hide('groupPanel');
      setTr('photoCard', 'translateY(100%)');

      // Intro: empieza un poco alejado y hace zoom hacia la ruta.
      const introZoomStart = fitZoom - 1;
      const introZoomEnd = fitZoom + 0.5;
      const zoom = introZoomStart + easeIn(p) * (introZoomEnd - introZoomStart);
      map.jumpTo({ center: [centerLng, centerLat], zoom, bearing: 0, pitch: 0 });
      badgesOn = true;

    // ── RUTA [T_INTRO, T_INTRO+T_ROUTE) ───────────────────────────────
    } else if (t < T_INTRO + T_ROUTE) {
      hide('intro'); hide('statsPanel'); hide('outro');
      setTr('photoCard', 'translateY(100%)');
      show('rideNameBar'); show('hudBar');
      if (elevations.length >= 4) show('elevBar');
      if (groupRiders.length > 0) show('groupPanel');

      const p = (t - T_INTRO) / T_ROUTE;
      const eased = easeInOut(p);

      // Distancia basada en velocidad real GPS (cámara dinámica)
      const riderDist = tNormToDist(eased);
      const rider = pointAlong(riderDist);

      // Ruta parcial dibujada (por distancia)
      let cutIdx = 0;
      while (cutIdx < cumDist.length - 1 && cumDist[cutIdx + 1] <= riderDist) cutIdx++;
      const partial = [...coords.slice(0, cutIdx + 1), rider];
      map.getSource('route-live').setData({ type:'Feature', geometry:{ type:'LineString', coordinates: partial }});
      map.getSource('pin').setData({ type:'Feature', geometry:{ type:'Point', coordinates: rider }});

      // KM y speed en HUD
      document.getElementById('hudKm').textContent = (totalKm * eased).toFixed(1);
      document.getElementById('hudSpeed').textContent = DATA.maxSpeedKmh || '0';

      // ── CÁMARA que sigue al rider con zoom muy cercano ────────────
      const rideZoom = Math.max(15.5, fitZoom + 4);
      const zoomBlend = p < 0.05 ? easeIn(p / 0.05) : p > 0.95 ? 1 - easeIn((p - 0.95) / 0.05) : 1;
      const curZoom = fitZoom + zoomBlend * (rideZoom - fitZoom);
      const cBlend = p < 0.03 ? easeIn(p / 0.03) : p > 0.97 ? 1 - easeIn((p - 0.97) / 0.03) : 1;
      const camLng = centerLng + cBlend * (rider[0] - centerLng);
      const camLat = centerLat + cBlend * (rider[1] - centerLat);
      map.jumpTo({ center: [camLng, camLat], zoom: curZoom, pitch: 45, bearing: bearingAlong(riderDist) });
      badgesOn = true;

      // ── Perfil de elevación animado ───────────────────────────────────
      drawElevProfile(riderDist);

      // ── Riders del grupo: posición simultánea en el mapa ─────────────
      groupRiders.forEach((r, idx) => {
        const rPts = (r.routePoints || []).map(p => [p.lon, p.lat]);
        if (rPts.length < 2) return;
        const rCumDist = groupCumDists[idx];
        const rTotalDist = rCumDist[rCumDist.length - 1];
        const rDist = eased * rTotalDist;
        let rCutIdx = 0;
        while (rCutIdx < rCumDist.length - 1 && rCumDist[rCutIdx+1] <= rDist) rCutIdx++;
        const rFrac = rCumDist[rCutIdx] < rTotalDist
          ? (rDist - rCumDist[rCutIdx]) / (rCumDist[rCutIdx+1] - rCumDist[rCutIdx])
          : 1;
        const ra = rPts[rCutIdx], rb = rPts[Math.min(rCutIdx+1, rPts.length-1)];
        const rRider = [ra[0]+(rb[0]-ra[0])*rFrac, ra[1]+(rb[1]-ra[1])*rFrac];
        const partial = [...rPts.slice(0, rCutIdx+1), rRider];
        map.getSource(`group-live-${idx}`)?.setData({type:'Feature',geometry:{type:'LineString',coordinates:partial}});
        map.getSource(`group-pin-${idx}`)?.setData({type:'Feature',geometry:{type:'Point',coordinates:rRider}});
      });

      // ── SELLO DE MUNICIPIO: estampa al pasar por cada pueblo ─────────
      const stamp = stamps.find(s => t >= s.t && t < s.t + STAMP_SHOW);
      const chip = document.getElementById('stampChip');
      if (stamp) {
        const sp = (t - stamp.t) / STAMP_SHOW;
        // Pop de entrada (rebote), estable, fade de salida
        let scale, op;
        if (sp < 0.15) {
          const k = sp / 0.15;
          scale = 0.4 + easeOut(k) * 0.72;  // llega a 1.12
          op = k;
        } else if (sp < 0.28) {
          scale = 1.12 - ((sp - 0.15) / 0.13) * 0.12; // asienta a 1.0
          op = 1;
        } else if (sp > 0.85) {
          const k = (sp - 0.85) / 0.15;
          scale = 1; op = 1 - k;
        } else {
          scale = 1; op = 1;
        }
        chip.style.transform = `rotate(-4deg) scale(${scale})`;
        chip.style.opacity = op;
        document.getElementById('stampName').textContent = stamp.nombre;
        document.getElementById('stampPts').textContent =
          `${stamp.departamento || stamp.subregion || 'Antioquia'} · +${stamp.puntos_sello || 10} PTS`;
        map.getSource('stamp-active').setData({
          type: 'FeatureCollection',
          features: [{ type: 'Feature', properties: {},
            geometry: { type: 'Point', coordinates: [stamp.lon, stamp.lat] } }],
        });
      } else {
        chip.style.opacity = 0;
        chip.style.transform = 'rotate(-4deg) scale(0)';
        map.getSource('stamp-active').setData({ type: 'FeatureCollection', features: [] });
      }

    // ── FOTOS [T_INTRO+T_ROUTE, T_INTRO+T_ROUTE+photoCount*T_PHOTO) ───
    } else if (t < T_INTRO + T_ROUTE + photoCount * T_PHOTO) {
      hide('intro'); hide('statsPanel'); hide('outro');
      hide('rideNameBar'); hide('hudBar'); hide('elevBar'); hide('groupPanel');

      const photoT = t - T_INTRO - T_ROUTE;
      const photoIdx = Math.floor(photoT / T_PHOTO);
      const photoP   = (photoT % T_PHOTO) / T_PHOTO;
      const photo = photos[photoIdx];
      const hasGps = photo && photo.lat && photo.lon;
      // Sin GPS: anclar la foto a un punto proporcional de la ruta —
      // SIEMPRE hay referencia en el mapa, nunca una vista sin contexto
      const anchor = hasGps
        ? [photo.lon, photo.lat]
        : pointAlong(totalDist * (photoIdx + 1) / (photoCount + 1));

      // Tarjeta: slide in en primer 20%, permanece, slide out en último 15%
      let cardY;
      if (photoP < 0.18) {
        cardY = 100 - easeOut(photoP / 0.18) * 100;
      } else if (photoP > 0.85) {
        cardY = easeIn((photoP - 0.85) / 0.15) * 100;
      } else {
        cardY = 0;
      }
      setTr('photoCard', `translateY(${cardY}%)`);

      document.getElementById('photoThumb').src = photo?.url || '';
      document.getElementById('photoCounter').textContent = `📷 FOTO ${photoIdx + 1} DE ${photoCount}`;
      document.getElementById('photoLocationText').textContent = hasGps
        ? 'Ubicación exacta en el mapa ↑'
        : 'Punto del recorrido en el mapa ↑';

      // El marcador naranja SIEMPRE señala el punto (exacto o del recorrido)
      map.getSource('photo-active').setData({
        type:'FeatureCollection', features:[{
          type:'Feature', properties:{},
          geometry:{ type:'Point', coordinates: anchor }
        }]
      });
      // Mantener TODA la ruta a la vista, plana y sin girar; el marcador
      // naranja señala dónde se tomó la foto. Así el recorrido nunca se pierde
      // y las fotos se ven "en su lugar" sobre la ruta, como pediste.
      map.jumpTo({ center: [centerLng, centerLat], zoom: fitZoom, pitch: 0, bearing: 0 });
      badgesOn = true;

    // ── STATS [T_INTRO+T_ROUTE+photos*T_PHOTO, +T_STATS) ─────────────
    } else if (t < T_INTRO + T_ROUTE + photoCount * T_PHOTO + T_STATS) {
      hide('intro'); hide('rideNameBar'); hide('hudBar'); hide('outro');
      hide('elevBar'); hide('groupPanel');
      setTr('photoCard', 'translateY(100%)');
      map.getSource('photo-active').setData({ type:'FeatureCollection', features:[] });
      show('statsPanel');

      document.getElementById('sv-dist').textContent = (DATA.distanceKm || '0') + ' km';
      document.getElementById('sv-time').textContent = DATA.elapsed || '00:00';
      document.getElementById('sv-spd').textContent  = (DATA.maxSpeedKmh || '0') + ' km/h';

      const p = (t - T_INTRO - T_ROUTE - photoCount * T_PHOTO) / T_STATS;
      const bCenter = [(bounds.getWest()+bounds.getEast())/2, (bounds.getSouth()+bounds.getNorth())/2];
      // Vista plana y quieta con la ruta completa mientras se muestran las cifras.
      map.jumpTo({ center: bCenter, zoom: fitZoom, pitch: 0, bearing: 0 });
      badgesOn = true;

    // ── OUTRO [últimos T_OUTRO segundos] ──────────────────────────────
    } else {
      hide('intro'); hide('rideNameBar'); hide('hudBar'); hide('statsPanel');
      hide('elevBar'); hide('groupPanel');
      setTr('photoCard', 'translateY(100%)');
      show('outro');

      const p = (t - T_INTRO - T_ROUTE - photoCount * T_PHOTO - T_STATS) / T_OUTRO;
      const op = p < 0.15 ? easeIn(p / 0.15) : p > 0.85 ? easeOut((1-p)/0.15) : 1;
      setOp('outro', op);

      const bCenter = [(bounds.getWest()+bounds.getEast())/2, (bounds.getSouth()+bounds.getNorth())/2];
      // Cierre plano y quieto con la ruta completa a la vista.
      map.jumpTo({ center: bCenter, zoom: fitZoom - 0.3 + easeIn(p) * 0.3, pitch: 0, bearing: 0 });
    }

    // Posicionar insignias INICIO/FINAL con la cámara ya movida
    placeBadges(badgesOn);

    // Forzar re-render y esperar a que las teselas estén cargadas.
    // jumpTo siempre dispara 'idle' cuando termina de cargar; el timeout
    // largo es solo red de seguridad para que nunca se cuelgue.
    map.triggerRepaint();
    await new Promise(resolve => {
      map.once('idle', resolve);
      setTimeout(resolve, 800);
    });
  };
</script>
</body>
</html>
