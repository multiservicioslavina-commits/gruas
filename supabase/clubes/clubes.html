<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ridera Clubes · Comunidad de Motociclistas</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue:wght@400;700&family=Barlow+Condensed:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;700&family=DM+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --orange: #E85D20;
      --orange-light: #f07a3a;
      --orange-dark: #c44d18;
      --black: #0a0908;
      --off-black: #0f0f0f;
      --dark-gray: #1a1712;
      --white: #f4f1ed;
      --muted: #e6e3de;
      --muted-dark: #9d9891;
      --accent: #4ade80;
      --display: 'Bebas Neue', sans-serif;
      --condensed: 'Barlow Condensed', sans-serif;
      --body: 'DM Sans', sans-serif;
      --mono: 'DM Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: var(--black);
      color: var(--white);
      font-family: var(--body);
      line-height: 1.6;
      overflow-x: hidden;
    }

    body {
      max-width: 1520px;
      margin: 0 auto;
      padding: 0;
    }

    /* HERO */
    .hero {
      position: relative;
      padding: 6rem 4rem;
      min-height: 400px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      gap: 2rem;
      background: linear-gradient(135deg, #0f0f0f 0%, #1a1712 50%, #0f0f0f 100%);
      border-bottom: 1px solid rgba(232, 93, 32, 0.2);
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 80% 50%, rgba(232,93,32,0.1) 0%, transparent 60%);
      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 600px;
    }

    .hero h1 {
      font-family: var(--display);
      font-size: 4.5rem;
      line-height: 1;
      color: var(--white);
      margin-bottom: 1rem;
      letter-spacing: -2px;
    }

    .hero p {
      font-size: 1.1rem;
      color: var(--muted-dark);
      line-height: 1.8;
    }

    /* FILTERS */
    .filters-section {
      padding: 3rem 4rem;
      background: rgba(15, 15, 15, 0.5);
      border-bottom: 1px solid rgba(232, 93, 32, 0.15);
      backdrop-filter: blur(10px);
    }

    .filters-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .filter-group label {
      font-family: var(--condensed);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--orange);
    }

    .filter-group input,
    .filter-group select {
      background: rgba(232, 93, 32, 0.08);
      border: 1px solid rgba(232, 93, 32, 0.3);
      color: var(--white);
      padding: 0.75rem 1rem;
      border-radius: 6px;
      font-family: var(--body);
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .filter-group input:focus,
    .filter-group select:focus {
      outline: none;
      border-color: var(--orange);
      background: rgba(232, 93, 32, 0.12);
      box-shadow: 0 0 0 3px rgba(232, 93, 32, 0.1);
    }

    /* CLUBS GRID */
    .clubs-section {
      padding: 4rem;
    }

    .clubs-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3rem;
      gap: 2rem;
    }

    .clubs-count {
      font-family: var(--condensed);
      font-size: 1.2rem;
      color: var(--muted-dark);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .sort-options {
      display: flex;
      gap: 0.75rem;
    }

    .sort-btn {
      padding: 0.6rem 1.2rem;
      background: transparent;
      border: 1px solid rgba(232, 93, 32, 0.3);
      color: var(--muted-dark);
      cursor: pointer;
      border-radius: 4px;
      font-family: var(--condensed);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      transition: all 0.2s ease;
    }

    .sort-btn:hover,
    .sort-btn.active {
      border-color: var(--orange);
      color: var(--orange);
      background: rgba(232, 93, 32, 0.1);
    }

    .clubs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 2rem;
      margin-bottom: 3rem;
    }

    .club-card {
      position: relative;
      background: linear-gradient(135deg, rgba(26, 23, 18, 0.8) 0%, rgba(15, 15, 15, 0.9) 100%);
      border: 1px solid rgba(232, 93, 32, 0.2);
      border-radius: 12px;
      padding: 1.5rem;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
    }

    .club-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top right, rgba(232,93,32,0.1), transparent 70%);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .club-card:hover {
      border-color: var(--orange);
      background: linear-gradient(135deg, rgba(26, 23, 18, 1) 0%, rgba(15, 15, 15, 1) 100%);
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(232, 93, 32, 0.15);
    }

    .club-card:hover::before {
      opacity: 1;
    }

    .club-header {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
    }

    .club-avatar {
      width: 60px;
      height: 60px;
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(232,93,32,0.25), rgba(232,93,32,0.1));
      border: 1px solid rgba(232,93,32,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      flex-shrink: 0;
    }

    .club-info h3 {
      font-family: var(--display);
      font-size: 1.5rem;
      color: var(--white);
      margin-bottom: 0.25rem;
    }

    .club-category {
      display: inline-block;
      padding: 0.3rem 0.8rem;
      background: rgba(232, 93, 32, 0.15);
      border: 1px solid rgba(232, 93, 32, 0.3);
      border-radius: 4px;
      font-family: var(--condensed);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--orange);
    }

    .club-location {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--muted-dark);
      font-size: 0.9rem;
      margin-top: 0.5rem;
    }

    .club-description {
      color: var(--muted-dark);
      font-size: 0.95rem;
      line-height: 1.6;
      flex-grow: 1;
    }

    .club-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      padding: 1rem;
      background: rgba(232, 93, 32, 0.05);
      border-radius: 8px;
    }

    .stat {
      text-align: center;
    }

    .stat-value {
      font-family: var(--condensed);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--orange);
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--muted-dark);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 0.25rem;
    }

    .club-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 1rem;
      border-top: 1px solid rgba(232, 93, 32, 0.1);
    }

    .club-brands {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .brand-tag {
      padding: 0.2rem 0.6rem;
      background: rgba(232, 93, 32, 0.1);
      border: 1px solid rgba(232, 93, 32, 0.2);
      border-radius: 3px;
      font-size: 0.7rem;
      color: var(--muted-dark);
    }

    .club-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--orange);
      font-family: var(--condensed);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      transition: all 0.2s ease;
    }

    .club-link:hover {
      gap: 0.75rem;
    }

    /* LOADING & EMPTY STATES */
    .loading-spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(232, 93, 32, 0.3);
      border-top-color: var(--orange);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--muted-dark);
    }

    .empty-state p {
      margin-bottom: 1rem;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .hero {
        padding: 3rem 1.5rem;
      }

      .hero h1 {
        font-size: 2.5rem;
      }

      .filters-section,
      .clubs-section {
        padding: 2rem 1.5rem;
      }

      .clubs-grid {
        grid-template-columns: 1fr;
      }

      .filters-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <!-- HERO -->
  <section class="hero">
    <div class="hero-content">
      <h1>Ridera Clubes</h1>
      <p>Descubre la comunidad de motociclistas que comparten tu pasión. Encuentra el club perfecto para conectar, aprender y explorar juntos.</p>
    </div>
  </section>

  <!-- FILTERS -->
  <section class="filters-section">
    <div class="filters-grid">
      <div class="filter-group">
        <label for="searchInput">Buscar club</label>
        <input type="text" id="searchInput" placeholder="Nombre o ubicación...">
      </div>
      <div class="filter-group">
        <label for="categoryFilter">Categoría</label>
        <select id="categoryFilter">
          <option value="">Todas las categorías</option>
          <option value="Touring">Touring</option>
          <option value="Cruiser">Cruiser</option>
          <option value="Enduro">Enduro</option>
          <option value="Sport">Sport</option>
          <option value="Adventure">Adventure</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="regionFilter">Región</label>
        <select id="regionFilter">
          <option value="">Todas las regiones</option>
          <option value="Metropolitana">Metropolitana</option>
          <option value="Oriente">Oriente</option>
          <option value="Occidente">Occidente</option>
          <option value="Valle">Valle de Aburrá</option>
        </select>
      </div>
    </div>

    <div class="clubs-header">
      <div class="clubs-count">
        <span id="clubsFound">0</span> clubes encontrados
      </div>
      <div class="sort-options">
        <button class="sort-btn active" data-sort="featured">Destacados</button>
        <button class="sort-btn" data-sort="members">Miembros</button>
        <button class="sort-btn" data-sort="founded">Antiguedad</button>
      </div>
    </div>
  </section>

  <!-- CLUBS GRID -->
  <section class="clubs-section">
    <div id="loadingState" style="display: none; text-align: center; padding: 4rem 2rem;">
      <div class="loading-spinner" style="margin: 0 auto 1rem;"></div>
      <p>Cargando clubes...</p>
    </div>

    <div id="clubsGrid" class="clubs-grid"></div>

    <div id="emptyState" class="empty-state" style="display: none;">
      <p>No se encontraron clubes que coincidan con tu búsqueda.</p>
      <p style="font-size: 0.9rem; color: var(--muted);">Intenta cambiar los filtros.</p>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Supabase config
    const SUPABASE_URL = "https://vzzxsdtsaahhzyctvmhx.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_r1ImtuUXs1zM02OgwserGQ_F7R26Niu";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allClubs = [];
    let filteredClubs = [];

    // DOM elements
    const clubsGrid = document.getElementById('clubsGrid');
    const loadingState = document.getElementById('loadingState');
    const emptyState = document.getElementById('emptyState');
    const clubsFound = document.getElementById('clubsFound');
    const searchInput = document.getElementById('searchInput');
    const categoryFilter = document.getElementById('categoryFilter');
    const regionFilter = document.getElementById('regionFilter');
    const sortBtns = document.querySelectorAll('.sort-btn');

    // Initialize
    async function init() {
      loadingState.style.display = 'block';
      await loadClubs();
      setupEventListeners();
    }

    async function loadClubs() {
      try {
        const { data, error } = await supabase
          .from('clubs')
          .select('*')
          .eq('active', true)
          .order('featured', { ascending: false })
          .order('founded_year', { ascending: false });

        if (error) throw error;

        allClubs = data || [];
        filteredClubs = [...allClubs];
        renderClubs();
      } catch (error) {
        console.error('Error loading clubs:', error);
        emptyState.style.display = 'block';
        emptyState.querySelector('p').textContent = 'Error al cargar los clubes. Intenta más tarde.';
      } finally {
        loadingState.style.display = 'none';
      }
    }

    function setupEventListeners() {
      searchInput.addEventListener('input', filterClubs);
      categoryFilter.addEventListener('change', filterClubs);
      regionFilter.addEventListener('change', filterClubs);
      sortBtns.forEach(btn => btn.addEventListener('click', (e) => {
        sortBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        sortClubs(btn.dataset.sort);
      }));
    }

    function filterClubs() {
      const search = searchInput.value.toLowerCase();
      const category = categoryFilter.value;
      const region = regionFilter.value;

      filteredClubs = allClubs.filter(club => {
        const matchSearch = !search ||
          club.name.toLowerCase().includes(search) ||
          club.city?.toLowerCase().includes(search) ||
          club.state?.toLowerCase().includes(search);

        const matchCategory = !category || club.category === category;
        const matchRegion = !region || club.region === region;

        return matchSearch && matchCategory && matchRegion;
      });

      renderClubs();
    }

    function sortClubs(sortType) {
      switch(sortType) {
        case 'members':
          filteredClubs.sort((a, b) => (b.members_count || 0) - (a.members_count || 0));
          break;
        case 'founded':
          filteredClubs.sort((a, b) => (b.founded_year || 0) - (a.founded_year || 0));
          break;
        case 'featured':
        default:
          filteredClubs.sort((a, b) => {
            if (a.featured === b.featured) {
              return (b.founded_year || 0) - (a.founded_year || 0);
            }
            return a.featured ? -1 : 1;
          });
      }
      renderClubs();
    }

    function renderClubs() {
      clubsFound.textContent = filteredClubs.length;

      if (filteredClubs.length === 0) {
        clubsGrid.style.display = 'none';
        emptyState.style.display = 'block';
        return;
      }

      clubsGrid.style.display = 'grid';
      emptyState.style.display = 'none';

      clubsGrid.innerHTML = filteredClubs.map(club => `
        <a href="/supabase/clubes/${club.slug}.html" class="club-card" data-club-id="${club.id}">
          <div class="club-header">
            <div class="club-avatar">${club.avatar_emoji || '🏍'}</div>
            <div class="club-info">
              <h3>${club.name}</h3>
              <span class="club-category">${club.category}</span>
              <div class="club-location">
                📍 ${club.city}, ${club.state}
              </div>
            </div>
          </div>

          <p class="club-description">${club.description || 'Comunidad de motociclistas'}</p>

          <div class="club-stats">
            <div class="stat">
              <div class="stat-value">${club.members_count || 0}</div>
              <div class="stat-label">Miembros</div>
            </div>
            <div class="stat">
              <div class="stat-value">${club.routes_completed || 0}</div>
              <div class="stat-label">Rutas</div>
            </div>
            <div class="stat">
              <div class="stat-value">${club.founded_year || '—'}</div>
              <div class="stat-label">Fundado</div>
            </div>
          </div>

          ${club.motorcycle_brands && club.motorcycle_brands.length > 0 ? `
            <div class="club-footer">
              <div class="club-brands">
                ${club.motorcycle_brands.slice(0, 3).map(brand => `<span class="brand-tag">${brand}</span>`).join('')}
                ${club.motorcycle_brands.length > 3 ? `<span class="brand-tag">+${club.motorcycle_brands.length - 3}</span>` : ''}
              </div>
              <span class="club-link">Ver club →</span>
            </div>
          ` : `
            <div class="club-footer">
              <span class="club-link">Ver club →</span>
            </div>
          `}
        </a>
      `).join('');
    }

    // Start
    init();
  </script>
</body>
</html>
