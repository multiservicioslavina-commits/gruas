<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Promoción — Ridera</title>
<meta name="description" id="pageDesc" content="Promoción de un almacén Ridera">
<meta property="og:type" content="website">
<meta property="og:title" id="ogTitle" content="Promoción — Ridera">
<meta property="og:description" id="ogDesc" content="">
<meta property="og:image" id="ogImage" content="">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --orange:#E85D20; --orange-hot:#FF6B2B;
  --carbon:#0D0F12; --carbon2:#141720; --carbon3:#1E2229;
  --text-muted:rgba(255,255,255,0.82); --text-dim:rgba(255,255,255,0.48);
  --border:rgba(255,255,255,0.07); --border-hi:rgba(255,255,255,0.13);
}
body{font-family:'DM Sans',sans-serif;background:var(--carbon);color:#fff;min-height:100vh}
.topbar{background:rgba(13,15,18,0.97);padding:0 24px;height:56px;display:flex;align-items:center;gap:10px;border-bottom:0.5px solid var(--border)}
.topbar strong{color:var(--orange)}
.container{max-width:560px;margin:0 auto;padding:32px 20px 60px}
.promo-img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:16px;background:var(--carbon3);margin-bottom:24px}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--orange);background:rgba(232,93,32,0.1);border:0.5px solid rgba(232,93,32,0.28);padding:4px 12px;border-radius:99px;margin-bottom:14px}
h1{font-family:'Barlow Condensed',sans-serif;font-size:clamp(28px,7vw,42px);font-weight:900;text-transform:uppercase;line-height:1.02;margin-bottom:14px}
.desc{font-size:15px;color:var(--text-muted);line-height:1.65;margin-bottom:20px;white-space:pre-wrap}
.vigencia{font-size:13px;color:var(--text-dim);margin-bottom:28px}
.almacen-card{background:var(--carbon3);border:0.5px solid var(--border-hi);border-radius:12px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.almacen-card .nombre{font-weight:700;font-size:15px}
.almacen-card .ciudad{font-size:13px;color:var(--text-dim)}
.btn-wa{display:inline-flex;align-items:center;gap:8px;background:#25D366;color:#0D0F12;font-weight:700;font-size:14px;padding:10px 18px;border-radius:8px;text-decoration:none;white-space:nowrap}
.loading,.empty{min-height:50vh;display:flex;align-items:center;justify-content:center;color:var(--text-dim);flex-direction:column;gap:12px}
.spinner{width:28px;height:28px;border:2px solid rgba(255,255,255,0.1);border-top-color:var(--orange);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
footer{text-align:center;padding:24px;color:var(--text-dim);font-size:12px;border-top:0.5px solid var(--border);margin-top:40px}
footer a{color:var(--orange);text-decoration:none}
</style>
</head>
<body>
<nav class="topbar"><strong>RIDERA</strong></nav>

<div id="loading" class="loading"><div class="spinner"></div><span>Cargando promoción...</span></div>
<div id="empty" class="empty" style="display:none"><span>Esta promoción ya no está disponible.</span></div>

<div class="container" id="content" style="display:none">
  <img id="promoImg" class="promo-img" style="display:none">
  <span class="badge">Promoción</span>
  <h1 id="promoTitulo"></h1>
  <p class="desc" id="promoDesc"></p>
  <p class="vigencia" id="promoVigencia"></p>
  <div class="almacen-card">
    <div>
      <div class="nombre" id="almacenNombre"></div>
      <div class="ciudad" id="almacenCiudad"></div>
    </div>
    <a class="btn-wa" id="btnWhatsapp" target="_blank">💬 Escribir por WhatsApp</a>
  </div>
</div>

<footer>Ridera — Directorio de almacenes y repuestos. <a href="/almacenes">Ver directorio</a></footer>

<script>
const SB_URL = 'https://vzzxsdtsaahhzyctvmhx.supabase.co';
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ6enhzZHRzYWFoaHp5Y3R2bWh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzNzU3NzIsImV4cCI6MjA5Njk1MTc3Mn0.5GZRCUuMx7fwmvoo48nXVCq9QJs0ysCzz0TPr9mmcNI';

async function init() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  if (!id) return showEmpty();

  const module = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.4/+esm');
  const sb = module.createClient(SB_URL, ANON_KEY);

  const { data: promo, error } = await sb
    .from('almacen_promociones')
    .select('*, almacenes(nombre, ciudad, telefono, slug)')
    .eq('id', id)
    .maybeSingle();

  if (error || !promo || !promo.almacenes) return showEmpty();

  const almacen = promo.almacenes;

  document.title = `${promo.titulo} — ${almacen.nombre} | Ridera`;
  document.getElementById('pageTitle').textContent = document.title;
  document.getElementById('ogTitle').content = `${promo.titulo} — ${almacen.nombre}`;
  document.getElementById('ogDesc').content = promo.descripcion || '';
  if (promo.imagen_url) document.getElementById('ogImage').content = promo.imagen_url;

  if (promo.imagen_url) {
    const img = document.getElementById('promoImg');
    img.src = promo.imagen_url;
    img.style.display = 'block';
  }

  document.getElementById('promoTitulo').textContent = promo.titulo;
  document.getElementById('promoDesc').textContent = promo.descripcion || '';

  if (promo.fecha_fin) {
    const fecha = new Date(promo.fecha_fin + 'T00:00:00');
    document.getElementById('promoVigencia').textContent = `Válida hasta el ${fecha.toLocaleDateString('es-CO', { day: 'numeric', month: 'long', year: 'numeric' })}`;
  }

  document.getElementById('almacenNombre').textContent = almacen.nombre;
  document.getElementById('almacenCiudad').textContent = almacen.ciudad || '';

  const btnWa = document.getElementById('btnWhatsapp');
  if (almacen.telefono) {
    const msg = encodeURIComponent(`Hola, vi la promoción "${promo.titulo}" en Ridera y quiero más info.`);
    btnWa.href = `https://wa.me/${almacen.telefono.replace(/\D/g, '')}?text=${msg}`;
  } else {
    btnWa.style.display = 'none';
  }

  document.getElementById('loading').style.display = 'none';
  document.getElementById('content').style.display = 'block';
}

function showEmpty() {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('empty').style.display = 'flex';
}

init();
</script>
</body>
</html>
